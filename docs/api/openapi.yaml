  # ---- Verification Foundation (ADR-008, verification.md §3-§5C) — ĐÃ TRIỂN KHAI (2026-08-06).
  # `Verification.Verify`/`Verification.Reject` moderator-only, KHÔNG hậu tố scope (Owner Decision
  # 2026-08-06 mục 2 — KHÔNG cấp `business_owner`, KHÔNG biến thể `.Managed`). `Verification.Vote`
  # local_guide + DAG (moderator/administrator/super_administrator kế thừa qua `role_parents` sẵn
  # có). KHÔNG endpoint nào ở đây cần `@AuthorizationContext` (permission global).
  #
  # CLAIM -> SOURCE -> VERIFICATION INTEGRATION (2026-08-06): Business Claim (ADR-015) KHÔNG đi qua
  # các endpoint HTTP này, NHƯNG từ nay đi qua CHÍNH hệ Verification ở tầng service
  # (`VerificationsService.ensureOfficialFromClaim()`) — approve claim tạo một `sources`
  # (`type=business_owner`) rồi transition dòng `verifications` của place sang `official`
  # (`method=owner_claim`) kèm `verification_events` + đồng bộ cache, tất cả trong CÙNG transaction
  # với quyết định claim. `BusinessClaimsService` KHÔNG còn ghi thẳng `places.verification_status`/
  # `verified_at` (ngoại lệ chuyển tiếp ĐÃ ĐÓNG) — bảng `verifications` là nguồn sự thật DUY NHẤT.
  # Xem /business-claims/{id}/decide và ADR-008 §Tình trạng triển khai.
  /verifications:
    post:
      tags: [Verification]
      summary: Gửi (hoặc gửi lại) một target vào hàng đợi xác minh (Verification.Verify)
      operationId: submitVerification
      description: >-
        `target_type`+`target_id` ánh xạ đúng MỘT trong ba FK exclusive-arc (place/contact/
        price_history). Target CHƯA từng có dòng xác minh → tạo mới (`pending`). Target đã có dòng
        đang `expired`/`rejected` → gửi lại, TÁI SỬ DỤNG cùng dòng (không insert mới, `id` giữ
        nguyên). Target đang có dòng active khác (`pending`/`verified`/`official`/
        `community_verified`) → 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type: { type: string, enum: [place, contact, price_history] }
                target_id: { type: string, format: uuid }
                note: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Created (dòng mới) hoặc OK-tái-sử-dụng (gửi lại) — luôn 201, `data.id` giữ nguyên khi gửi lại.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Verification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Verify }
        '404': { description: Không tìm thấy target (place/contact/price_history) }
        '409':
          description: >-
            Xung đột đồng thời — HAI dạng, cùng ngữ nghĩa "đọc lại rồi thử lại": (a) một request khác
            vừa gửi xác minh cho CHÍNH target này (partial-unique index `uq_verif_place`/`_contact`/
            `_price` là chốt chặn cuối, ADR-008 CORRECTION finding T1); (b) target đang mang trạng
            thái xác minh TIN CẬY nhưng KHÔNG có dòng `verifications` sở hữu nó — dữ liệu ghi TRƯỚC
            khi CLAIM -> SOURCE -> VERIFICATION INTEGRATION tồn tại; nhận vào hàng đợi sẽ âm thầm hạ
            cấp badge công khai đó xuống `pending`, nên bị từ chối.
        '422': { description: Target đã có dòng xác minh đang active (không phải expired/rejected) }
    get:
      tags: [Verification]
      summary: Hàng đợi xác minh (Verification.Verify)
      operationId: listVerifications
      description: Thứ tự CỐ ĐỊNH priority DESC, created_at ASC — không có tham số sort tuỳ chỉnh.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VerificationStatus' } }
        - { name: assigned_to, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Verification' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Verify }
  /verifications/{id}:
    get:
      tags: [Verification]
      summary: Chi tiết xác minh (Verification.Verify)
      operationId: getVerification
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Verification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Verify }
        '404': { $ref: '#/components/responses/NotFound' }
  /verifications/{id}/events:
    get:
      tags: [Verification]
      summary: Lịch sử chuyển trạng thái, append-only (Verification.Verify)
      operationId: listVerificationEvents
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/VerificationEvent' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Verify }
        '404': { $ref: '#/components/responses/NotFound' }
  /verifications/{id}/claim:
    post:
      tags: [Verification]
      summary: Moderator nhận việc (Verification.Verify)
      operationId: claimVerification
      description: >-
        KHÔNG phải status transition (không ghi verification_events) — chỉ set assigned_to/
        assigned_at/sla_due_at/priority. `sla_due_at` mặc định +48h nếu bỏ trống. Đã được moderator
        KHÁC nhận việc → 403 (re-claim chính mình thì OK).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                priority: { type: integer, minimum: 0, maximum: 3 }
                sla_due_at: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Verification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Verify, hoặc đã được moderator khác nhận việc }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /verifications/{id}/verify:
    post:
      tags: [Verification]
      summary: pending|community_verified -> verified (Verification.Verify)
      operationId: verifyVerification
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source_id: { type: string, format: uuid }
                confidence: { type: integer, minimum: 0, maximum: 100 }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Verification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Verify }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Trạng thái hiện tại không cho phép verify }
  /verifications/{id}/official:
    post:
      tags: [Verification]
      summary: pending|verified|community_verified -> official (Verification.Verify)
      operationId: officialVerification
      description: >-
        `source_id` BẮT BUỘC, PHẢI thuộc nhóm nguồn chính thức (business_owner/official_website/
        government — source.md §4.1), khác đi → 422. `expires_at` mặc định +12 tháng khi bỏ trống;
        `null` tường minh chỉ chấp nhận khi target KHÔNG phải price_history (price_history bắt buộc
        có hạn — verification.md §7).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string, format: uuid }
                confidence: { type: integer, minimum: 0, maximum: 100 }
                note: { type: string, maxLength: 300 }
                expires_at: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Verification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Verify }
        '404': { description: Không tìm thấy verification, hoặc không tìm thấy source }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Trạng thái hiện tại không cho phép official, source sai nhóm chính thức, hoặc thiếu expires_at bắt buộc (price_history) }
  /verifications/{id}/reject:
    post:
      tags: [Verification]
      summary: pending|verified|official|community_verified -> rejected (Verification.Reject)
      operationId: rejectVerification
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { $ref: '#/components/schemas/VerificationReasonCode' }
                rejected_reason: { type: string, maxLength: 300 }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Verification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Reject }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Trạng thái hiện tại không cho phép reject (vd expired — phải gửi lại trước) }
  /verifications/{id}/votes:
    post:
      tags: [Verification]
      summary: Bỏ/đổi phiếu cộng đồng, idempotent (Verification.Vote)
      operationId: castVerificationVote
      description: >-
        Đổi phiếu = gọi lại với `vote` khác (UPDATE dòng hiện có, KHÔNG nhân đôi — `uq_vote_user`).
        Trọng số ĐỒNG NHẤT = 1 ở milestone này (verification.md §10 mục 7 còn mở, chưa chốt bảng
        trọng số theo vai trò). Đủ ngưỡng (Σweight(confirm) ≥ 5 và dispute/confirm < 0.2) VÀ đang
        `pending` → tự động chuyển `community_verified` trong CÙNG request.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vote]
              properties:
                vote: { type: string, enum: [confirm, dispute] }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Verification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Verification.Vote }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

