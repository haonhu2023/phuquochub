# PhuQuocHub — OpenAPI 3.1 (đặc tả contract, KHÔNG phải code).
# Dẫn xuất từ docs/api/api.md; enum & schema khớp database.md + Data Dictionary (ORM: TypeORM).
# Wave 2 (ADR-002 Accepted): Hotel/Restaurant/Tour = Place extension (satellite); Event = peer/Hybrid.
openapi: 3.1.0

info:
  title: PhuQuocHub API
  version: 1.0.0
  description: >-
    REST API cho nền tảng tri thức Phú Quốc (Wikipedia + Reddit + Google Maps).
    Đa kênh: Web/Mobile (/api), Public (/public/v1, chỉ đọc), Partner (/partner/v1).
    Mọi phản hồi bọc envelope { success, data, meta } hoặc { success, error }.
  license:
    name: Proprietary
  contact:
    name: PhuQuocHub

servers:
  - url: https://api.phuquochub.example/api
    description: Web/Mobile (nội bộ) — base path /api; versioning /v1 hoãn tới khi ADR-010 (Proposed) được Accepted
  - url: https://api.phuquochub.example/public/v1
    description: Public API (chỉ đọc, API key, ghi công ODbL)
  - url: https://api.phuquochub.example/partner/v1
    description: Partner API (OAuth2 client-credentials)

tags:
  - name: Auth
  - name: Users
  - name: RBAC
  - name: Categories
  - name: Places
  - name: Contacts
  - name: Prices
  - name: Verification
  - name: Hotels
  - name: Restaurants
  - name: Tours
  - name: Events
  - name: Reviews
  - name: Community
  - name: Business
  - name: Media
  - name: Weather
  - name: AI
  - name: Search
  - name: Notification
  - name: Audit

security:
  - bearerAuth: []

paths:
  # ============================ AUTH ============================
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthTokenResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới access token
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      operationId: authLogout
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Xác minh email bằng token
      operationId: authVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Yêu cầu đặt lại mật khẩu
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu bằng token
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /auth/google:
    get:
      tags: [Auth]
      summary: Bắt đầu OAuth Google (redirect)
      operationId: authGoogle
      security: []
      responses:
        '302': { description: Redirect tới Google }

  # ============================ USERS ============================
  /users/me:
    get:
      tags: [Users]
      summary: Hồ sơ của tôi
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Cập nhật hồ sơ của tôi
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                avatar_url: { type: string, format: uri }
                preferences: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/User' } }
  /users/{id}:
    get:
      tags: [Users]
      summary: Hồ sơ công khai
      operationId: getUser
      security: []
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/PublicUser' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/contributions:
    get:
      tags: [Users]
      summary: Danh sách đóng góp của người dùng
      operationId: getUserContributions
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200': { $ref: '#/components/responses/CollectionResponse' }
  /users/{id}/roles:
    post:
      tags: [Users, RBAC]
      summary: Gán vai trò cho principal
      operationId: assignUserRole
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string, format: uuid }
                scope_type: { $ref: '#/components/schemas/ScopeType' }
                business_id: { type: [string, 'null'], format: uuid }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}/roles/{roleId}:
    delete:
      tags: [Users, RBAC]
      summary: Thu hồi vai trò
      operationId: revokeUserRole
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}/ban:
    post:
      tags: [Users]
      summary: Ban người dùng
      operationId: banUser
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                duration: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================ RBAC ============================
  /roles:
    get:
      tags: [RBAC]
      summary: Danh sách vai trò
      operationId: listRoles
      responses: { '200': { $ref: '#/components/responses/CollectionResponse' } }
    post:
      tags: [RBAC]
      summary: Tạo vai trò
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
                parent_role_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Role' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /roles/{id}:
    patch:
      tags: [RBAC]
      summary: Sửa vai trò
      operationId: updateRole
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
    delete:
      tags: [RBAC]
      summary: Xóa vai trò (không cho xóa is_system)
      operationId: deleteRole
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '409': { $ref: '#/components/responses/Conflict' }
  /roles/{id}/permissions:
    post:
      tags: [RBAC]
      summary: Gán quyền cho vai trò
      operationId: addRolePermission
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_id]
              properties:
                permission_id: { type: string, format: uuid }
                effect: { $ref: '#/components/schemas/RolePermEffect' }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /roles/{id}/permissions/{permId}:
    delete:
      tags: [RBAC]
      summary: Gỡ quyền khỏi vai trò
      operationId: removeRolePermission
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: permId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /permissions:
    get:
      tags: [RBAC]
      summary: Danh sách quyền
      operationId: listPermissions
      responses: { '200': { $ref: '#/components/responses/CollectionResponse' } }

  # ============================ CATEGORIES ============================
  /categories:
    get:
      tags: [Categories]
      summary: Danh sách danh mục
      operationId: listCategories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Category' } } }
    post:
      tags: [Categories]
      summary: Tạo danh mục (cần Category.Manage)
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Category' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories/{id}:
    get:
      tags: [Categories]
      summary: Chi tiết danh mục
      operationId: getCategory
      security: []
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Category' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Categories]
      summary: Cập nhật danh mục (cần Category.Manage)
      operationId: updateCategory
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Category' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Categories]
      summary: Xóa danh mục (cần Category.Manage)
      operationId: deleteCategory
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ PLACES ============================
  /places:
    get:
      tags: [Places]
      summary: Danh sách địa điểm
      operationId: listPlaces
      security: []
      description: >-
        Danh sách Place công khai — CHỈ trả về Place `published`.
        Hợp đồng phân trang OFFSET (`page`/`limit`) đã được CHỐT là hợp đồng chính thức
        (ADR-010 Accepted 2026-07-24 / OD-B1; GAP-05, GAP-10 resolved). KHÔNG hỗ trợ cursor.
        Sắp xếp CỐ ĐỊNH phía server: `rating_avg DESC NULLS LAST, created_at DESC, id ASC`
        (khoá cuối duy nhất ⇒ phân trang xác định). Client KHÔNG điều khiển được thứ tự.
        Tham số không nằm trong danh sách dưới đây bị TỪ CHỐI **400**
        (`ValidationPipe` chạy với `whitelist` + `forbidNonWhitelisted`).
        Bộ lọc địa lý KHÔNG có ở endpoint này — dùng `/geo/nearby` hoặc `/geo/bbox`.
      parameters:
        - name: category
          in: query
          description: Lọc theo `category_id`. So khớp chính xác.
          schema: { type: string }
        - name: ward
          in: query
          description: Lọc theo tên phường/xã. So khớp chính xác.
          schema: { type: string }
        - name: price_range
          in: query
          description: Lọc theo khoảng giá. Giá trị ngoài enum bị TỪ CHỐI **400** (VALIDATION_ERROR).
          schema: { $ref: '#/components/schemas/PriceRange' }
        - name: page
          in: query
          description: Trang, bắt đầu từ 1. Giá trị `< 1` hoặc không phải số nguyên bị TỪ CHỐI **400**; bỏ trống → 1.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: >-
            Số bản ghi mỗi trang. Bỏ trống → 20. Giá trị `< 1` hoặc không phải số nguyên bị TỪ CHỐI **400**.
            LƯU Ý: giá trị `> 100` KHÔNG bị từ chối mà bị CẮT XUỐNG 100 (`clampLimit`) —
            response vẫn 200 và `meta.pageSize` phản ánh giá trị đã cắt.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        # ---- Không được triển khai (F-6 / OD-F-6, 2026-07-23; xác nhận lại OD-B1 2026-07-24) ----
        # Ba tham số dưới đây từng được công bố nhưng CHƯA BAO GIỜ được triển khai. Vì
        # `forbidNonWhitelisted` đang bật, gửi chúng lên sẽ nhận HTTP 400 chứ không phải bị bỏ qua.
        # QUYẾT ĐỊNH ĐÃ CHỐT (OD-B1 / ADR-010 Accepted 2026-07-24): hợp đồng chính thức là OFFSET
        # `page`/`limit`; cursor KHÔNG được áp dụng cho v1. Ba tham số này GIỮ deprecated (không xoá)
        # theo OD-F-6 — chưa loại trừ được consumer ngoài — và sẽ chỉ được gỡ ở một major version
        # mới kèm header `Deprecation`/`Sunset` theo ADR-010. Chúng KHÔNG phải tham số hợp lệ.
        - name: status
          in: query
          deprecated: true
          description: >-
            KHÔNG ĐƯỢC TRIỂN KHAI — gửi lên sẽ nhận HTTP 400. Kênh công khai luôn cố định
            `published`. Lọc theo trạng thái là ĐẶC QUYỀN kiểm duyệt (GAP-02/04) và sẽ được
            cung cấp qua endpoint riêng có kiểm tra quyền, không phải qua tham số công khai này.
          schema: { $ref: '#/components/schemas/PlaceStatus' }
        - name: sort
          in: query
          deprecated: true
          description: >-
            KHÔNG ĐƯỢC TRIỂN KHAI — gửi lên sẽ nhận HTTP 400. Thứ tự do server quyết định
            (xem `description` của operation) và client không điều khiển được.
          schema: { type: string }
        - name: cursor
          in: query
          deprecated: true
          description: >-
            KHÔNG ĐƯỢC TRIỂN KHAI — gửi lên sẽ nhận HTTP 400. Endpoint này phân trang bằng
            OFFSET (`page`/`limit`). Cursor/keyset ĐÃ ĐƯỢC QUYẾT ĐỊNH KHÔNG áp dụng cho v1
            (OD-B1 / ADR-010 Accepted 2026-07-24; GAP-05/10 resolved). Nếu áp dụng về sau, phải
            đi kèm một major version mới theo ADR-010 — không tái sử dụng tham số offset hiện tại.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlaceCard' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Places]
      summary: Tạo địa điểm (đi qua contribution/revision)
      operationId: createPlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Place' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /places/{slug}:
    get:
      tags: [Places]
      summary: Chi tiết địa điểm theo slug
      operationId: getPlace
      security: []
      parameters: [{ $ref: '#/components/parameters/SlugPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Place' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /places/{id}:
    patch:
      tags: [Places]
      summary: Sửa địa điểm
      operationId: updatePlace
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PlaceInput' } } }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Places]
      summary: Lưu trữ địa điểm (soft delete)
      operationId: archivePlace
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /places/{id}/approve:
    post:
      tags: [Places]
      summary: Duyệt & công khai địa điểm
      operationId: approvePlace
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /places/{id}/revisions:
    get:
      tags: [Places]
      summary: Lịch sử phiên bản (wiki_revisions)
      operationId: listPlaceRevisions
      security: []
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/WikiRevision' } }
  /geo/nearby:
    get:
      tags: [Places]
      summary: Địa điểm trong bán kính
      operationId: geoNearby
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: radius, in: query, schema: { type: integer, description: mét } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlaceCard' } }
  /geo/bbox:
    get:
      tags: [Places]
      summary: Điểm gom cụm theo bbox
      operationId: geoBbox
      security: []
      parameters:
        - { name: minLng, in: query, required: true, schema: { type: number } }
        - { name: minLat, in: query, required: true, schema: { type: number } }
        - { name: maxLng, in: query, required: true, schema: { type: number } }
        - { name: maxLat, in: query, required: true, schema: { type: number } }
        - { name: zoom, in: query, schema: { type: integer } }
