  # ========================== ATTRACTIONS ==========================
  /attractions:
    get:
      tags: [Attractions]
      summary: Danh sách điểm tham quan
      operationId: listAttractions
      security: []
      description: >-
        Điểm tham quan là Place có `categories.slug = 'attraction'` — KHÔNG có bảng vệ tinh
        riêng (khác Hotel/Restaurant/Tour theo ADR-002), nên endpoint này là một khung nhìn
        theo danh mục trên chính `places`. Chỉ có đường ĐỌC danh sách: chi tiết vẫn là
        `GET /places/{slug}` (một URL chi tiết duy nhất cho mỗi Place), tạo/sửa vẫn là
        `POST|PATCH /places`.


        Sắp xếp CỐ ĐỊNH phía server theo `sort` dưới đây, luôn có khoá phụ `id ASC` ⇒ phân
        trang xác định. Client KHÔNG truyền được tên cột/hướng sắp xếp.
        Tham số ngoài danh sách này bị TỪ CHỐI **400** (`whitelist` + `forbidNonWhitelisted`).


        KHÔNG triển khai, có chủ ý: `category` (điểm tham quan ĐÃ LÀ một category; bảng
        `categories` phẳng — duyệt danh mục khác thì dùng `GET /places?category=`),
        `district` (schema chỉ có `ward`), `free_entry` (trùng nghĩa `price_range=free`),
        `family_friendly`/`indoor`/`outdoor` (không có cột nào tương ứng — cần migration +
        nguồn dữ liệu), và `open_now` (common/opening-hours.ts mới chỉ validate CẤU TRÚC
        opening_hours, chưa đánh giá thời điểm theo timezone/khung qua đêm/ngoại lệ ngày lễ —
        cùng lý do đã ghi ở `GET /restaurants`).
      parameters:
        - name: ward
          in: query
          description: Lọc theo tên phường/xã (`places.ward`). So khớp chính xác; giá trị lạ → 0 kết quả, không phải 400.
          schema: { type: string, maxLength: 120 }
        - { name: price_range, in: query, schema: { $ref: '#/components/schemas/PriceRange' } }
        - name: sort
          in: query
          description: >-
            `rating_desc` → `rating_avg DESC NULLS LAST, created_at DESC, id ASC`;
            `name_asc` → `name ASC, id ASC`; `newest` → `created_at DESC, id ASC`.
          schema: { type: string, enum: [rating_desc, name_asc, newest], default: rating_desc }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          description: Bỏ trống → 20. Giá trị `> 100` KHÔNG bị từ chối mà bị CẮT xuống 100 (`clampLimit`), giống `GET /places`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses: { '200': { $ref: '#/components/responses/CollectionResponse' } }

  # ============================ BEACHES ============================
  /beaches:
    get:
      tags: [Beaches]
      summary: Danh sách bãi biển
      operationId: listBeaches
      security: []
      description: >-
        Bãi biển là Place có `categories.slug = 'beach'` — KHÔNG có bảng vệ tinh riêng (giống
        Attractions; khác Hotel/Restaurant/Tour theo ADR-002), nên endpoint này là một khung
        nhìn theo danh mục trên chính `places`. Chỉ có đường ĐỌC danh sách: chi tiết vẫn là
        `GET /places/{slug}` (một URL chi tiết duy nhất cho mỗi Place), tạo/sửa vẫn là
        `POST|PATCH /places`.


        Sắp xếp CỐ ĐỊNH phía server theo `sort` dưới đây, luôn có khoá phụ `id ASC` ⇒ phân trang
        xác định. Với dữ liệu hiện tại đây KHÔNG phải phòng xa: toàn bộ 10 bãi biển seed đều có
        `rating_avg` NULL và `created_at` chung, nên hai khoá đầu hoà hoàn toàn.
        Tham số ngoài danh sách này bị TỪ CHỐI **400** (`whitelist` + `forbidNonWhitelisted`).


        KHÔNG triển khai, có chủ ý: `category` (bãi biển ĐÃ LÀ một category; bảng `categories`
        phẳng), `district` (schema chỉ có `ward`), `free_entry` (trùng nghĩa `price_range=free`),
        và các thuộc tính đặc thù bãi biển như `swimming`/`lifeguard`/`facilities`/
        `water_quality` — KHÔNG có cột nào tương ứng, và đây là loại thông tin an toàn phải có
        nguồn kiểm chứng, không được suy đoán từ mô tả.
      parameters:
        - name: ward
          in: query
          description: Lọc theo tên phường/xã (`places.ward`). So khớp chính xác; giá trị lạ → 0 kết quả, không phải 400.
          schema: { type: string, maxLength: 120 }
        - name: price_range
          in: query
          description: >-
            Lọc theo `places.price_range`. LƯU Ý dữ liệu hiện tại: 7/10 bãi biển seed là `free`,
            3 bãi để NULL — `low`/`mid`/`high` là giá trị hợp lệ nhưng hiện trả về 0 kết quả.
          schema: { $ref: '#/components/schemas/PriceRange' }
        - name: sort
          in: query
          description: >-
            `rating_desc` → `rating_avg DESC NULLS LAST, created_at DESC, id ASC`;
            `name_asc` → `name ASC, id ASC`; `newest` → `created_at DESC, id ASC`.
          schema: { type: string, enum: [rating_desc, name_asc, newest], default: rating_desc }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          description: Bỏ trống → 20. Giá trị `> 100` KHÔNG bị từ chối mà bị CẮT xuống 100 (`clampLimit`), giống `GET /places`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses: { '200': { $ref: '#/components/responses/CollectionResponse' } }

  # =========================== TRANSPORTS ===========================
  # ADR-017 (Accepted 2026-07-28) — nhiệm vụ NỀN TẢNG: chỉ đọc (list/detail/type lookup).
  # Bộ lọc nội dung (transport_type/ward/pricing_model/booking_required/airport_transfer) đã
  # THIẾT KẾ ở docs/data/modules/transport.md §8 nhưng CHƯA triển khai — thuộc nhiệm vụ Transport
  # Browse kế tiếp. Gửi bất kỳ tham số nào ngoài sort/page/limit bị từ chối 400
  # (`forbidNonWhitelisted`), không âm thầm bỏ qua.
  /transports:
    get:
      tags: [Transports]
      summary: Danh sách dịch vụ vận chuyển, có bộ lọc (loại hình/khu vực/mô hình giá/cờ tri-state)
      operationId: listTransports
      security: []
      description: >-
        Transport là Place có `categories.slug = 'transport'` **CÓ** bảng vệ tinh 1:1
        (`place_transport_details`, khác Attractions/Beaches) nhưng trục phân loại chính
        (`transport_type`) là một BẢNG TỪ ĐIỂN (`transport_types`, xem `GET /transport-types`),
        không phải ENUM đóng như `hotel_type`/`tour_type` — cho phép thêm loại hình mới chỉ bằng
        INSERT, không cần migration (ADR-017).


        Transport Browse Filters (2026-07-30): `transport_type`/`ward`/`pricing_model`/
        `booking_required`/`airport_transfer` nay đã hỗ trợ, khớp đúng thiết kế
        docs/data/modules/transport.md §8. `category`/`district`/`capacity_min`/`capacity_max`/
        `provider` vẫn bị từ chối `400` (`forbidNonWhitelisted`) — hoãn/không hỗ trợ, không âm
        thầm bỏ qua.
      parameters:
        - name: transport_type
          in: query
          description: Mã trong `transport_types.code` (vd `taxi`, `ferry`) — so khớp chính xác.
          schema: { type: string }
        - name: ward
          in: query
          description: Text tự do, khớp qua `EXISTS` trên `transport_service_areas` (1:N — khác cột `places.ward` đơn của Hotel/Restaurant/Tour). Giá trị lạ → 0 kết quả, không phải 400.
          schema: { type: string, maxLength: 120 }
        - { name: pricing_model, in: query, schema: { $ref: '#/components/schemas/PricingModel' } }
        - name: booking_required
          in: query
          description: >-
            Tri-state — CHỈ khớp giá trị TƯỜNG MINH (`booking_required=false` KHÔNG khớp `NULL`
            — chưa xác nhận ≠ đã xác nhận là không cần đặt trước). Chỉ chấp nhận đúng chuỗi
            `true`/`false`; giá trị khác → 400.
          schema: { type: boolean }
        - name: airport_transfer
          in: query
          description: Cùng quy tắc tri-state như `booking_required`.
          schema: { type: boolean }
        - name: sort
          in: query
          description: >-
            `rating_desc` → `rating_avg DESC NULLS LAST, created_at DESC, id ASC`;
            `name_asc` → `name ASC, id ASC`; `newest` → `created_at DESC, id ASC`.
          schema: { type: string, enum: [rating_desc, name_asc, newest], default: rating_desc }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          description: Bỏ trống → 20. Giá trị `> 100` KHÔNG bị từ chối mà bị CẮT xuống 100 (`clampLimit`).
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application\json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TransportSummary' } }
  /transports/{slug}:
    get:
      tags: [Transports]
      summary: Chi tiết dịch vụ vận chuyển
      operationId: getTransport
      security: []
      description: >-
        Endpoint chi tiết RIÊNG (không dùng chung `/places/{slug}` như Attraction/Beach) — Transport
        có con 1:N thật sự cần ghép (`service_options`/`routes`/`service_areas`), cùng lý do
        Hotel/Tour có endpoint chi tiết riêng.
      parameters: [{ $ref: '#/components/parameters/SlugPath' }]
      responses:
        '200':
          description: OK
          content:
            application\json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/TransportDetail' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /transport-types:
    get:
      tags: [Transports]
      summary: Từ điển loại hình vận chuyển
      operationId: listTransportTypes
      security: []
      description: >-
        Route phẳng, top-level (không lồng dưới `/transports`) — cùng vị trí kiến trúc với
        `/categories`. Chỉ trả loại hình còn `is_active=true`, sắp theo `sort_order`. Đây là
        vertical ĐẦU TIÊN có từ điển tra cứu được thật qua API (Hotel `amenities`/Restaurant
        `cuisines`/`ward` mọi vertical khác đều KHÔNG có endpoint tương đương — frontend các
        vertical đó hardcode danh sách).
      responses:
        '200':
          description: OK
          content:
            application\json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TransportType' } }

