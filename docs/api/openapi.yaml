      summary: Kiểm duyệt media
      operationId: moderateMedia
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }

  # ============================ WEATHER ============================
  /weather/current:
    get:
      tags: [Weather]
      summary: Thời tiết hiện tại
      operationId: getWeatherCurrent
      security: []
      parameters:
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: area, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/ObjectResponse' } }
  /weather/forecast:
    get:
      tags: [Weather]
      summary: Dự báo
      operationId: getWeatherForecast
      security: []
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 7 } }
      responses: { '200': { $ref: '#/components/responses/ObjectResponse' } }
  /weather/marine:
    get:
      tags: [Weather]
      summary: Thời tiết biển (tour)
      operationId: getWeatherMarine
      security: []
      responses: { '200': { $ref: '#/components/responses/ObjectResponse' } }

  # ============================ AI ============================
  /ai/places/{id}/summary:
    post:
      tags: [AI]
      summary: Sinh tóm tắt AI (bất đồng bộ)
      operationId: aiGenerateSummary
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { language: { type: string }, force: { type: boolean } }
      responses: { '202': { $ref: '#/components/responses/AiJobAccepted' } }
  /ai/places/{id}/faq:
    post:
      tags: [AI]
      summary: Sinh FAQ AI
      operationId: aiGenerateFaq
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '202': { $ref: '#/components/responses/AiJobAccepted' } }
  /ai/translate:
    post:
      tags: [AI]
      summary: Dịch nội dung
      operationId: aiTranslate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_lang]
              properties:
                text: { type: string }
                entity_ref: { type: string }
                target_lang: { type: string }
      responses: { '202': { $ref: '#/components/responses/AiJobAccepted' } }
  /ai/suggestions/places:
    get:
      tags: [AI]
      summary: Gợi ý địa điểm (từ tín hiệu 0-kết-quả)
      operationId: aiSuggestPlaces
      responses: { '200': { $ref: '#/components/responses/CollectionResponse' } }

  # ============================ SEARCH ============================
  /search:
    get:
      tags: [Search]
      summary: Tìm kiếm trộn nhiều loại
      operationId: search
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: type, in: query, schema: { type: string, enum: [place, hotel, restaurant, tour, event, community] } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/CursorParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/SearchResult' } } }
  /search/suggest:
    get:
      tags: [Search]
      summary: Gợi ý autocomplete
      operationId: searchSuggest
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/CollectionResponse' } }
  /search/reindex:
    post:
      tags: [Search]
      summary: Đánh chỉ mục lại
      operationId: searchReindex
      responses: { '202': { $ref: '#/components/responses/EmptySuccess' } }

  # ============================ NOTIFICATION ============================
  /notifications:
    get:
      tags: [Notification]
      summary: Danh sách thông báo
      operationId: listNotifications
      responses: { '200': { $ref: '#/components/responses/CollectionResponse' } }
  /notifications/{id}/read:
    patch:
      tags: [Notification]
      summary: Đánh dấu đã đọc
      operationId: markNotificationRead
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /notifications/read-all:
    patch:
      tags: [Notification]
      summary: Đánh dấu đã đọc tất cả
      operationId: markAllNotificationsRead
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /notifications/preferences:
    get:
      tags: [Notification]
      summary: Lấy tùy chọn thông báo
      operationId: getNotificationPreferences
      responses: { '200': { $ref: '#/components/responses/ObjectResponse' } }
    patch:
      tags: [Notification]
      summary: Cập nhật tùy chọn
      operationId: updateNotificationPreferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: boolean }
                push: { type: boolean }
                in_app: { type: boolean }
                categories: { type: array, items: { type: string } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /notifications/devices:
    post:
      tags: [Notification]
      summary: Đăng ký thiết bị push (mobile)
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token, platform]
              properties:
                push_token: { type: string }
                platform: { type: string, enum: [ios, android, web] }
      responses: { '201': { $ref: '#/components/responses/EmptySuccess' } }
  /notifications/broadcast:
    post:
      tags: [Notification]
      summary: Gửi broadcast (admin)
      operationId: broadcastNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, title, body]
              properties:
                audience: { type: string }
                title: { type: string }
                body: { type: string }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }

  # ============================ AUDIT (ADR-016) ============================
  /audit:
    get:
      tags: [Audit]
      summary: Nhật ký kiểm toán (append-only, chỉ đọc)
      operationId: listAuditLogs
      parameters:
        - { name: event, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: result, in: query, schema: { $ref: '#/components/schemas/AuditResult' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: correlation_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit/{id}:
    get:
      tags: [Audit]
      summary: Chi tiết một bản ghi kiểm toán
      operationId: getAuditLog
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/AuditLog' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audit/entities/{entityType}/{entityId}:
    get:
      tags: [Audit]
      summary: Dòng thời gian kiểm toán của một tài nguyên
      operationId: listEntityAuditLogs
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

# ============================ COMPONENTS ============================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    oauth2Partner:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /partner/v1/oauth/token
          scopes:
            hotels:write: Ghi dữ liệu khách sạn của đối tác
            tours:write: Ghi dữ liệu tour của đối tác

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CursorParam:
      name: cursor
      in: query
      schema: { type: string }
    SortParam:
      name: sort
      in: query
      schema: { type: string, description: 'field_asc | field_desc' }

  responses:
    EmptySuccess:
      description: Thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { type: [object, 'null'] }
    ObjectResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { type: object, additionalProperties: true } }
    CollectionResponse:
      description: OK (danh sách)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { type: array, items: { type: object, additionalProperties: true } } }
    AuthTokenResponse:
      description: Cấp token
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { $ref: '#/components/schemas/AuthToken' } }
    AiJobAccepted:
      description: Đã nhận, xử lý nền
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { $ref: '#/components/schemas/AiJob' } }
    BadRequest:
      description: Sai định dạng
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Chưa xác thực
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Không đủ quyền
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Không tìm thấy
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Xung đột (trùng/optimistic lock)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: Validation thất bại
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: Vượt rate limit/quota
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    # ---- Envelope ----
    # F-6 / OD-F-6 (2026-07-23): đồng bộ với envelope THỰC TẾ do common/pagination.ts `paginate()`
    # phát ra và với PaginationMeta trong @phuquochub/shared-types. Trước đây khai `limit` và
    # `next_cursor` — runtime không hề phát hai trường đó.
    Meta:
      type: object
      properties:
        timestamp: { type: string, format: date-time, description: 'ISO timestamp phía server.' }
        requestId: { type: string, description: 'Mã trace/correlation, nếu có.' }
        page: { type: integer, description: 'Trang hiện tại, bắt đầu từ 1.' }
        pageSize: { type: integer, description: 'Số bản ghi mỗi trang SAU khi đã cắt trần (clampLimit).' }
        total: { type: integer, description: 'Tổng số bản ghi khớp bộ lọc.' }
        totalPages: { type: integer, description: 'ceil(total / pageSize); 0 khi pageSize = 0.' }
        quota_remaining:
          type: integer
          deprecated: true
          description: 'KHÔNG được phát ra bởi các endpoint danh sách hiện có.'
        next_cursor:
          type: [string, 'null']
          deprecated: true
          description: >-
            KHÔNG được phát ra — chưa có endpoint nào phân trang bằng cursor. Xem GAP-05/10.
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [PLACE_NOT_FOUND] }
            message: { type: string }
            details: { type: array, items: { type: object, additionalProperties: true } }

    # ---- Enums ----
    PlaceStatus: { type: string, enum: [draft, pending, published, archived] }
    PriceRange: { type: string, enum: [free, low, mid, high] }
    VerificationStatus: { type: string, enum: [pending, verified, official, community_verified, expired, rejected] }
    VerificationReasonCode: { type: string, enum: [duplicate, fabricated, outdated, insufficient_evidence, policy_violation, wrong_target, other] }
    ClaimReasonCode: { type: string, enum: [insufficient_evidence, duplicate, fraud, wrong_target, other] }
    ScopeType: { type: string, enum: [global, managed, own] }
    RolePermEffect: { type: string, enum: [allow, deny] }
    AuditResult: { type: string, enum: [success, failure, allow, deny] }

    # ---- Common ----
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    AuthToken:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        user: { $ref: '#/components/schemas/User' }

    # ---- Entities ----
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        roles: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    PublicUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        is_system: { type: boolean }
        permissions: { type: array, items: { type: string } }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name_vi: { type: string }
        name_en: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        parent_id: { type: [string, 'null'], format: uuid }
    CategoryCreate:
      type: object
      required: [name_vi]
      properties:
        name_vi: { type: string, maxLength: 120 }
        name_en: { type: string, maxLength: 120 }
        icon: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 120, description: Bỏ trống → tự sinh từ name_vi }
        parent_id: { type: string, format: uuid }
    CategoryUpdate:
      type: object
      properties:
        name_vi: { type: string, maxLength: 120 }
        name_en: { type: string, maxLength: 120 }
        icon: { type: string, maxLength: 120 }
        parent_id: { type: string, format: uuid }
    PlaceCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/GeoPoint' }
        short_description: { type: [string, 'null'] }
        price_range: { $ref: '#/components/schemas/PriceRange' }
        cover_image_url: { type: [string, 'null'], format: uri }
        rating_avg: { type: [number, 'null'] }
        rating_count: { type: integer }
        verification_status: { $ref: '#/components/schemas/VerificationStatus' }
        # F-17 / OD-F-17 (2026-07-23): runtime LUÔN phát trường này (CARD_COLS chọn p.status;
        # places.mapper.ts đặt vô điều kiện) nhưng schema trước đây không khai. Đây là TRẠNG THÁI
        # XUẤT BẢN, KHÔNG phải giờ mở cửa của cơ sở (giờ mở cửa nằm ở `opening_hours`). Dùng đúng
        # enum PlaceStatus đã có sẵn — enum này vốn ĐÃ công khai qua schema `Place` bên dưới, nên
        # việc khai ở đây không lộ thêm bất kỳ thông tin nào và payload không đổi một byte.
        # Kênh công khai chỉ có thể quan sát `published` vì read công khai lọc theo trạng thái đó.
        status: { $ref: '#/components/schemas/PlaceStatus' }
        distance_m: { type: [number, 'null'] }
    Place:
      allOf:
        - $ref: '#/components/schemas/PlaceCard'
        - type: object
          properties:
            address: { type: [string, 'null'] }
            ward: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            opening_hours: { type: [object, 'null'], additionalProperties: true }
            status: { $ref: '#/components/schemas/PlaceStatus' }
            osm_id: { type: [integer, 'null'] }
            contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
            prices: { type: array, items: { $ref: '#/components/schemas/Price' } }
            media: { type: array, items: { $ref: '#/components/schemas/Media' } }
            faqs: { type: array, items: { type: object, additionalProperties: true } }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PlaceInput:
      type: object
      required: [name, category_id, location]
      properties:
        name: { type: string, maxLength: 200 }
        category_id: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/GeoPoint' }
        address: { type: string }
        ward: { type: string }
        description: { type: string }
        short_description: { type: string, maxLength: 300 }
        opening_hours: { type: object, additionalProperties: true }
        price_range: { $ref: '#/components/schemas/PriceRange' }
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_type: { type: string, examples: [place, business] }
        contact_type: { type: string, examples: [HOTLINE, PHONE, EMAIL, WEBSITE, FACEBOOK] }
        value: { type: string }
        label: { type: [string, 'null'] }
        is_primary: { type: boolean }
        verification_status: { $ref: '#/components/schemas/VerificationStatus' }
        display_order: { type: integer }
    ContactInput:
      type: object
      required: [contact_type, value]
      properties:
        contact_type: { type: string }
        value: { type: string }
        label: { type: string }
        is_primary: { type: boolean }
        display_order: { type: integer }
    Price:
      type: object
      properties:
        id: { type: string, format: uuid }
        service_name: { type: string }
        amount: { type: number }
        currency: { type: string, examples: [VND] }
        unit: { type: [string, 'null'] }
        is_free: { type: boolean }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        verification_status: { $ref: '#/components/schemas/VerificationStatus' }
    PriceInput:
      type: object
      required: [service_name, amount]
      properties:
        service_name: { type: string }
        amount: { type: number, minimum: 0 }
        currency: { type: string }
        unit: { type: string }
        is_free: { type: boolean }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        display_order: { type: integer }
    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [image, video] }
        url: { type: string, format: uri }
        thumbnail_url: { type: [string, 'null'], format: uri }
        caption: { type: [string, 'null'] }
        alt_text: { type: [string, 'null'] }
        status: { type: string, enum: [pending, published, hidden, rejected] }
    Verification:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: [string, 'null'], format: uuid }
        contact_id: { type: [string, 'null'], format: uuid }
        price_history_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/VerificationStatus' }
        method: { type: string, enum: [moderator, owner_claim, source_match, community_vote, system_auto] }
        confirm_count: { type: integer }
        dispute_count: { type: integer }
        lock_version: { type: integer }
        sla_due_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    WikiRevision:
      type: object
      properties:
        id: { type: string, format: uuid }
        revision_number: { type: integer }
        origin: { type: string }
        status: { type: string, enum: [pending, approved, rejected, reverted] }
        editor_id: { type: [string, 'null'], format: uuid }
        change_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Hotel:
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          properties:
            star_rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
            hotel_type: { type: string, enum: [resort, hotel, homestay, villa, guesthouse, apartment] }
            check_in: { type: [string, 'null'] }
            check_out: { type: [string, 'null'] }
            amenities: { type: array, items: { type: string } }
            room_types: { type: array, items: { $ref: '#/components/schemas/RoomType' } }
    RoomType:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer }
        amenities: { type: array, items: { type: string } }
        price_ref: { type: [number, 'null'] }
    MenuInput:
      type: object
      properties:
        sections:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    price: { type: number }
                    tags: { type: array, items: { type: string } }
    SearchResult:
      type: object
