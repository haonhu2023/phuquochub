# ============================ COMPONENTS ============================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    oauth2Partner:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /partner/v1/oauth/token
          scopes:
            hotels:write: Ghi dữ liệu khách sạn của đối tác
            tours:write: Ghi dữ liệu tour của đối tác

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CursorParam:
      name: cursor
      in: query
      schema: { type: string }
    SortParam:
      name: sort
      in: query
      schema: { type: string, description: 'field_asc | field_desc' }

  responses:
    EmptySuccess:
      description: Thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { type: [object, 'null'] }
    ObjectResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { type: object, additionalProperties: true } }
    CollectionResponse:
      description: OK (danh sách)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { type: array, items: { type: object, additionalProperties: true } } }
    AuthTokenResponse:
      description: Cấp token
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { $ref: '#/components/schemas/AuthToken' } }
    AiJobAccepted:
      description: Đã nhận, xử lý nền
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { $ref: '#/components/schemas/AiJob' } }
    BadRequest:
      description: Sai định dạng
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Chưa xác thực
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Không đủ quyền
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Không tìm thấy
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Xung đột (trùng/optimistic lock)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: Validation thất bại
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: Vượt rate limit/quota
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    # ---- Envelope ----
    # F-6 / OD-F-6 (2026-07-23): đồng bộ với envelope THỰC TẾ do common/pagination.ts `paginate()`
    # phát ra và với PaginationMeta trong @phuquochub/shared-types. Trước đây khai `limit` và
    # `next_cursor` — runtime không hề phát hai trường đó.
    Meta:
      type: object
      properties:
        timestamp: { type: string, format: date-time, description: 'ISO timestamp phía server.' }
        requestId: { type: string, description: 'Mã trace/correlation, nếu có.' }
        page: { type: integer, description: 'Trang hiện tại, bắt đầu từ 1.' }
        pageSize: { type: integer, description: 'Số bản ghi mỗi trang SAU khi đã cắt trần (clampLimit).' }
        total: { type: integer, description: 'Tổng số bản ghi khớp bộ lọc.' }
        totalPages: { type: integer, description: 'ceil(total / pageSize); 0 khi pageSize = 0.' }
        quota_remaining:
          type: integer
          deprecated: true
          description: 'KHÔNG được phát ra bởi các endpoint danh sách hiện có.'
        next_cursor:
          type: [string, 'null']
          deprecated: true
          description: >-
            KHÔNG được phát ra — chưa có endpoint nào phân trang bằng cursor. Xem GAP-05/10.
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [PLACE_NOT_FOUND] }
            message: { type: string }
            details: { type: array, items: { type: object, additionalProperties: true } }

    # ---- Enums ----
    PlaceStatus: { type: string, enum: [draft, pending, published, archived] }
    PriceRange: { type: string, enum: [free, low, mid, high] }
    VerificationStatus: { type: string, enum: [pending, verified, official, community_verified, expired, rejected] }
    VerificationReasonCode: { type: string, enum: [duplicate, fabricated, outdated, insufficient_evidence, policy_violation, wrong_target, other] }
    ClaimReasonCode: { type: string, enum: [insufficient_evidence, duplicate, fraud, wrong_target, other] }
    ScopeType: { type: string, enum: [global, managed, own] }
    RolePermEffect: { type: string, enum: [allow, deny] }
    AuditResult: { type: string, enum: [success, failure, allow, deny] }
    # PricingModel (ADR-017): nhỏ, ổn định, đóng theo chủ ý — KHÁC `transport_type` (từ điển FK
    # mở rộng được). Xem docs/data/modules/transport.md §3.2.
    PricingModel: { type: string, enum: [fixed, starting_from, per_km, per_hour, per_person, per_vehicle, contact] }

    # ---- Common ----
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    AuthToken:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        user: { $ref: '#/components/schemas/User' }

    # ---- Entities ----
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        roles: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    PublicUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        is_system: { type: boolean }
        permissions: { type: array, items: { type: string } }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name_vi: { type: string }
        name_en: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        parent_id: { type: [string, 'null'], format: uuid }
    CategoryCreate:
      type: object
      required: [name_vi]
      properties:
        name_vi: { type: string, maxLength: 120 }
        name_en: { type: string, maxLength: 120 }
        icon: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 120, description: Bỏ trống → tự sinh từ name_vi }
        parent_id: { type: string, format: uuid }
    CategoryUpdate:
      type: object
      properties:
        name_vi: { type: string, maxLength: 120 }
        name_en: { type: string, maxLength: 120 }
        icon: { type: string, maxLength: 120 }
        parent_id: { type: string, format: uuid }
    PlaceCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/GeoPoint' }
        short_description: { type: [string, 'null'] }
        price_range: { $ref: '#/components/schemas/PriceRange' }
        cover_image_url: { type: [string, 'null'], format: uri }
        rating_avg: { type: [number, 'null'] }
        rating_count: { type: integer }
        verification_status: { $ref: '#/components/schemas/VerificationStatus' }
        # F-17 / OD-F-17 (2026-07-23): runtime LUÔN phát trường này (CARD_COLS chọn p.status;
        # places.mapper.ts đặt vô điều kiện) nhưng schema trước đây không khai. Đây là TRẠNG THÁI
        # XUẤT BẢN, KHÔNG phải giờ mở cửa của cơ sở (giờ mở cửa nằm ở `opening_hours`). Dùng đúng
        # enum PlaceStatus đã có sẵn — enum này vốn ĐÃ công khai qua schema `Place` bên dưới, nên
        # việc khai ở đây không lộ thêm bất kỳ thông tin nào và payload không đổi một byte.
        # Kênh công khai chỉ có thể quan sát `published` vì read công khai lọc theo trạng thái đó.
        status: { $ref: '#/components/schemas/PlaceStatus' }
        distance_m: { type: [number, 'null'] }
    Place:
      allOf:
        - $ref: '#/components/schemas/PlaceCard'
        - type: object
          properties:
            # Slug danh mục — CHỈ có ở chi tiết, không có ở PlaceCard. `category_id` một mình là
            # UUID mà client không dùng được nếu không gọi thêm GET /categories; slug cho phép
            # trang chi tiết điều hướng về đúng trang duyệt (vd 'attraction' → /attractions).
            category_slug: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            ward: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            opening_hours: { type: [object, 'null'], additionalProperties: true }
            status: { $ref: '#/components/schemas/PlaceStatus' }
            osm_id: { type: [integer, 'null'] }
            contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
            prices: { type: array, items: { $ref: '#/components/schemas/Price' } }
            media: { type: array, items: { $ref: '#/components/schemas/Media' } }
            faqs: { type: array, items: { type: object, additionalProperties: true } }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PlaceInput:
      type: object
      required: [name, category_id, location]
      properties:
        name: { type: string, maxLength: 200 }
        category_id: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/GeoPoint' }
        address: { type: string }
        ward: { type: string }
        description: { type: string }
        short_description: { type: string, maxLength: 300 }
        opening_hours: { type: object, additionalProperties: true }
        price_range: { $ref: '#/components/schemas/PriceRange' }

    # ---- Transport (ADR-017, Accepted 2026-07-28) ----
    # Place có category='transport' + satellite `place_transport_details` (1:1). Trục phân loại
    # chính là từ điển `transport_types` (GET /transport-types), không phải ENUM. Nhiệm vụ nền
    # tảng: các schema dưới đây phản ánh ĐÚNG những gì `GET /transports`/`{slug}` thực sự trả về
    # — không tài liệu hoá endpoint hay trường nào chưa triển khai.
    TransportType:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'Mã ổn định, vd taxi/ferry/motorbike_rental — dữ liệu tham chiếu MỞ, không đóng cứng ở client.' }
        label_vi: { type: string }
        label_en: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        parent_id: { type: [string, 'null'], format: uuid, description: 'Nhóm hiển thị tuỳ chọn (vd "Đường thuỷ"); hiện chưa loại nào dùng.' }
        sort_order: { type: integer }
    TransportPricing:
      type: object
      description: >-
        `model=null` nghĩa là CHƯA XÁC ĐỊNH — khác `contact` (đã khai báo tường minh "chỉ báo giá
        khi liên hệ"). `price_ref` là giá cache hiển thị nhanh; nguồn giá xác minh/lịch sử là
        `price_history` (entity_type=transport, ADR-006), không lộ qua schema này.
      properties:
        model: { oneOf: [{ $ref: '#/components/schemas/PricingModel' }, { type: 'null' }] }
        price_ref: { type: [number, 'null'], minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: VND }
        unit: { type: [string, 'null'], description: 'Chỉ có nghĩa khi model thuộc per_* (vd "km", "giờ", "khách").' }
    TransportSummary:
      type: object
      description: Hình dạng một phần tử trong `GET /transports` (card).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        short_description: { type: [string, 'null'] }
        cover_image_url: { type: [string, 'null'], format: uri }
        ward: { type: [string, 'null'] }
        rating_avg: { type: [number, 'null'] }
        rating_count: { type: integer }
        verification_status: { $ref: '#/components/schemas/VerificationStatus' }
        transport_type: { $ref: '#/components/schemas/TransportType' }
        pricing: { $ref: '#/components/schemas/TransportPricing' }
        capacity_passengers: { type: [integer, 'null'], description: 'NULL = không áp dụng hoặc chưa xác nhận (KHÔNG suy ra 0).' }
        booking_required: { type: [boolean, 'null'], description: 'Tri-state có chủ đích — NULL = chưa xác nhận, KHÔNG mặc định false.' }
        airport_transfer: { type: [boolean, 'null'], description: 'Tri-state, cùng lý do booking_required.' }
        location: { $ref: '#/components/schemas/GeoPoint' }
    TransportServiceOption:
      type: object
      description: Gói dịch vụ/mức giá (0..N), vd "Xe 4 chỗ" vs "Xe 7 chỗ" — cùng vai trò hotel_room_types.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        capacity_passengers: { type: [integer, 'null'] }
        price_ref: { type: [number, 'null'], minimum: 0 }
        price_currency: { type: string }
        price_unit: { type: [string, 'null'] }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        sort_order: { type: integer }
    TransportRoute:
      type: object
      description: Tuyến cố định tuỳ chọn (0..N) — ferry/cano thường có, taxi/private car thường không.
      properties:
        id: { type: string, format: uuid }
        origin_label: { type: string }
        origin_location: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        destination_label: { type: string }
        destination_location: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        note: { type: [string, 'null'] }
        sort_order: { type: integer }
    TransportDetail:
      description: >-
        `GET /transports/{slug}` — Place đầy đủ (allOf Place) + phần mở rộng Transport. KHÔNG có
        lịch trình/tình trạng chỗ trống thời gian thực (nằm ngoài phạm vi nền tảng này).
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          properties:
            transport_details:
              type: object
              properties:
                transport_type: { $ref: '#/components/schemas/TransportType' }
                provider_business_id: { type: [string, 'null'], format: uuid, description: 'Nhà cung cấp = một Place khác đã claim; NULL cho tới khi Business ownership (ADR-015) được thi hành.' }
                pricing: { $ref: '#/components/schemas/TransportPricing' }
                capacity_passengers: { type: [integer, 'null'] }
                booking_required: { type: [boolean, 'null'] }
                airport_transfer: { type: [boolean, 'null'] }
                booking_note: { type: [string, 'null'], description: 'Mô tả tự do, KHÔNG phải chính sách đặt chỗ có cấu trúc.' }
            service_options: { type: array, items: { $ref: '#/components/schemas/TransportServiceOption' } }
            routes: { type: array, items: { $ref: '#/components/schemas/TransportRoute' } }
            service_areas: { type: array, items: { type: string }, description: 'Danh sách places.ward mà dịch vụ phục vụ.' }

    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_type: { type: string, examples: [place, business] }
        contact_type: { type: string, examples: [HOTLINE, PHONE, EMAIL, WEBSITE, FACEBOOK] }
        value: { type: string }
        label: { type: [string, 'null'] }
        is_primary: { type: boolean }
        verification_status: { $ref: '#/components/schemas/VerificationStatus' }
        display_order: { type: integer }
    ContactInput:
      type: object
      required: [contact_type, value]
      properties:
        contact_type: { type: string }
        value: { type: string }
        label: { type: string }
        is_primary: { type: boolean }
        display_order: { type: integer }
    Price:
      type: object
      properties:
        id: { type: string, format: uuid }
        service_name: { type: string }
        amount: { type: number }
        currency: { type: string, examples: [VND] }
        unit: { type: [string, 'null'] }
        is_free: { type: boolean }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        verification_status: { $ref: '#/components/schemas/VerificationStatus' }
    PriceInput:
      type: object
      required: [service_name, amount]
      properties:
        service_name: { type: string }
        amount: { type: number, minimum: 0 }
        currency: { type: string }
        unit: { type: string }
        is_free: { type: boolean }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        display_order: { type: integer }
    Media:
      type: object
      description: >-
        `url` là `null` cho media `pending` (mọi upload mới qua Media Upload Foundation, 2026-07-30
        — không có object_key/bucket/... nào được lộ, chỉ metadata storage tối thiểu được LƯU,
        không bao giờ là URL tuyệt đối/signed — xem docs/data/modules/media.md §Persistence). Chỉ
        media `published` hợp pháp (embed YouTube/Vimeo, hoặc một luồng kiểm duyệt tương lai) mới
        có `url` thật.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [image, video] }
        url: { type: [string, 'null'], format: uri }
        thumbnail_url: { type: [string, 'null'], format: uri }
        caption: { type: [string, 'null'] }
        alt_text: { type: [string, 'null'] }
        status: { type: string, enum: [pending, published, hidden, rejected] }
    Verification:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: [string, 'null'], format: uuid }
        contact_id: { type: [string, 'null'], format: uuid }
        price_history_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/VerificationStatus' }
        method: { type: string, enum: [moderator, owner_claim, source_match, community_vote, system_auto] }
        confirm_count: { type: integer }
        dispute_count: { type: integer }
        lock_version: { type: integer }
        sla_due_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    WikiRevision:
      type: object
      properties:
        id: { type: string, format: uuid }
        revision_number: { type: integer }
        origin: { type: string }
        status: { type: string, enum: [pending, approved, rejected, reverted] }
        editor_id: { type: [string, 'null'], format: uuid }
        change_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Hotel:
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          properties:
            star_rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
            hotel_type: { type: string, enum: [resort, hotel, homestay, villa, guesthouse, apartment] }
            check_in: { type: [string, 'null'] }
            check_out: { type: [string, 'null'] }
            amenities: { type: array, items: { type: string } }
            room_types: { type: array, items: { $ref: '#/components/schemas/RoomType' } }
    RoomType:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer }
        amenities: { type: array, items: { type: string } }
        price_ref: { type: [number, 'null'] }
    MenuInput:
      type: object
      properties:
        sections:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    price: { type: number }
                    tags: { type: array, items: { type: string } }
    SearchResult:
      type: object
      # F-35 / OD-B4 (2026-07-24): `score` (Postgres ts_rank) REMOVED from the public contract.
      # Relevance still determines server-side ORDER BY internally (unchanged); the numeric,
      # engine-specific ranking value itself is no longer part of the public response.
      properties:
        type: { type: string, enum: [place, hotel, restaurant, tour, event, community] }
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        snippet: { type: [string, 'null'] }
    AiJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, examples: [generating] }
    Amenity:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        label_vi: { type: string }
        label_en: { type: string }
        icon: { type: [string, 'null'] }
        group: { type: [string, 'null'] }
    Event:
      type: object
      description: 'Thực thể peer (Hybrid) — KHÔNG phải Place extension. ADR-002; database.md §3.22.'
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        cover_media_id: { type: [string, 'null'], format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string, examples: [Asia/Ho_Chi_Minh] }
        place_id: { type: [string, 'null'], format: uuid }
        organizer_id: { type: [string, 'null'], format: uuid }
        event_category: { type: [string, 'null'], examples: [festival, music, food, cultural] }
        status: { type: string, enum: [draft, pending, published, archived] }
        status_override: { type: [string, 'null'], enum: [cancelled, postponed, null] }
        recurrence_rule: { type: [string, 'null'] }
        time_status: { type: string, enum: [upcoming, ongoing, ended], description: 'suy diễn từ start_at/end_at/now — không lưu' }
        created_at: { type: string, format: date-time }
    EventOccurrence:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        status_override: { type: [string, 'null'], enum: [cancelled, postponed, null] }
    Review:
      type: object
      description: >-
        Đánh giá công khai của một Place (schema.prisma Review; migration InitReviews). MVP
        hiện tại chưa có hàng đợi kiểm duyệt nên mọi review tạo mới đều `published` ngay —
        route công khai (listPlaceReviews) chỉ trả các review `status=published`.
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        author_name: { type: string }
        author_avatar_url: { type: [string, 'null'], format: uri }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: [string, 'null'] }
        status: { type: string, enum: [pending, published, hidden] }
        created_at: { type: string, format: date-time }
    BookingItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        quantity: { type: integer }
        unit_price: { type: number }
        subtotal: { type: number }
    Booking:
      type: object
      description: >-
        Booking Request Foundation (migration InitBooking) — không có DB primary key trong
        response, `booking_code` là định danh công khai duy nhất. subtotal/discount/fees/
        grand_total là giá trị YÊU CẦU tại thời điểm đặt (client-submitted unit_price), CHƯA qua
        pricing engine xác nhận từ nhà cung cấp — không diễn giải là giá cuối cùng.
      properties:
        booking_code: { type: string }
        booking_type: { type: [string, 'null'] }
        entity_type: { type: string, enum: [hotel, restaurant, tour, event, transport] }
        entity_id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        currency_code: { type: string }
        booking_status: { type: string, enum: [pending, confirmed, cancelled, expired] }
        payment_status: { type: string, enum: [unpaid, paid, refunded] }
        fulfillment_status: { type: string, enum: [pending, fulfilled, no_show, cancelled] }
        service_start_at: { type: [string, 'null'], format: date-time }
        service_end_at: { type: [string, 'null'], format: date-time }
        party_size: { type: integer }
        subtotal: { type: number }
        discount: { type: number }
        fees: { type: number }
        grand_total: { type: number }
        guest_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/BookingItem' } }
    BookingAdminCard:
      type: object
      description: >-
        Phase 2 (Application Layer, 2026-07-30) — response GET /bookings, kênh đặc quyền
        (Booking.List). Khác `Booking` ở trên: CÓ `id` (cần để gọi
        POST /bookings/{id}/{confirm,cancel,expire}) và `customer_user_id` (staff cần biết ai
        đặt) — nhưng vẫn KHÔNG BAO GIỜ có `internal_note`, và KHÔNG có `items`/`discount`/`fees`
        (dùng GET /bookings/{bookingCode} nếu cần chi tiết đầy đủ của một booking cụ thể).
      properties:
        id: { type: string, format: uuid }
        booking_code: { type: string }
        booking_type: { type: [string, 'null'] }
        entity_type: { type: string, enum: [hotel, restaurant, tour, event, transport] }
        entity_id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        customer_user_id: { type: [string, 'null'], format: uuid }
        currency_code: { type: string }
        booking_status: { type: string, enum: [pending, confirmed, cancelled, expired] }
        payment_status: { type: string, enum: [unpaid, paid, refunded] }
        fulfillment_status: { type: string, enum: [pending, fulfilled, no_show, cancelled] }
        service_start_at: { type: [string, 'null'], format: date-time }
        service_end_at: { type: [string, 'null'], format: date-time }
        party_size: { type: integer }
        grand_total: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AvailabilitySlot:
      type: object
      description: >-
        Availability & Inventory Foundation (2026-07-30, migration InitAvailability) — abstraction
        generic đa hình (entity_type/entity_id, ADR-003), dùng chung cho mọi loại hình đặt chỗ.
        held_quantity/remaining_capacity tính động từ SUM(quantity) các inventory_holds đang
        active|confirmed trên slot này — không phải cột lưu sẵn.
      properties:
        id: { type: string, format: uuid }
        entity_type: { type: string, enum: [hotel, restaurant, tour, event, transport] }
        entity_id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        slot_start: { type: string, format: date-time }
        slot_end: { type: [string, 'null'], format: date-time }
        total_capacity: { type: integer }
        held_quantity: { type: integer, description: SUM(quantity) các hold active|confirmed trên slot này. }
        remaining_capacity: { type: integer, description: total_capacity - held_quantity. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditLog:
      type: object
      description: >-
        Nhật ký kiểm toán bất biến (append-only) — ADR-016, database.md §3.21.
        Đa hình qua entity_type/entity_id (không FK cứng). Chỉ đọc.
      properties:
        id: { type: string, format: uuid }
        event: { type: string, examples: [place.status_changed, business.claim_approved, auth.login.success] }
        actor_id: { type: [string, 'null'], format: uuid }
        actor_role: { type: [string, 'null'] }
        is_service_account: { type: boolean }
        permission: { type: [string, 'null'] }
        scope: { type: [string, 'null'], examples: [Own, Managed, Any] }
        entity_type: { type: string }
        entity_id: { type: [string, 'null'], format: uuid }
        result: { $ref: '#/components/schemas/AuditResult' }
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        context: { type: [object, 'null'], additionalProperties: true }
        correlation_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
