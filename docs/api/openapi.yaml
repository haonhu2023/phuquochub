  # ============================ REVIEWS ============================
  /places/{id}/reviews:
    get:
      tags: [Reviews]
      summary: Đánh giá của địa điểm
      operationId: listPlaceReviews
      security: []
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Review' } } }
    post:
      tags: [Reviews]
      summary: Tạo đánh giá
      operationId: createReview
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string }
                media_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '201': { $ref: '#/components/responses/EmptySuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reviews/{id}:
    patch:
      tags: [Reviews]
      summary: Sửa đánh giá của mình
      operationId: updateReview
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
    delete:
      tags: [Reviews]
      summary: Xóa đánh giá
      operationId: deleteReview
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /reviews/{id}/report:
    post:
      tags: [Reviews]
      summary: Báo cáo đánh giá (Report.Create, M5 — WF-12/T3)
      operationId: reportReview
      description: >-
        T3 (moderation-design.md §7): review phải `published` (tồn tại nhưng chưa/không còn
        published trả CÙNG 404 với "không tồn tại" — không rò rỉ trạng thái kiểm duyệt nội bộ cho
        reporter). Tạo case `open` mới (source=report) hoặc gắn vào case mở sẵn có cho review này
        (INV-3, KHÔNG bao giờ tạo case trùng); `report_count`/`severity`/`priority` tính lại ngay
        trong CÙNG transaction (≥3 report ⇒ severity tối thiểu `high`, moderation-design.md §4.1).
        **KHÔNG bao giờ đổi `reviews.status`** (O3/INV-6 — report không tự động ẩn nội dung).
        Một reporter chỉ báo cáo được MỘT lần trên MỘT target (`uq_reports_one_per_reporter`) —
        lần thứ hai trả `409`. Throttle 5/phút.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [spam, misinformation, offensive, irrelevant, copyright, personal_info, other]
                description:
                  type: string
                  maxLength: 1000
      responses:
        '201': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reviews/{id}/reply:
    post:
      tags: [Reviews]
      summary: Chủ cơ sở phản hồi (scope Managed)
      operationId: replyReview
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { content: { type: string } } } } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /reviews/{id}/vote:
    post:
      tags: [Reviews]
      summary: Vote hữu ích
      operationId: voteReview
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }

  # ============================ BOOKINGS ============================
  # Booking Request Foundation — chỉ tạo + đọc theo booking_code. Phase 2 (Application Layer,
  # 2026-07-30) thêm GET /bookings (query admin/staff) + 3 endpoint chuyển trạng thái
  # (confirm/cancel/expire). KHÔNG payment/inventory realtime/refund/invoice/commission/
  # settlement/notification thật (xem docs/data/modules/booking.md).
  /bookings:
    get:
      tags: [Bookings]
      summary: Danh sách booking — admin/staff (Booking.List, Phase 2)
      operationId: listBookings
      description: >-
        Kênh đặc quyền — trả về MỌI booking, KHÔNG lọc theo chủ sở hữu (khác
        GET /bookings/{bookingCode}, vốn chỉ trả về booking của chính người gọi).
        Hợp đồng phân trang OFFSET (`page`/`limit`), cùng convention `/places` list.
        `date_from`/`date_to` lọc theo `service_start_at` (ngày DỊCH VỤ), KHÔNG phải ngày tạo
        booking — xem docs/data/modules/booking.md §8.1.
      parameters:
        - name: booking_status
          in: query
          schema: { type: string, enum: [pending, confirmed, cancelled, expired] }
        - name: payment_status
          in: query
          schema: { type: string, enum: [unpaid, paid, refunded] }
        - name: fulfillment_status
          in: query
          schema: { type: string, enum: [pending, fulfilled, no_show, cancelled] }
        - name: module_code
          in: query
          description: Bí danh của `entity_type` — cùng một cột DB. Nếu cả hai được truyền và khác nhau, 400.
          schema: { type: string, enum: [hotel, restaurant, tour, event, transport] }
        - name: entity_type
          in: query
          schema: { type: string, enum: [hotel, restaurant, tour, event, transport] }
        - name: date_from
          in: query
          description: Lọc `service_start_at >= date_from` (ISO 8601).
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          description: Lọc `service_start_at <= date_to` (ISO 8601). Phải sau `date_from` nếu cả hai cùng có mặt.
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort_by
          in: query
          description: Giới hạn 3 cột đã có index — không cho sort cột tuỳ ý.
          schema: { type: string, enum: [created_at, service_start_at, grand_total], default: created_at }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/BookingAdminCard' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Bookings]
      summary: Tạo booking request (Booking.Create)
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id, place_id, party_size, items]
              properties:
                entity_type: { type: string, enum: [hotel, restaurant, tour, event, transport] }
                entity_id: { type: string, format: uuid }
                place_id: { type: string, format: uuid }
                booking_type: { type: string }
                service_start_at: { type: string, format: date-time }
                service_end_at: { type: string, format: date-time, description: Phải sau service_start_at nếu cả hai cùng có mặt. }
                party_size: { type: integer, minimum: 1, maximum: 200 }
                guest_note: { type: string }
                availability_slot_id:
                  type: string
                  format: uuid
                  description: >-
                    OPTIONAL (Availability & Inventory Integration, 2026-07-30). Nếu có, booking sẽ
                    cố giữ chỗ (quantity = party_size) trên slot này trong CÙNG transaction tạo
                    booking; slot phải khớp entity_type/entity_id/place_id của booking (422 nếu
                    không) và còn đủ dung lượng (422 nếu hết chỗ). Nếu không gửi, hành vi y hệt
                    trước Integration này (không hold nào được tạo). Xem docs/data/modules/booking.md §9.
                hold_ttl_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  description: Chỉ có tác dụng khi có availability_slot_id. Mặc định 30 phút nếu không gửi.
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [label, quantity, unit_price]
                    properties:
                      label: { type: string, maxLength: 200 }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
                      unit_price:
                        type: number
                        minimum: 0
                        description: >-
                          TRUST BOUNDARY: giá client gửi (chưa có pricing engine xác nhận từ nhà
                          cung cấp) — là số tiền YÊU CẦU/BÁO GIÁ, không phải giá cuối cùng.
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Booking' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /bookings/{bookingCode}:
    get:
      tags: [Bookings]
      summary: Tra cứu booking theo mã công khai (Booking.View, chỉ đúng chủ booking)
      operationId: getBookingByCode
      parameters:
        - name: bookingCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Booking' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bookings/{id}/confirm:
    post:
      tags: [Bookings]
      summary: Confirm booking — admin/staff (Booking.Confirm, Phase 2)
      operationId: confirmBooking
      description: >-
        `pending` → `confirmed`. `{id}` là uuid nội bộ (kênh đặc quyền), KHÁC `bookingCode` công
        khai ở trên. `422` nếu booking không ở trạng thái `pending`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel booking — admin/staff (Booking.Cancel, Phase 2)
      operationId: cancelBooking
      description: >-
        `pending`\|`confirmed` → `cancelled`. `422` nếu booking đã `cancelled`/`expired`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /bookings/{id}/expire:
    post:
      tags: [Bookings]
      summary: Đánh dấu booking đã expired — admin/staff (Booking.MarkExpired, Phase 2)
      operationId: markBookingExpired
      description: >-
        `pending` → `expired` CHỈ — một booking đã `confirmed` cần `cancel`, không "expire".
        `422` nếu booking không ở trạng thái `pending`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

