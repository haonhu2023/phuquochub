  /media/{id}/report:
    post:
      tags: [Media]
      summary: Báo cáo media (Report.Create, M5 — WF-12/T3)
      operationId: reportMedia
      description: >-
        Cùng T3/hành vi với `POST /reviews/{id}/report` (moderation-design.md §7/§9.2) — media
        phải `published`; case reuse/creation qua INV-3; report_count/severity/priority tính lại
        trong cùng transaction; KHÔNG bao giờ đổi `media.status` (O3/INV-6); chống report trùng
        (`uq_reports_one_per_reporter`, `409`). Throttle 5/phút.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [spam, misinformation, offensive, irrelevant, copyright, personal_info, other]
                description:
                  type: string
                  maxLength: 1000
      responses:
        '201': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============================ MODERATION ============================
  # Moderation Foundation (ADR-018, Accepted). GET /moderation/cases + GET /moderation/cases/{id}
  # (M2) — CHỈ ĐỌC, đòi Moderation.Queue.View. POST /moderation/cases/{id}/decide (M3: media, M4:
  # review) — quyền CHỌN theo target_type CỦA CHÍNH CASE (Media.Moderate hoặc Review.Moderate,
  # không dùng lẫn), đi qua transaction T2 rồi audit + event SAU commit — xem
  # docs/data/modules/moderation-design.md §7/§9.1. Review target còn tính lại rating của place sở
  # hữu TRONG cùng transaction (INV-4). Không claim/release/reopen (chưa cần: decide() tự chấp
  # nhận case ở cả open lẫn claimed).
  /moderation/cases:
    get:
      tags: [Moderation]
      summary: Hàng chờ kiểm duyệt (Moderation.Queue.View, M2)
      operationId: listModerationCases
      description: >-
        Không truyền `status` → mặc định chỉ `open`/`claimed` (đúng định nghĩa "hàng chờ",
        moderation-design.md §4). Truyền `status` tường minh → lọc đúng MỘT giá trị đó (kể cả
        `resolved`/`dismissed`, phục vụ xem lịch sử một target). Sắp xếp CỐ ĐỊNH theo
        `priority DESC, report_count DESC, created_at ASC` — không có tham số sort tuỳ chỉnh
        (chưa được ADR-018 đặc tả).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, claimed, resolved, dismissed] }
        - name: target_type
          in: query
          schema: { type: string, enum: [review, media, place] }
        - name: source
          in: query
          schema: { type: string, enum: [new_content, report, ai_flag, manual] }
        - name: severity
          in: query
          schema: { type: string, enum: [low, normal, high, critical] }
        - name: assigned_to
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ModerationCaseSummary' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /moderation/cases/{id}:
    get:
      tags: [Moderation]
      summary: Chi tiết case kiểm duyệt (Moderation.Queue.View, M2)
      operationId: getModerationCase
      description: >-
        Case + toàn bộ report gắn với nó + ảnh chụp target tối thiểu (media/review — `place` luôn
        `found:false`, chưa đăng ký FSM). Target đã bị xoá hoặc không tồn tại → `target_preview.
        found=false`, KHÔNG lỗi (case vẫn hợp lệ dù target đã mất — target_id không FK cứng,
        ADR-018 D9).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/ModerationCaseDetail' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /moderation/cases/{id}/decide:
    post:
      tags: [Moderation]
      summary: Quyết định kiểm duyệt (target media hoặc review, M3/M4)
      operationId: decideModerationCase
      description: >-
        Trong MỘT transaction (T2, moderation-design.md §7): khoá + đọc case, CHỌN quyền theo
        target_type của chính case đó (`Media.Moderate` cho media, `Review.Moderate` cho review —
        không bao giờ dùng lẫn, ADR-018 D10), khoá + đọc target, xác thực transition qua FSM thuần
        tương ứng (`assertValidMediaTransition`/`assertValidReviewTransition`, KHÔNG logic
        transition nào lặp lại ở tầng API), cập nhật `media.status`/`reviews.status` + case, commit.
        Với target_type=review, transaction còn gọi `recalculateRating()` của place sở hữu TRONG
        CÙNG transaction (INV-4) — mọi transition review hợp lệ (hide/restore/approve) đều đổi tập
        review `published` đóng góp vào `rating_avg`/`rating_count`. Audit (`moderation.decided`) và
        domain event chỉ phát SAU commit, không bao giờ trước (ADR-018 INV-9); lỗi ghi audit/event
        sau commit không hoàn tác quyết định — chỉ log. `target_type=place` chưa được hỗ trợ (chưa
        đăng ký FSM, MR-4) → `422`. `reason` bắt buộc khi `decision=hide` (cả media và review) hoặc
        `decision=reject` (media only — review không có trạng thái rejected, ADR-018 D5); `reject`
        trên review target → `422`. `target_status` bắt buộc khi `decision=restore` trên media
        (INV-10, hai đích khả dĩ: `published`/`pending`); tuỳ chọn trên review (chỉ MỘT đích hợp lệ,
        `published` — gửi giá trị khác sẽ `422`). Không cho tự kiểm duyệt nội dung chính mình
        (INV-12).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject, hide, restore, dismiss]
                  description: reject chỉ áp dụng cho target media — 422 nếu gửi cho target review.
                target_status:
                  type: string
                  enum: [pending, published]
                  description: >-
                    Bắt buộc khi decision=restore trên media (INV-10, không có đích mặc định).
                    Tuỳ chọn khi decision=restore trên review (chỉ published hợp lệ — giá trị khác
                    422).
                reason:
                  type: string
                  maxLength: 2000
                  description: Bắt buộc khi decision=reject|hide trên media, hoặc decision=hide trên review (INV-11).
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /moderation/cases/{id}/ai-recommendation:
    # Moderation M7 — AI Shadow Mode. Bảng MỚI DUY NHẤT `ai_recommendations` (KHÔNG đụng
    # moderation_cases/reports/media/reviews) — xem docs/data/modules/moderation-design.md §13 và
    # ADR-018 Addendum M7. Service KHÔNG BAO GIỜ đổi media.status/reviews.status/
    # moderation_cases.status, KHÔNG BAO GIỜ gọi FSM — endpoint dưới đây CHỈ tạo/đọc một gợi ý.
    post:
      tags: [Moderation]
      summary: Tạo gợi ý AI cho một case (shadow mode, M7)
      operationId: generateAiRecommendation
      description: >-
        Gọi `AiModerationProvider` (mặc định `LoggingAiModerationProvider` — gợi ý GIẢ, XÁC ĐỊNH,
        KHÔNG OpenAI/Anthropic/HTTP ngoài nào), persist MỘT dòng `ai_recommendations` gắn với case
        này, trả về dòng đó. KHÔNG transaction, KHÔNG đổi `media.status`/`reviews.status`/
        `moderation_cases.status`, KHÔNG mở/đóng case nào. Quyền TÁI DÙNG `AI.ModerateMedia` (D10 —
        đã seed cho `ai_agent`, KHÔNG quyền mới). Nhiều lần gọi trên cùng case là hợp lệ — mỗi lần
        tạo MỘT dòng mới; chỉ dòng MỚI NHẤT được so sánh với quyết định moderator (xem `decide`).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/AiRecommendation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Moderation]
      summary: Gợi ý AI mới nhất của một case (shadow mode, M7)
      operationId: getLatestAiRecommendation
      description: >-
        Quyền `Moderation.Queue.View` (cùng quyền đọc hàng chờ đã có, KHÔNG quyền mới). `404` khi
        case không tồn tại HOẶC case tồn tại nhưng chưa có gợi ý AI nào.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/AiRecommendation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

