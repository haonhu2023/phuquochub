  # ============================ BUSINESS ============================
  # ADR-015 Claim Decision Workflow — ĐÃ TRIỂN KHAI (2026-08-05). `/business/claims*` (stub cũ, chưa
  # bao giờ có code) thay bằng `/business-claims*` khớp ĐÚNG BusinessClaimsController thật. `dashboard`/
  # `managers`/`transfer` bên dưới VẪN LÀ STUB — ngoài phạm vi milestone này (UC-B3/B5/B6/B7).
  /business-claims:
    get:
      tags: [Business]
      summary: Hàng đợi claim (Business.Verify, moderator)
      operationId: listBusinessClaims
      description: >-
        Bỏ trống `status` → mặc định `pending` (hàng đợi). `evidence` KHÔNG có mặt ở đây (riêng tư,
        chỉ lộ ở GET /business-claims/{id}) — business.md §2.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, disputed, withdrawn] }
        - name: place_id
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ModeratorBusinessClaimSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Business]
      summary: Gửi yêu cầu claim (Business.Claim, member)
      operationId: submitBusinessClaim
      description: >-
        `requester_id` LUÔN lấy từ JWT, không nhận từ body. Place phải tồn tại & `published`
        (WF-05). Claim `pending` trùng place+requester → 409. Response KHÔNG echo `evidence`
        (riêng tư — business.md §2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place_id, evidence]
              properties:
                place_id: { type: string, format: uuid }
                evidence:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/BusinessClaimEvidenceItem' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/BusinessClaimSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Claim pending trùng place+requester đã tồn tại }
  /business-claims/{id}:
    get:
      tags: [Business]
      summary: Chi tiết claim (Business.Verify, moderator) — CÓ evidence
      operationId: getBusinessClaim
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/BusinessClaimDetail' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /business-claims/{id}/decide:
    post:
      tags: [Business]
      summary: Duyệt/bác claim (Business.Verify, moderator)
      operationId: decideBusinessClaim
      description: >-
        MỘT transaction cho TOÀN BỘ quyết định: khoá claim, chặn tự xác minh (403), approve tạo
        `business_members(owner)` + gán `business_owner` (`user_roles`, scope Managed,
        `business_id=place_id`) — TRỪ KHI cơ sở đã có owner hiệu lực, khi đó tự động chuyển `disputed`
        thay vì approve (business.md §4). `reject` bắt buộc `reason_code` (422 nếu thiếu).


        CLAIM -> SOURCE -> VERIFICATION INTEGRATION (2026-08-06): approve KHÔNG còn ghi thẳng
        `places.verification_status`/`verified_at`. Thay vào đó, trong CÙNG transaction trên, nó đi
        qua hệ Verification (ADR-008): tạo MỘT `sources` (`type=business_owner`,
        `kind=platform_user`, `author_user_id`=requester, `metadata` CHỈ chứa `business_claim_id` —
        KHÔNG chứa evidence của claim, vì `GET /sources/{id}` là kênh công khai) → tạo/gửi lại dòng
        `verifications` của place nếu cần rồi transition sang `official` (`method=owner_claim`,
        `source_id` trỏ tới source vừa tạo) → append `verification_events` → đồng bộ cache
        `places.verification_status`/`verified_at`. Bảng `verifications` là nguồn sự thật DUY NHẤT
        của cache đó. `expires_at = null` cho claim-driven official (KHÔNG áp hạn 12 tháng mặc định
        của `POST /verifications/{id}/official`) — chính sách TẠM THỜI, có chủ đích, tới khi có luồng
        gia hạn/tái xác nhận cho chủ cơ sở.


        Nếu place ĐÃ có một xác minh `official` (vd moderator đặt trước qua
        `POST /verifications/{id}/official`): phần verification là NO-OP THẬT — KHÔNG tạo `sources`
        mới, KHÔNG append event, KHÔNG ghi cache; ownership/claim vẫn được xử lý bình thường, và
        audit context trỏ tới `source_id` ĐANG gắn trên dòng `verifications` đó
        (`verification.sourceCreated=false`).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code: { $ref: '#/components/schemas/ClaimReasonCode' }
                decision_note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: >-
            OK — `data.status` phản ánh kết quả THẬT (có thể là `disputed` dù request gửi `approve`,
            xem mô tả).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/BusinessClaimSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Business.Verify, hoặc actor chính là requester (tự xác minh) }
        '404': { description: Không tìm thấy claim, hoặc không tìm thấy source vừa tạo khi đặt official }
        '409':
          description: >-
            Xung đột đồng thời trong bước Verification của nhánh approve (CLAIM -> SOURCE ->
            VERIFICATION INTEGRATION): một tác nhân khác (moderator qua `/verifications/*`, hoặc job
            hết hạn) vừa thay đổi CÙNG dòng `verifications` của place này (CAS `lock_version` thua),
            HOẶC một `POST /verifications` đồng thời vừa tạo dòng xác minh cho chính place đó
            (`uq_verif_place`). TOÀN BỘ quyết định rollback — claim giữ nguyên trạng thái cũ, KHÔNG có
            ownership/source/verification nào được ghi. Đọc lại rồi quyết định lại.
        '422': { description: reject thiếu reason_code, hoặc claim không ở trạng thái cho phép quyết định }
  /business-claims/{id}/withdraw:
    post:
      tags: [Business]
      summary: Requester tự rút claim đang pending (Business.Claim)
      operationId: withdrawBusinessClaim
      description: Actor PHẢI là chính requester của claim — KHÔNG cần Business.Verify (business.md §4).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/BusinessClaimSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Actor không phải requester của claim }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Claim không còn ở trạng thái pending }
  /business/{id}/dashboard:
    get:
      tags: [Business]
      summary: Dashboard cơ sở (scope Managed)
      operationId: getBusinessDashboard
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/ObjectResponse' } }
  # Business Manager Assignment/Revocation — ĐÃ TRIỂN KHAI (2026-08-05). `Business.Manager.
  # Assign.Managed`/`Revoke.Managed` (Owner Decision 1 — CÓ hậu tố scope, khác Business.Claim/
  # Business.Verify) + `@AuthorizationContext(resourceType:'place', param:'id')` — actor phải giữ
  # grant Managed mà business_id khớp ĐÚNG `id` route (tức là owner hiệu lực của ĐÚNG cơ sở đó).
  # KHÔNG có kiểm tra ownership thủ công nào khác — toàn bộ đi qua đường Managed sẵn có (ADR-019).
  /business/{id}/managers:
    post:
      tags: [Business]
      summary: Gán manager (Business.Manager.Assign.Managed, owner của ĐÚNG cơ sở này)
      operationId: addBusinessManager
      description: >-
        `role` LUÔN là `manager` — không nhận từ body (tránh mở đường gán role khác qua endpoint
        này). Target đã có vai trò hiệu lực (owner HOẶC manager) tại cơ sở này → 409.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties: { user_id: { type: string, format: uuid } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/BusinessManager' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Business.Manager.Assign.Managed, hoặc không phải owner hiệu lực của cơ sở này }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Target đã có vai trò hiệu lực (owner hoặc manager) tại cơ sở này }
    get:
      tags: [Business]
      summary: Danh sách manager hiệu lực (Business.Manager.Assign.Managed, owner của ĐÚNG cơ sở này)
      operationId: listBusinessManagers
      description: >-
        Prerequisite gap task (2026-08-11) — CHỈ role=manager hiệu lực (không owner, không revoked).
        Cùng permission/@AuthorizationContext với assign (KHÔNG phải permission mới) — manager
        không giữ permission này nên không tự xem/quản lý manager khác được (BR-B6). Không phân
        biệt "cơ sở không tồn tại" với "bạn không phải owner" — cả hai đều 403
        (IDENTITY_PLACE_RESOLVER không tra tồn tại place trước khi kiểm permission).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/BusinessManagerListItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Business.Manager.Assign.Managed, hoặc không phải owner hiệu lực của cơ sở này }
  /business/{id}/managers/lookup:
    get:
      tags: [Business]
      summary: Tra user_id từ email chính xác (Business.Manager.Assign.Managed, owner của ĐÚNG cơ sở này)
      operationId: lookupBusinessUser
      description: >-
        Prerequisite gap task (2026-08-11), Phase 4 quyết định B — KHÔNG có API tìm-user-theo-email
        an toàn nào sẵn có trước task này (GET /users/{id} chỉ nhận id). Endpoint HẸP CÓ CHỦ Ý: đúng
        MỘT email chính xác, KHÔNG tìm kiếm mờ/liệt kê danh bạ. Cùng cổng phân quyền với assign/list
        — chỉ owner hiệu lực của một cơ sở bất kỳ gọi được (tra cứu KHÔNG lọc theo cơ sở, `id` trên
        route chỉ dùng để tái sử dụng ĐÚNG AuthorizationContext đã có).
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/LookupBusinessUserResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Business.Manager.Assign.Managed, hoặc không phải owner hiệu lực của cơ sở này }
        '404': { description: Không tìm thấy user với email này }
  /business/{id}/managers/{userId}:
    delete:
      tags: [Business]
      summary: Thu hồi manager (Business.Manager.Revoke.Managed, owner của ĐÚNG cơ sở này)
      operationId: revokeBusinessManager
      description: >-
        CHỈ thu hồi được manager — nhắm vào owner trả 404 (chuyển nhượng owner ngoài phạm vi, xem
        `/business/{id}/transfer`). Thu hồi chỉ ảnh hưởng cơ sở `{id}` — user vẫn giữ nguyên grant
        manager ở cơ sở khác (nếu có).
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Business.Manager.Revoke.Managed, hoặc không phải owner hiệu lực của cơ sở này }
        '404': { description: Không tìm thấy manager hiệu lực tại cơ sở này (bao gồm cả khi target là owner) }
  # Business Ownership Transfer (UC-B7) — ĐÃ TRIỂN KHAI (2026-08-06). `Business.Transfer.Managed`
  # (CÓ hậu tố scope, cùng lớp rủi ro đã phát hiện/chốt ở Manager Assignment) +
  # `@AuthorizationContext(resourceType:'place', param:'id')` — actor phải giữ grant Managed mà
  # business_id khớp ĐÚNG `id` route. Hành động trực tiếp của owner hiện tại — KHÔNG moderator,
  # KHÔNG bước chấp thuận của owner mới, có hiệu lực NGAY sau commit. Tái dùng nguyên
  # `business_members`/`user_roles` (revoke owner cũ + insert owner mới + đồng bộ scoped role) —
  # KHÔNG có bảng `business_transfers` mới.
  /business/{id}/transfer:
    post:
      tags: [Business]
      summary: Chuyển nhượng quyền sở hữu (Business.Transfer.Managed, owner của ĐÚNG cơ sở này)
      operationId: transferBusiness
      description: >-
        200 (không phải 201) — thay thế trạng thái sở hữu hiện có, không tạo thêm thành viên mới.
        `reason` tuỳ chọn, chỉ ghi vào audit context. Manager giữ nguyên — endpoint này không đụng
        tới bất kỳ dòng `business_members(role='manager')` nào. Target đang có vai trò hiệu lực khác
        (kể cả đang là manager tại cơ sở này) → 409, phải thu hồi vai trò đó trước qua
        `/business/{id}/managers/{userId}`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_id]
              properties:
                new_owner_id: { type: string, format: uuid }
                reason: { type: string, maxLength: 300, description: Tuỳ chọn — ghi vào audit_logs.context.reason }
      responses:
        '200':
          description: OK — owner mới, dòng business_members mới (claim_id null)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/BusinessManager' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Thiếu Business.Transfer.Managed, hoặc không phải owner hiệu lực của cơ sở này }
        '404': { description: Cơ sở chưa có owner hiệu lực, hoặc target user không tồn tại }
        '409': { description: Target đã là owner hiệu lực (kể cả chuyển cho chính mình), hoặc đang có vai trò hiệu lực khác (vd manager) tại cơ sở này }

  # ============================ MEDIA ============================
  # Media Upload Foundation (design review, 2026-07-30). Backend only — see
  # docs/data/modules/media.md. No thumbnail/resize/EXIF/AI/moderation/CDN/bulk-upload in this
  # milestone; /media/{id} (delete) and /media/{id}/moderate below remain PROPOSED (unimplemented,
  # no controller handler exists), left as-is, not part of this milestone.
  /media/presign:
    post:
      tags: [Media]
      summary: Xin presigned PUT URL upload trực tiếp lên object storage (MinIO dev / S3-compatible)
      operationId: presignMedia
      security: [{ bearerAuth: [] }]
      description: >-
        Luồng MỒ CÔI — KHÔNG gắn chủ sở hữu nào (ảnh review, gắn + auto-publish khi tạo review).
        KHÔNG trường owner nào được chấp nhận ở đây (`place_id`/`business_id`/`post_id`/`event_id`/
        `review_id`) — whitelist + forbidNonWhitelisted (main.ts) từ chối 400 nếu gửi.
        `place_id` TỪNG được chấp nhận và đã bị GỠ BỎ (Owner Place Photos, 2026-08-11): nó chỉ
        được kiểm tra "place có tồn tại", KHÔNG kiểm tra người gọi có quyền quản lý cơ sở đó, nên
        bất kỳ member nào cũng gắn được ảnh vào cơ sở của người khác. Ảnh của cơ sở nay đi qua
        `POST /places/{placeId}/media/presign`, nơi place id là route param nên quyền
        `Media.Upload.Managed` được cưỡng chế trên đúng cơ sở đó.
        `key` do SERVER sinh (`media/{uuid-v4}.{ext}`),
        client không tự đặt được. `upload_url` hết hạn sau 600 giây, chỉ dùng được cho `PUT` với
        đúng `Content-Type` đã khai. Đăng ký kết quả qua `POST /media` bên dưới trong vòng phiên
        presign-session (Redis, TTL 900s) — xem docs/data/modules/media.md §Presign-session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size, checksum_sha256]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 10485760, description: 'Byte, tối đa 10 MiB.' }
                checksum_sha256:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  description: SHA-256 của nội dung file, hex viết thường (64 ký tự) — client tự tính trước khi presign.
      responses:
        '201':
          description: Đã tạo presigned URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          key: { type: string, example: 'media/2f6a1e2e-2b8e-4e9a-9c8b-5b6a7c8d9e0f.jpg' }
                          upload_url: { type: string, format: uri, description: Presigned PUT URL — hết hạn sau expires_in giây, KHÔNG lưu lại/log. }
                          expires_in: { type: integer, example: 600 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /media:
    post:
      tags: [Media]
      summary: Đăng ký media sau khi đã PUT thành công lên object storage
      operationId: createMedia
      security: [{ bearerAuth: [] }]
      description: >-
        Yêu cầu phiên presign-session còn hiệu lực cho đúng `key` này VÀ thuộc đúng người gọi
        (chống việc đăng ký hộ/chiếm dụng key của người khác) — 422 nếu không có phiên (chưa
        presign/đã đăng ký/hết hạn), 403 nếu phiên thuộc người khác. Server tự xác thực object
        thật trên storage (HeadObject, rồi so khớp checksum — GET+stream nếu HEAD không có
        checksum đáng tin cậy) bằng chính giá trị content_type/size/checksum ĐÃ LƯU từ bước
        presign, không tin lại giá trị từ client ở bước này. Trùng checksum theo cùng người
        upload → 409 (object thừa bị xoá khỏi storage). Media luôn tạo ở trạng thái `pending`
        (ảnh cộng đồng đóng góp, chưa kiểm duyệt) — `url` LUÔN `null` cho tới khi một luồng kiểm
        duyệt (ngoài phạm vi milestone này) công bố nó.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, example: 'media/2f6a1e2e-2b8e-4e9a-9c8b-5b6a7c8d9e0f.jpg' }
                caption: { type: string, maxLength: 300 }
                alt: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Đã đăng ký
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Media' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  # ---- Ảnh của cơ sở (Owner Place Photos, 2026-08-11) ----
  # Vòng đời: chủ/quản lý cơ sở tải lên -> `pending` -> kiểm duyệt viên duyệt (`published`) hoặc
  # từ chối (`rejected`). KHÔNG có nhánh nào tự công khai. Chỉ `published` xuất hiện ở kênh công
  # khai (gallery của GET /places/{slug} và GET /media/{id}/file).
  #
  # Place id nằm trên PATH (không phải trong body) vì đó là điều kiện để PermissionsGuard phân giải
  # `@AuthorizationContext(place)` và cưỡng chế `Media.Upload.Managed` trên đúng cơ sở đó — nhờ vậy
  # place_id không thể bị tráo.
  /places/{placeId}/media:
    get:
      tags: [Media]
      summary: Ảnh của cơ sở cho màn hình quản lý (MỌI trạng thái)
      operationId: listPlaceMedia
      security: [{ bearerAuth: [] }]
      description: >-
        Khác gallery công khai: trả CẢ `pending`/`rejected`/`hidden` để chủ cơ sở biết ảnh mình gửi
        đang ở đâu trong quy trình. `url` trỏ tới kênh nội bộ `/places/{placeId}/media/{mediaId}/file`
        (ảnh chưa duyệt không có URL công khai nào). KHÔNG trả `object_key`/`bucket`/`checksum`.
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlaceOwnerMedia' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Media]
      summary: Đăng ký ảnh của cơ sở sau khi PUT (luôn vào pending + hàng chờ kiểm duyệt)
      operationId: registerPlaceMedia
      security: [{ bearerAuth: [] }]
      description: >-
        Cơ sở đích lấy từ PHIÊN PRESIGN (đã khoá `placeId` lúc quyền được kiểm tra), không lấy từ
        body. Tạo dòng media `pending` VÀ một `moderation_cases` (`source=new_content`) trong CÙNG
        một transaction — không bao giờ có ảnh pending mà không ai duyệt.
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
                caption: { type: string, maxLength: 300 }
                alt: { type: string, maxLength: 200 }
      responses:
        '201': { description: 'Đã đăng ký — status luôn `pending`, `url` null.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /places/{placeId}/media/presign:
    post:
      tags: [Media]
      summary: Xin presigned PUT URL cho ảnh của cơ sở
      operationId: presignPlaceMedia
      security: [{ bearerAuth: [] }]
      description: >-
        Yêu cầu `Media.Upload.Managed` trên CHÍNH cơ sở ở path (chủ cơ sở hoặc người quản lý được
        gán). Body giống `POST /media/presign` và cũng KHÔNG nhận trường owner nào.
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size, checksum_sha256]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 10485760 }
                checksum_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '201': { description: Đã tạo presigned URL }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /places/{placeId}/media/order:
    patch:
      tags: [Media]
      summary: Sắp xếp lại ảnh của cơ sở
      operationId: reorderPlaceMedia
      security: [{ bearerAuth: [] }]
      description: >-
        Yêu cầu `Media.Upload.Managed` trên CHÍNH cơ sở ở path (chủ cơ sở hoặc người quản lý được
        gán) — cùng đường phân quyền với mọi endpoint ảnh cơ sở khác.


        **Hợp đồng "toàn bộ hay không có gì":** `media_ids` phải là ĐÚNG tập ảnh chưa gỡ của cơ sở
        (MỌI trạng thái, kể cả `pending`/`rejected`), mỗi id đúng MỘT lần. Danh sách thiếu, có id
        trùng, hoặc lẫn id của cơ sở khác đều trả 422 — không có ngữ nghĩa "sắp một phần", vì vị trí
        của ảnh bị bỏ qua sẽ là một câu hỏi không có câu trả lời đúng duy nhất.


        `sort_order` được ghi lại thành 0..n-1 theo đúng thứ tự mảng, trong MỘT câu UPDATE
        set-based, bên trong một transaction có khoá hàng — sắp nhiều lần không làm số trôi dần và
        hai lần sắp đồng thời không lồng vào nhau.


        Sắp ảnh `pending` KHÔNG hề nới lỏng gì ở kênh công khai: gallery công khai vẫn chỉ trả
        `published`; ảnh chờ duyệt chỉ đơn giản đáp xuống đúng vị trí đã chọn khi được duyệt.
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_ids]
              properties:
                media_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 'Danh sách ảnh SAU khi sắp, theo thứ tự chuẩn của server.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlaceOwnerMedia' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /places/{placeId}/media/cover:
    patch:
      tags: [Media]
      summary: Chọn ảnh bìa cho cơ sở
      operationId: setPlaceCoverImage
      security: [{ bearerAuth: [] }]
      description: >-
        Yêu cầu `Media.Upload.Managed` trên CHÍNH cơ sở ở path. Client gửi MEDIA ID, KHÔNG BAO GIỜ
        gửi URL: một URL do client cung cấp không kiểm chứng được, còn media id thì kiểm được đầy đủ
        tư cách. Giá trị lưu là `places.cover_image_id`; URL công khai được SINH lúc đọc nên không
        có presigned URL nào bị lưu lại.


        **Điều kiện đủ tư cách** (nằm trong `EXISTS` của chính câu UPDATE, không phải "kiểm tra rồi
        ghi"): ảnh thuộc ĐÚNG cơ sở này, `status = published`, có `object_key`, chưa xoá mềm.


        `404` khi ảnh không thuộc cơ sở này (không phân biệt "không tồn tại" với "của người khác");
        `422` khi ảnh CÓ thuộc cơ sở nhưng chưa được duyệt/đã bị từ chối/đang bị ẩn.


        **Vòng đời:** con trỏ được DỌN tự động khi ảnh bìa bị gỡ (`DELETE .../media/{mediaId}`) hoặc
        bị kiểm duyệt đưa ra khỏi `published` (hide/reject) — cùng transaction với thay đổi gây ra
        nó. KHÔNG tự chọn ảnh thay thế: bìa mới phải do chủ cơ sở chọn tường minh, kể cả sau khi ảnh
        cũ được khôi phục.
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id]
              properties:
                media_id: { type: string, format: uuid }
      responses:
        '200':
          description: 'Danh sách ảnh của cơ sở, ảnh bìa mới có `is_cover: true`.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlaceOwnerMedia' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /places/{placeId}/media/{mediaId}:
    delete:
      tags: [Media]
      summary: Gỡ một ảnh khỏi cơ sở (xoá mềm)
      operationId: deletePlaceMedia
      security: [{ bearerAuth: [] }]
      description: >-
        `place_id` nằm trong WHERE của chính câu UPDATE — ảnh thuộc cơ sở khác khớp 0 dòng và trả
        404 (không phân biệt "không tồn tại" với "của người khác").
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /places/{placeId}/media/{mediaId}/file:
    get:
      tags: [Media]
      summary: Tải ảnh của cơ sở ở MỌI trạng thái (kênh của chủ cơ sở, redirect tới signed URL)
      operationId: getPlaceMediaFile
      security: [{ bearerAuth: [] }]
      description: >-
        Hai lớp: quyền trên cơ sở (guard) VÀ ảnh phải thuộc đúng cơ sở đó. Trả 302 tới signed URL
        ngắn hạn, `Cache-Control: private`.
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '302': { description: Redirect tới signed URL ngắn hạn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{id}/moderation-file:
    get:
      tags: [Media]
      summary: Tải ảnh ở MỌI trạng thái cho kiểm duyệt viên (redirect tới signed URL)
      operationId: getMediaModerationFile
      security: [{ bearerAuth: [] }]
      description: >-
        Yêu cầu `Media.Moderate` — đúng quyền mà quyết định kiểm duyệt media đòi hỏi, nên ai duyệt
        được ảnh thì mới xem được ảnh. Cần thiết vì không thể kiểm duyệt một bức ảnh chờ duyệt mà
        không nhìn thấy nó. Endpoint công khai `/media/{id}/file` KHÔNG bị nới lỏng.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '302': { description: Redirect tới signed URL ngắn hạn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{id}/file:
    get:
      tags: [Media]
      summary: Tải file media đã published (redirect tới signed URL)
      operationId: getMediaFile
      security: []
      description: >-
        Secure Private Media (2026-08-10). Điểm phát media DUY NHẤT ra công chúng — thay cho việc
        trả URL object storage trực tiếp, vốn đòi bucket mở anonymous read cho TOÀN BỘ object (kèm
        cả quyền liệt kê bucket), làm lộ media `pending`/`hidden`/`rejected` cho bất kỳ ai đọc được
        một object key. Bucket nay HOÀN TOÀN riêng tư.


        Công khai có chủ ý (không cần đăng nhập) — khách vãng lai phải xem được ảnh review/gallery.
        Trả `302` tới một presigned GET URL ngắn hạn (mặc định 300s, `S3_PRESIGN_GET_TTL`); KHÔNG
        stream bytes qua API. Trạng thái publish được kiểm tra LẠI ở MỖI request, nên ẩn/từ chối một
        media sẽ thu hồi quyền truy cập ngay ở lần tải kế tiếp.


        `404` cho MỌI trường hợp không phục vụ được — không tồn tại, `pending`, `hidden`,
        `rejected`, đã xoá mềm, hoặc dòng legacy không có `object_key`. Cố ý KHÔNG phân biệt các
        trường hợp này để endpoint công khai không trở thành oracle dò trạng thái kiểm duyệt.


        `Cache-Control: private, max-age=<nửa TTL>` — cho trình duyệt tái dùng redirect trong khi
        signed URL chắc chắn còn hiệu lực, nhưng không cho proxy/CDN dùng chung (signed URL là
        capability dạng bearer).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '302':
          description: Redirect tới presigned GET URL của object storage.
          headers:
            Location:
              schema: { type: string, format: uri }
              description: Presigned GET URL ngắn hạn (mang chữ ký SigV4).
            Cache-Control:
              schema: { type: string, example: 'private, max-age=150' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{id}:
    delete:
      tags: [Media]
      summary: Xóa media
      operationId: deleteMedia
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' } }
  /media/{id}/moderate:
