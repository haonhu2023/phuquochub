      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: type, in: query, schema: { type: string }, description: "Khai báo ở DTO nhưng CHƯA được service sử dụng để lọc (search.service.ts) — giữ nguyên vì client hiện có thể đang gửi, không xoá khỏi contract." }
        - { name: category, in: query, schema: { type: string }, description: "category_id (uuid) — cùng cột places.category_id đã lọc ở /hotels /restaurants /tours /attractions /beaches." }
