    NO further Place execution task is defined or authorized. PLACE-001..PLACE-018 are complete and
    all three owner-approved remediations (OD-F-1, OD-F-6, OD-F-17) are implemented AND validated.
    Every remaining item needs infrastructure or an owner decision that no task can supply:
    install Docker (unblocks DB/migration/HTTP/authz/e2e/EXPLAIN evidence — the largest gap by far),
