                                  #
                                  # MECHANISM: Redis revocation epoch `authrev:{userId}` (epoch
                                  # SECONDS) with TTL = jwt.accessTtl, enforced in JwtAuthGuard.
                                  # JWT format UNCHANGED -- uses `iat`, already present in every
                                  # token, so pre-existing tokens keep working (no token migration,
                                  # no coordinated deploy). Key TTL = access TTL is load-bearing:
                                  # after that window every token issued before the epoch is
                                  # independently expired, so storage is O(recently-revoked users),
