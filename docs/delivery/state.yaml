                                  # successful revokeRole() (both revoke the TARGET user, ordered
                                  # DB -> audit -> revoke so privileged actions always leave a trail),
                                  # and a new authenticated POST /auth/logout-all (principal from JWT
                                  # only, no body). logout-all also kills every refresh token, which
                                  # required a minimal per-user refresh index `refresh:user:{userId}`
                                  # (Redis SET of jtis) -- previously Redis held only
                                  # refresh:{jti} -> userId with no way to enumerate a user's tokens.
                                  # Index bookkeeping ONLY: rotation stays single-use, jti-checked and
