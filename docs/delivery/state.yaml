verification_environment:
  # Updated 2026-07-22. Node installed as a PORTABLE extract (no admin): the winget MSI
  # failed at the UAC elevation prompt (exit 1602) in a non-interactive session.
  node_runtime: available              # v24.18.0 at %LOCALAPPDATA%\node-portable, npm 11.16.0
  node_on_system_path: false           # must be prepended per shell; NOT a system install
  workspace_packages_linked: false     # FAT32 cannot symlink; packages MATERIALIZED as real dirs
  workspace_packages_materialized: >-
    node_modules/@phuquochub/{shared-types,utils} contain a copied package.json + prebuilt
    dist/. This is a local workaround, not an npm workspace link; it will go stale if either
    package's source changes. Re-copy, or relocate to NTFS and run `npm install`, after any
    change to packages/*.
  can_run_lint: true                   # verified: eslint on places+geo → exit 0
  can_run_typecheck: true              # verified: tsc --noEmit → exit 0
  can_run_build: verified_via_tsc      # PLACE-013: tsc -p tsconfig.build.json → exit 0, main.js emitted. Full `nest build` still unrun.
  can_run_unit_tests: true             # verified: jest places.dto 12/12, geo.dto 9/9
  can_run_e2e: false                   # Docker NOT installed; needs Postgres/PostGIS/Redis
  docker: not_installed                # blocks db:up, migration:run, EXPLAIN verification
  volume: "F: FAT32 removable. NTFS targets available: D: (255 GB free), C: (92 GB free)"
  highest_leverage_fix: "Install Docker Desktop (for DB-backed validation); relocate to NTFS (for durable workspace links)"
  runbook: docs/delivery/ENVIRONMENT-SETUP-RUNBOOK.md

owner_decisions:
  # Recorded 2026-07-23 by the owner-decision approval gate. Approval source: owner instruction
  # supplied in-session. NO individual approver name, job title, ticket or meeting exists in
  # repository context and none is asserted. Records live in docs/delivery/decisions/ and the
  # four-part finding state in docs/delivery/findings/ (a directory created by that gate).
  recorded_at: "2026-07-23"
  convention_note: >-
    No owner-decision naming convention pre-existed. docs/delivery/decisions/ held only
    ADR-DELIVERY-001, whose own scope line reads "Delivery execution control only", so extending
    that series to product/contract decisions would have mislabelled them. The OWNER-DECISION-<F-id>
    convention was established by this gate and should be ratified or renamed by the owner.
  decisions:
    - id: OD-F-1
      finding: F-1
      option: F1-C
      status: APPROVED
      record: docs/delivery/decisions/OWNER-DECISION-F-1.md
      remediation_task: PLACE-016
      summary: "Out-of-box coordinates must warn, not reject. Globally invalid coordinates still rejected. No replacement coordinates supplied or invented."
    - id: OD-F-6
      finding: F-6
      option: F6-A
      status: APPROVED
      record: docs/delivery/decisions/OWNER-DECISION-F-6.md
      remediation_task: PLACE-017
      summary: "OpenAPI follows validated runtime. status/sort/cursor get explicit deprecation notes, not silent deletion, because external consumer usage cannot be ruled out."
    - id: OD-F-17
      finding: F-17
      option: F17-D
      status: APPROVED
      record: docs/delivery/decisions/OWNER-DECISION-F-17.md
      remediation_task: PLACE-018
      summary: "status documented on PlaceCard using the EXISTING PlaceStatus enum (payload unchanged); score removed as dead surface — no endpoint ever emitted it via PlaceCard."
  approval_does_not_imply: >-
    A recorded decision is NOT an implementation and NOT a resolved finding. F-1, F-6 and F-17 all
    remain release blockers with implementation_status PENDING and validation_status PENDING.

proposed_tasks:
  # Derived from approved decisions, deliberately NOT activated. Governance carries a single
  # current.task and PLACE-015 already holds it, so activating any of these would create a second
  # active task. Each requires explicit owner authorization to become current.task.
  - { id: PLACE-016, status: COMPLETED, decision: OD-F-1, file: docs/delivery/tasks/PLACE-016.yaml,
      completed: "2026-07-23" }
  - { id: PLACE-017, status: COMPLETED, decision: OD-F-6, file: docs/delivery/tasks/PLACE-017.yaml,
