  analysis: complete
  validation: passed
  decision: "option (a) — REMOVED"
  results:
    - "npx jest places → 51/51 passed, 5 suites, exit 0 (GAP-02/04 regression specs UNMODIFIED)"
    - "npx eslint src/modules/places/**/*.ts --max-warnings=0 → exit 0"
    - "npx tsc -p tsconfig.json --noEmit → exit 0 (no compile-time consumer existed)"
  mandatory_criteria: "AC1..AC6 all PASS; optional AC7 also PASS"
