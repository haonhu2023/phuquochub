defect_found_and_fixed:
  summary: >-
    apps/web/Dockerfile's runtime stage COPY commands left .next/standalone (and static/public)
    owned by root, while the container runs as the non-root `node` user (USER node). Next.js
    14's runtime never wrote to .next/cache under the request patterns exercised by either
    PLACE-035 or this task. Next.js 16's runtime DOES attempt to write to .next/cache on request
    -- a code path Next 14 never exercised here -- causing EACCES: permission denied on
    apps/web/.next/cache mkdir, followed by an unhandled promise rejection, on the very first
    request to the place036-stabilization image before any fix was applied.
  proof_of_causation: >-
    Direct A/B test: booted the retained phuquochub-web:place035-next14-baseline image (root-owned
    .next, identical permission structure) against the same identical request sequence (/,
    /places/dinh-cau, /explore) -- zero EACCES, zero unhandled rejection, clean logs throughout.
    Confirms the defect is migration-caused (a genuine Next-16 runtime behavior difference), not a
    latent, always-present Dockerfile bug that both versions would have hit equally.
  fix: >-
    Added --chown=node:node to all three runtime-stage COPY --from=build commands in
    apps/web/Dockerfile -- Next.js's own documented Docker deployment pattern. Rebuilt the
    stabilization image; re-ran the identical trigger sequence; confirmed .next now
    owned by node:node, writable, zero EACCES, zero unhandled rejection in logs. Full route
    inventory (all static/index routes, all 5 dynamic [slug] routes including the pre-existing
    not-found status-code quirk) re-verified byte-identical to the pre-fix behavior otherwise --
    the fix eliminates the error without changing any observable application behavior.
  regression_coverage: >-
    Not a Jest-testable defect (container filesystem ownership under a non-root user is outside
    Jest's execution model). Regression coverage is the Docker-level A/B demonstration itself: (1)
    reproduced against the unfixed image, (2) reproduced as ABSENT against the Next-14 baseline
    under the identical sequence (proving causation), (3) reproduced as ABSENT against the fixed
    image under the identical sequence. This before/after/control triad is the appropriate and
    sufficient regression evidence for a Dockerfile permission fix.
  bounded_remediation_criteria_met:
    - "Caused by the Next.js migration: YES, proven via A/B test against the retained baseline image"
    - "Root cause understood: YES, root-owned COPY output vs non-root USER + Next 16's new runtime cache-write attempt"
    - "Fix small and local: YES, 3-line Dockerfile change, zero application source touched"
    - "No Owner decision required: YES, pure infra correctness fix, Next.js's own documented pattern"
    - "No dependency scope broadening: YES, zero package.json change"
    - "Behavior preserved: YES, full route inventory re-verified byte-identical otherwise"
    - "Verifiable: YES, direct before/after/control Docker-level demonstration"

