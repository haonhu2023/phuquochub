problem_statement: >-
  PlaceCardRow.verification_status is declared `string` in
  apps/api/src/modules/places/repositories/places.repository.ts, but the underlying column is a
  PostgreSQL ENUM ("verification_status", created in InitPlaces1720000400000 with
  NOT NULL DEFAULT 'pending'). When PLACE-005 single-sourced the response types, the shared
  PlaceCard typed the field as VerificationStatusValue, and the mismatch surfaced as
  TS2322 — resolved at the time by an UNCHECKED cast in places.mapper.ts
  (`row.verification_status as VerificationStatusValue`). That cast is sound only while the DB
  enum holds; it is a type assertion standing in for a type that could simply be correct.
  Recorded as F-18, classified NON_BLOCKING by the PLACE-010 assessment and named there as the
  lead item of the highest-priority cluster still actionable without Docker or an owner decision.

objective: >-
  Type the repository row at its declaration so the mapper needs no assertion, removing the one
  unchecked cast on the Place read path — without changing any SQL, any runtime value, or the
  wire contract.

required_inputs:
  - apps/api/src/modules/places/repositories/places.repository.ts        # PlaceCardRow, PlaceDetailRow
  - apps/api/src/modules/places/places.mapper.ts                         # the cast to remove
  - packages/shared-types/src/place.ts                                   # VerificationStatusValue
  - apps/api/src/core/database/migrations/1720000400000-InitPlaces.ts    # the DB enum that makes this sound
  - apps/api/src/modules/places/places.mapper.spec.ts                    # must pass unmodified
  - apps/api/src/modules/places/repositories/places.repository.spec.ts   # must pass unmodified

in_scope:
  - "apps/api/src/modules/places/repositories/places.repository.ts — the verification_status field type on PlaceCardRow only"
  - "apps/api/src/modules/places/places.mapper.ts — remove the now-unnecessary cast and its explanatory comment"

out_of_scope:
  - "any SQL, query shape, migration, entity or stored data change"
  - "F-19 (toPlaceDetail returns Date where the wire type says string) — related but a larger contract question; leave it"
  - "F-20 (opening_hours response type still Record<string, unknown>) — read-contract change, separate task"
  - "typing the OTHER string-typed fields on PlaceCardRow (status is already an enum; cover_image_url, short_description etc. are genuinely strings) — do not sweep"
  - "PlaceDetailRow's own fields beyond what it inherits"
  - "the response contract, openapi.yaml, DTOs, service, controller"
  - "adding runtime validation of the value — the DB enum is the guarantee; do not add a redundant check"

execution_steps:
  - "Confirm from InitPlaces1720000400000 that places.verification_status is a DB ENUM with NOT NULL — that is what makes typing the row sound rather than optimistic. Quote the line."
  - "Decide the import direction deliberately: the repository is DB-facing, so importing a type from @phuquochub/shared-types (a wire contract package) into it couples persistence to the contract. Check whether the repo already does this anywhere; if it does not, state explicitly why it is acceptable here (the union is the enum's value set, shared by both) or choose a local equivalent instead. Record the decision either way."
  - "Change PlaceCardRow.verification_status from `string` to the chosen union type."
  - "Remove the cast in places.mapper.ts along with the comment that justified it — the comment must not outlive the cast, or the next reader will look for a cast that is gone."
  - "Verify no OTHER consumer of PlaceCardRow.verification_status breaks: the tightening may surface further assumptions elsewhere (geo module, search module, specs)."
  - "Run the validation commands. The mapper and repository specs MUST pass unmodified — if either needs editing, the change altered behaviour rather than typing, which it must not."

acceptance_criteria:
  - { id: AC1, mandatory: true,  text: "PlaceCardRow.verification_status is typed as the enum's value union rather than string." }
  - { id: AC2, mandatory: true,  text: "The unchecked cast in places.mapper.ts is gone, along with the comment that justified it." }
  - { id: AC3, mandatory: true,  text: "No SQL, query, migration, entity, DTO, service, controller or contract change; no runtime value is converted or validated differently." }
  - { id: AC4, mandatory: true,  text: "The existing mapper and repository specs pass UNMODIFIED — proof this was a typing change, not a behavioural one." }
  - { id: AC5, mandatory: true,  text: "npx jest places, eslint and tsc --noEmit exit 0; apps/web tsc --noEmit also exit 0, since the shared package sits on both sides." }
  - { id: AC6, mandatory: true,  text: "The import-direction decision (contract type into a persistence file, or a local equivalent) is recorded with its reasoning." }
  - { id: AC7, mandatory: false, text: "Any further assumption surfaced by the tightening is recorded as a finding rather than fixed in passing." }

required_evidence:
  - "the InitPlaces line proving the column is a NOT NULL enum"
  - "before/after of both changed declarations"
  - "the import-direction decision and its reasoning"
  - "confirmation the mapper and repository specs were not edited"
  - "jest / eslint / tsc (api and web) exit codes"

