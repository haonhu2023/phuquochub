  # Node is a portable extract and is NOT on the system PATH. Prepend it first:
  #   $env:Path = "$env:LOCALAPPDATA\node-portable\node-v24.18.0-win-x64;$env:Path"
  - "cd apps/api && npx jest places"
  - "cd apps/api && npx eslint \"src/modules/places/**/*.ts\" --max-warnings=0"
  - "cd apps/api && npx tsc -p tsconfig.json --noEmit"
  - "cd apps/web && npx tsc --noEmit"

rollback_plan: >-
  Restore `verification_status: string` on PlaceCardRow and re-add the cast plus its comment in
  places.mapper.ts. Two edits, no schema, no data, no contract. Because nothing runtime changes,
  a revert cannot leave inconsistent state behind.

stop_conditions:
  - "Tightening the row type surfaces errors in modules outside places (geo, search, revisions) — STOP before editing them. Record the surfaced assumptions as findings; widening the change would turn a two-file remediation into a cross-module refactor."
  - "The mapper or repository specs require modification to pass — STOP. That means behaviour changed, which this task forbids; re-examine the change rather than editing the tests."
  - "Making this work appears to need runtime validation of the value — STOP. The DB enum plus NOT NULL is the guarantee; adding a redundant check is out of scope and would misrepresent where the invariant lives."

