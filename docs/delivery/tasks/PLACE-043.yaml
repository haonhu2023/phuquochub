schema_version: "1.0"

id: PLACE-043
workstream: place
title: "Hostinger VPS provisioning verification and production access readiness"
type: implementation
status: blocked
completed_at: null
blocked_reason: >-
  Owner has not yet supplied the non-sensitive Hostinger VPS facts this task requires (plan name,
  status, OS, region, public IPv4, vCPU/RAM/storage, DNS provider, nameservers, backup/snapshot
  availability). Claude has no Hostinger Dashboard access and cannot verify or fabricate these
  facts. Every part of this task completable from the repository alone (governance, existing-
  assumption inventory, SSH-readiness baseline, resource-suitability analysis, the VPS bootstrap
  runbook, the access/secret-boundaries document) IS complete -- see the report. Only the
  Owner-verification-dependent conclusions (actual provisioning status, actual DNS state, live VPS
  baseline command output) remain AWAITING_OWNER_VERIFICATION.

authority:
  source: >-
    Owner explicit written authorization 2026-07-25: "OWNER AUTHORIZATION — PLACE-043 ... Toi,
    Owner cua du an PhuQuocHub, chinh thuc cho phep tao va thuc hien nhiem vu: PLACE-043 —
    Hostinger VPS Provisioning Verification and Production Access Readiness." Explicit
    constraints: no application deployment, no DNS change (read-only DNS inspection only), no
    real secret used or stored.
  decision: >-
    Repository state verified fresh from disk first (git/state.yaml/task files), confirming
    PLACE-042 completed and current.task: none -- this authorization is the explicit, in-session
    Owner instruction required to create and execute PLACE-043. Repository-side work (governance,
    assumption inventory, SSH-readiness documentation, resource-suitability analysis, the
    bootstrap runbook, the access/secret-boundaries document) completed in full. Owner-side
    Hostinger Dashboard verification could not be performed by Claude (no Dashboard access exists
    or should exist for an agent) and was not fabricated -- the task stops at an explicit
    "OWNER INPUT REQUIRED" request for exactly the non-sensitive facts named in this task's own
    Phase 4/Owner authorization text, nothing more.

depends_on:
  - "PLACE-042 completed 2026-07-25 -- database migration rollback rehearsal; confirmed no current.task was authorized and no contradicting repository state existed before this task began."
  - "PLACE-039 (2026-07-25) -- PRE-DEPLOYMENT-CHECKLIST.md §1 already asked the Owner for 8 of the same non-sensitive Hostinger facts this task also needs; PLACE-043 extends that into a full bootstrap runbook and SSH/resource readiness assessment rather than duplicating the same short checklist."
  - "PLACE-037 (2026-07-25) -- classified Hostinger compatibility as 'unknown', explicitly not assumed compatible; this task is the first one actually structured to close that verification, pending Owner input."

preconditions_verified:
  - "current.task: none, working tree clean at task start (HEAD 9a3471b, branch master)"
  - "No git remotes configured; nothing to push regardless"
  - "docs/delivery/tasks/PLACE-037 through PLACE-042.yaml all status: completed"
  - "No confirmed Hostinger VPS IPv4, hostname, or SSH detail exists anywhere in this repository (grep-verified across docs/ and .env.example) -- every prior reference is either a decision (topology/domain/budget), a placeholder, or an explicit statement that real-account verification remains outstanding (PLACE-037 §31, PLACE-038/039 owner_approved_decisions)"

objective: >-
  Verify (to the extent repository evidence and Owner-supplied non-sensitive facts allow) whether
  the real Hostinger KVM VPS has been provisioned, produce a VPS bootstrap runbook and an SSH
  access-readiness baseline for PhuQuocHub specifically, assess resource suitability against this
  repository's actual Docker Compose topology (not generic marketing sizing), and define a clear
  boundary between what Claude/the repository may know (public IPv4, spec, OS, region, domain, DNS
  provider, public SSH key, non-sensitive usernames/ports) and what must never be stored here
  (any password, private key, database/JWT/SMTP/Cloudflare/Hostinger/R2 secret, recovery code) --
  without deploying the application, without changing DNS (read-only inspection only), and
  without using or storing any real secret.

scope:
  - "docs/delivery/HOSTINGER-VPS-BOOTSTRAP-RUNBOOK.md: new -- a 24-stage production VPS bootstrap runbook (pre-access confirmation through rollback/recovery access), each stage stating purpose, command/action, expected result, safety note, rollback/recovery method, and evidence to retain. Includes the Phase-7 read-only VPS baseline command checklist (OS/identity/CPU/memory/storage/network/time/firewall/updates/Docker/git/swap/existing-services/existing-containers/existing-web-servers/existing-databases), explicitly excluding every destructive command this task's own instruction lists."
  - "docs/delivery/PRODUCTION-ACCESS-AND-SECRET-BOUNDARIES.md: new -- what Claude/this repository may know (public IPv4, VPS spec, OS version, region, domain, DNS provider, public SSH key, non-sensitive usernames, public service ports/hostname) vs. what must never be stored here (root password, private SSH key, DB/JWT/SMTP/Cloudflare/Hostinger/R2 secret, backup-encryption key, recovery code), and where real production secrets should actually live (VPS environment file outside Git, Owner's password manager -- no new secret-management service invented)."
  - "docs/delivery/reports/PLACE-043-hostinger-vps-readiness-report.md: the existing-assumption inventory (CONFIRMED/OWNER-STATED/INFERRED/PLACEHOLDER/UNVERIFIED/OUTDATED classification of everything this repository currently believes about the Hostinger VPS), the 3-tier resource-suitability assessment (MINIMUM VIABLE / RECOMMENDED INITIAL PRODUCTION / UPGRADE THRESHOLD, derived from this repository's actual docker-compose.prod.yml service list, not generic sizing advice), and the production-bootstrap gap analysis (READY/PARTIAL/MISSING/BLOCKED/AWAITING OWNER per item)."
  - "docs/delivery/evidence/PLACE-043-hostinger-vps-readiness-evidence-index.md: evidence for every repository-side check performed."
  - "Task/state/workstream governance files for this task."
  - "An explicit, minimal 'OWNER INPUT REQUIRED — NON-SENSITIVE HOSTINGER FACTS' request for exactly the facts named in the Owner's own authorization text (VPS plan/status/OS-version/region/public-IPv4/vCPU/RAM/storage/DNS-provider/nameservers/backup-snapshot-availability) -- no password, private key, or token ever requested."

out_of_scope:
  - "Any real Hostinger Dashboard login, VPS purchase/provisioning action, or DNS record creation/change -- Owner-side only; this task performs read-only inspection guidance, never a mutation."
  - "Any application deployment to any VPS."
  - "Live SSH verification against a real VPS (Phase 11) -- not attempted: the Owner has not supplied a public IPv4 or SSH username in this session, and this task's own instruction forbids attempting this without exactly that information supplied first."
  - "Using or storing any real secret, password, private key, or token anywhere in this repository."
  - "Inventing a new secret-management service -- none is proposed; existing options (VPS environment file, Owner's password manager) are named instead."
  - "PLACE-044 or any successor task."

acceptance_criteria:
  - { id: AC1, mandatory: true, text: "Repository truth (git/state.yaml/task files) verified fresh from disk before any file was written." }
  - { id: AC2, mandatory: true, text: "Every existing repository assumption about the Hostinger VPS is classified CONFIRMED/OWNER-STATED/INFERRED/PLACEHOLDER/UNVERIFIED/OUTDATED with a citation -- Owner intent (e.g. 'Hostinger KVM VPS chosen') is never presented as a confirmed provisioning fact." }
  - { id: AC3, mandatory: true, text: "A 3-tier resource-suitability assessment is derived from this repository's actual docker-compose.prod.yml service list (postgres/redis/minio/api/web/caddy + Docker build layers + log/backup storage), not generic VPS marketing sizing, and does not alter the ~1-2M VND/month budget decision." }
  - { id: AC4, mandatory: true, text: "The VPS bootstrap runbook covers all 24 required stages, each with purpose/command/expected-result/safety-note/rollback-method/evidence-to-retain, uses only named placeholders (no real value), and contains zero destructive command (disk format, firewall reset, package purge, user deletion, container/volume deletion, DB deletion, reboot, OS reinstall, password change, or SSH lock-down before verified alternate access)." }
  - { id: AC5, mandatory: true, text: "The access/secret-boundaries document correctly separates what may be known from what must never be stored, and names only existing, already-adopted secret-holding locations (no new service invented)." }
  - { id: AC6, mandatory: true, text: "No live VPS SSH verification is attempted or fabricated -- the report states plainly that Phase 11 was not performed because no IPv4/SSH detail was supplied, not that it was blocked by a technical failure." }
  - { id: AC7, mandatory: true, text: "Zero real secret, password, private key, or token is written anywhere in any new or modified file." }
  - { id: AC8, mandatory: true, text: "state.yaml/workstreams/place.yaml updated consistently and WITHOUT internal contradiction (task file status matches state.yaml; workstream does not claim an active task while current.task is none; PLACE-043 is never described as an application deployment); current.task returns to none; PLACE-044 not created; working tree clean after commit(s); nothing pushed." }
  - { id: AC9, mandatory: true, text: "This task's final status is exactly 'blocked' (repository schema's closest match to 'awaiting Owner input'), not 'completed' -- since actual VPS provisioning could not be verified this session." }

stop_conditions:
  - "Any step would require Claude to access the real Hostinger Dashboard, a real VPS, or any real credential -- do not attempt, do not simulate a result."
  - "The Owner has not supplied the non-sensitive facts this task needs to conclude provisioning status -- stop at an explicit, minimal, non-sensitive-only request; do not guess, do not mark the task completed."

commit_strategy:
  - "1) docs(ops): add Hostinger VPS bootstrap runbook"
  - "2) docs(security): define production access and secret boundaries"
  - "3) docs(delivery): record PLACE-043 VPS readiness status"

evidence_requirements:
  - "docs/delivery/reports/PLACE-043-hostinger-vps-readiness-report.md"
  - "docs/delivery/evidence/PLACE-043-hostinger-vps-readiness-evidence-index.md"

definition_of_done: >-
  All repository-completable acceptance criteria pass; delivery evidence exists; the bootstrap
  runbook and access/secret-boundaries document exist; state.yaml/workstreams/place.yaml updated
  accurately and without contradiction; current.task returns to none; PLACE-044 proposed but not
  created; working tree clean; nothing pushed; task status is exactly 'blocked' pending the
  Owner's non-sensitive Hostinger facts, not 'completed'.

non_claims: >-
  This task does NOT confirm the Hostinger VPS is actually provisioned -- that remains
  AWAITING_OWNER_VERIFICATION. It does NOT deploy any application. It does NOT change any DNS
  record. It does NOT use or store any real secret, password, private key, or token. It does NOT
  perform a live SSH session against a real VPS (no IPv4/SSH detail was supplied this session). It
  does NOT invent a new secret-management service. It does NOT create PLACE-044.
