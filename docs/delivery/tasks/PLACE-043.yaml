acceptance_criteria:
  - { id: AC1, mandatory: true, text: "Repository truth (git/state.yaml/task files) verified fresh from disk before any file was written." }
  - { id: AC2, mandatory: true, text: "Every existing repository assumption about the Hostinger VPS is classified CONFIRMED/OWNER-STATED/INFERRED/PLACEHOLDER/UNVERIFIED/OUTDATED with a citation -- Owner intent (e.g. 'Hostinger KVM VPS chosen') is never presented as a confirmed provisioning fact." }
  - { id: AC3, mandatory: true, text: "A 3-tier resource-suitability assessment is derived from this repository's actual docker-compose.prod.yml service list (postgres/redis/minio/api/web/caddy + Docker build layers + log/backup storage), not generic VPS marketing sizing, and does not alter the ~1-2M VND/month budget decision." }
  - { id: AC4, mandatory: true, text: "The VPS bootstrap runbook covers all 24 required stages, each with purpose/command/expected-result/safety-note/rollback-method/evidence-to-retain, uses only named placeholders (no real value), and contains zero destructive command (disk format, firewall reset, package purge, user deletion, container/volume deletion, DB deletion, reboot, OS reinstall, password change, or SSH lock-down before verified alternate access)." }
  - { id: AC5, mandatory: true, text: "The access/secret-boundaries document correctly separates what may be known from what must never be stored, and names only existing, already-adopted secret-holding locations (no new service invented)." }
  - { id: AC6, mandatory: true, text: "No live VPS SSH verification is attempted or fabricated -- the report states plainly that Phase 11/9 was not performed because no VPS exists, not that it was blocked by a technical failure." }
  - { id: AC7, mandatory: true, text: "Zero real secret, password, private key, or token is written anywhere in any new or modified file." }
  - { id: AC8, mandatory: true, text: "state.yaml/workstreams/place.yaml updated consistently and WITHOUT internal contradiction (task file status matches state.yaml; workstream does not claim an active task while current.task is none; PLACE-043 is never described as an application deployment); current.task returns to none; PLACE-044 not created; working tree clean after commit(s); nothing pushed." }
  - { id: AC9, mandatory: true, text: "This task's final status is exactly 'completed' with outcome 'COMPLETED — VPS NOT PURCHASED; PRODUCTION DEPLOYMENT DEFERRED' -- the verification task itself is finished (every askable question was asked and Owner-answered); the report never claims 'VPS ready', 'SSH ready', 'production ready', or 'deployment complete', and never classifies 2.57.91.91 as a VPS address." }
  - { id: AC10, mandatory: true, text: "The Web Hosting suitability assessment (report §5) is evidence-based, grounded in this repository's actual docker-compose.prod.yml/data-source.ts/redis.service.ts/Caddyfile requirements, concludes 'not confirmed suitable for the current multi-service Docker topology without material redesign', and does not recommend or attempt any such redesign." }

