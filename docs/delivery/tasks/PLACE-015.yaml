execution_steps:
  - "Read searchFullText and confirm the exact current ORDER BY and that SearchService really paginates it with OFFSET (search.service.ts:16), while suggest() calls it with offset 0 (:31) and is therefore unaffected."
  - "Check openapi.yaml's /search operation for a declared ordering or stability guarantee. Record the result either way — it determines whether this is a contract fix or a quality fix, exactly as PLACE-014 did for the geo endpoints."
  - "Append `p.id ASC` as the LAST key, after `score DESC`. Do not alter the score expression or its direction — relevance ordering must be untouched, and p.id must arbitrate only rows already tied on score."
  - "Verify searchCount() needs no change and say so explicitly in the report; the count and the page query must continue to describe the same result set."
  - "Add determinism specs following the pattern already established in places.repository.spec.ts by PLACE-004 and extended by PLACE-014: reuse the existing orderKeysFrom / comparatorFor helpers rather than writing a third variant."
  - "Cover BOTH failure modes for this method: (a) two successive pages over tied rows are disjoint and complete — the mode that actually applies here because OFFSET is used; and (b) the ORDER BY ends with a unique key."
  - "Run the mutation check: remove the tie-breaker, prove the new specs fail for the expected reason, restore, and re-run to green. Leave no mutation in the tree."
  - "Run every validation command."

acceptance_criteria:
  - { id: AC1, mandatory: true,  text: "searchFullText's ORDER BY ends with a unique, non-null column, and `score DESC` remains the leading key with its direction unchanged." }
  - { id: AC2, mandatory: true,  text: "A spec asserts the emitted ORDER BY shape by parsing the real SQL, not by hard-coding an expected string." }
  - { id: AC3, mandatory: true,  text: "A spec demonstrates that two successive pages over score-tied rows are disjoint and complete, using the rotated-input technique that models planner freedom." }
  - { id: AC4, mandatory: true,  text: "A mutation check is performed and recorded: with the tie-breaker removed the new specs fail; restored, all pass. No mutation remains in the working tree." }
  - { id: AC5, mandatory: true,  text: "searchCount() is unchanged, and the report states explicitly why it needs no change." }
  - { id: AC6, mandatory: true,  text: "No relevance tuning, no service/DTO/controller/contract change, no new index, no change to any other repository method." }
  - { id: AC7, mandatory: true,  text: "npx jest places, npx jest search, eslint and tsc --noEmit all exit 0; existing search.service specs pass UNMODIFIED." }
  - { id: AC8, mandatory: false, text: "The openapi /search ordering-guarantee check is recorded, classifying this as a contract fix or a quality fix." }

required_evidence:
  - "before/after ORDER BY text"
  - "confirmation that SearchService.search paginates with OFFSET and that suggest() uses offset 0"
  - "the openapi /search ordering check result"
  - "explicit statement that searchCount needs no change, with the reason"
  - "mutation-check output showing which specs failed and that they were restored"
  - "all four validation exit codes, and confirmation search.service.spec.ts was not edited"

