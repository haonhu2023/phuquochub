rollback_plan: >-
  Remove `, p.id ASC` from searchFullText's ORDER BY and delete the added specs. Two edits in two
  files, no schema, data, migration or contract involved — the same two-line rollback PLACE-004
  and PLACE-014 documented for the identical pattern.

stop_conditions:
  - "Making pagination deterministic appears to require keyset/cursor pagination — STOP. That is the parked GAP-05/10 contract question and needs owner adjudication."
  - "The fix appears to change relevance ordering in any observable way — STOP and re-examine. p.id must only arbitrate rows already tied on score; if results reorder for non-tied rows, the change is wrong."
  - "The existing search.service specs need editing to pass — STOP. That would mean behaviour changed rather than ordering being stabilised."
  - "An index looks necessary for acceptable performance — STOP at the code change and record it; justifying an index needs EXPLAIN, which needs Docker."

