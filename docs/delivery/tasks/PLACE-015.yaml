problem_statement: >-
  PlacesRepository.searchFullText (apps/api/src/modules/places/repositories/places.repository.ts,
  the FTS query) orders by `ts_rank(...) DESC` alone and is called by SearchService with
  LIMIT/OFFSET pagination: search.service.ts:16 passes `(page - 1) * limit`. `score` is not
  unique — ts_rank readily produces identical values across documents that match a query
  equally well, and short Vietnamese queries over name+description make that common rather than
  exotic. With no unique final sort key, PostgreSQL may order tied rows differently between the
  page-1 and page-2 queries, so a user paging through search results can see the same Place
  twice or never see it at all.
  This is exactly the GAP-12 defect PLACE-004 fixed in list(), on a different and user-facing
  endpoint. PLACE-014 discovered it while analysing F-16 and recorded it as F-32; it was out of
  that task's scope (which excluded the search module), so it was escalated rather than fixed.
  Note searchCount() is a separate query with no ORDER BY — it is unaffected, but the pair is
  worth checking together since they must agree on the result set.

objective: >-
  Make search pagination deterministic by appending a unique final sort key to the FTS query,
  without changing relevance ordering, the response contract, or the search behaviour a caller
  can already rely on.

