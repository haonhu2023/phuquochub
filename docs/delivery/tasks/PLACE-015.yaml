  - apps/api/src/modules/places/repositories/places.repository.spec.ts   # PLACE-004/014 determinism spec pattern + orderKeysFrom helper
  - apps/api/src/modules/search/search.service.ts                        # :16 paginated call, :31 suggest call
  - apps/api/src/modules/search/search.service.spec.ts                   # existing expectations, must not be weakened
  - docs/delivery/reports/PLACE-004-ordering-report.md                   # the proven-safe pattern
  - docs/delivery/reports/PLACE-014-geo-ordering-analysis.md             # §19 F-32 as recorded
