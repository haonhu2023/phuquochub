objective: >-
  Migrate apps/web from Next.js 14.2.35 to 16.2.11, migrate ESLint from legacy .eslintrc to flat
  config (forced by eslint-config-next@16 requiring eslint>=9 and by next lint being removed
  entirely), and convert the 5 dynamic-route files identified by PLACE-033/034 from synchronous to
  asynchronous params -- while preserving every existing functional, build, Docker, SEO, routing,
  authentication, and environment guarantee. Local/Docker implementation and verification only; no
  real deployment.

approved_package_set:
  changes:
    - { package: "next", from: "^14.2.5", to: "^16.2.11" }
    - { package: "eslint-config-next", from: "^14.2.5", to: "^16.2.11" }
    - { package: "eslint", from: "^8.57.0", to: "^9.x (exact version pinned during installation, against eslint-config-next@16's actual peer floor)" }
  must_remain_unchanged: ["react", "react-dom", "@types/react", "@types/react-dom", "typescript",
    "maplibre-gl", "jest", "ts-jest", "turbo", "Node.js version", "all apps/api and packages/* dependencies"]
  prohibited: ["npm update", "npm audit fix", "npm audit fix --force", "npm install --force",
    "npm install --legacy-peer-deps", "silent peer-conflict suppression"]

scope:
  - "apps/web/package.json: exactly the 3 approved package changes, plus the lint script (next lint -> direct eslint invocation)."
  - "5 dynamic-route files: apps/web/src/app/(public)/{events,hotels,places,restaurants,tours}/[slug]/page.tsx -- convert params to Promise<{slug:string}> + await, in both generateMetadata and the default page component."
  - "apps/web/.eslintrc.json -> apps/web/eslint.config.mjs (flat config, importing the flat next/core-web-vitals preset), preserving --max-warnings=0 and all existing rule semantics."
  - "Full baseline capture + re-verification: dependency tree, lint, typecheck, unit tests, clean build, Docker build+boot for BOTH the pre-migration (tagged, retained) and post-migration images, live HTTP/SEO/metadata checks, audit before/after comparison, full N16->N14-baseline->N16 rollback rehearsal with forward recovery."

out_of_scope:
  - "React 19 (must remain unchanged, per the approved package set)."
  - "Node.js version change (not mandatory per PLACE-034)."
  - "The 5 unrelated typeorm-chain security findings (apps/api-side, separate governance item)."
  - "Any apps/api or packages/* change."
  - "Any real deployment (Hostinger or otherwise)."
  - "UI redesign, new features, SEO expansion, unrelated performance refactors, authentication redesign, broad dependency modernization, observability-provider integration, content changes, unrelated test cleanup."
  - "PLACE-036 or any successor task."

