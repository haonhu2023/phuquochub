rollback_plan: >-
  Revert the ORDER BY clause in list() and remove the added specs. Two files, no schema, no
  data, no contract. Because nothing is applied to a database and no migration is authored,
  rollback is complete and non-destructive.

stop_conditions:
  - "Making the ordering deterministic appears to require switching to keyset/cursor pagination — STOP. That is the parked GAP-05/10 contract question and needs owner adjudication."
  - "The fix appears to require a new index or migration to perform acceptably — STOP at the code change, record the index need as a finding, and do not author the migration here."
  - "A DB-backed check seems necessary to prove the ordering — it is not. Structural spec assertions plus deterministic in-memory pagination are the approved bar; Docker is not installed and no EXPLAIN evidence may be claimed."

