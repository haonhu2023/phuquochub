problem_statement: >-
  PlacesRepository.list() (apps/api/src/modules/places/repositories/places.repository.ts:237-242)
  paginates with `ORDER BY p.rating_avg DESC NULLS LAST, p.created_at DESC` and LIMIT/OFFSET.
  Neither key is unique: rating_avg is numeric(2,1) over a small range (many exact ties, plus
  a large NULL group for unrated places), and created_at is set by a shared `now()` default so
  seeded/imported rows share timestamps. With no unique final sort key, PostgreSQL may order
  tied rows differently between the count/page queries and between successive page requests —
  so a row can appear on two pages or on none while the caller walks the list. This is
  GAP-12 in the Place gap register (workstreams/place.yaml), priority P2, and it affects the
  default public listing path — the same path PLACE-003's idx_places_status_active serves.

objective: >-
  Make Place list pagination deterministic by appending a unique final sort key to the list
  ordering, and prove the determinism with repository-level specs. Ordering semantics visible
  to callers (primary sort by rating, then recency) must not change; only ties are affected.

required_inputs:
  - apps/api/src/modules/places/repositories/places.repository.ts        # list() ORDER BY, :237-242
  - apps/api/src/modules/places/repositories/places.repository.spec.ts   # existing repo spec convention
  - apps/api/src/core/database/migrations/1720000400000-InitPlaces.ts    # places PK + existing indexes
  - docs/api/openapi.yaml                                                # listPlaces contract (ordering not specified)
  - docs/delivery/reports/PLACE-003-migration-report.md                  # §27 F-14 (this finding)

in_scope:
