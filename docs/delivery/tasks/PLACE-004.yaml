  - "apps/api/src/modules/places/repositories/places.repository.spec.ts — extend with ordering specs"

out_of_scope:
  - "changing the primary ordering keys (rating_avg, created_at) or their direction"
  - "switching offset pagination to cursor/keyset pagination — that is the parked GAP-05/10 contract question"
  - "nearby(), bbox(), bboxClusters(), searchFullText() ordering (distance/geometry/score driven; separate concern)"
  - "any new index or migration — decide and record whether one is warranted, do not create it here"
  - "DTO, controller, service, mapper, entity, shared-type or OpenAPI changes"
  - "GAP-13 getCardBySlug dead code; GAP-11 shared Place types; GAP-14 opening_hours"

execution_steps:
  - "Read list() and confirm the exact current ORDER BY and both call sites (count query and page query)."
  - "Confirm places.id is the primary key (InitPlaces:31) and therefore unique and non-null — the natural tie-breaker."
  - "Append the tie-breaker as the LAST ordering key so the caller-visible sort is unchanged; choose and record a stable direction (e.g. p.id ASC)."
  - "Check whether the count query needs any change — it has no ORDER BY, so state explicitly whether it is affected."
  - "Assess whether the new sort key warrants an index: record the reasoning and the decision. Creating one is OUT OF SCOPE for this task; if warranted, raise it as a finding for a later migration task."
  - "Read places.repository.spec.ts first and follow its existing mocking/assertion style — do not introduce a second testing pattern."
  - "Add specs proving: the emitted SQL ends with the unique key; the primary keys still lead; and two successive page queries over a tied dataset produce disjoint, complete results."
  - "Run the validation commands below, narrowest first."

acceptance_criteria:
  - { id: AC1, mandatory: true,  text: "list()'s page query ORDER BY ends with a unique, non-null column so the total order is deterministic." }
  - { id: AC2, mandatory: true,  text: "The existing primary sort keys and their directions are unchanged and still lead the ORDER BY." }
  - { id: AC3, mandatory: true,  text: "A spec asserts the emitted ORDER BY shape, and a spec demonstrates stable, non-overlapping pagination across at least two pages of tied rows." }
  - { id: AC4, mandatory: true,  text: "No DTO, controller, service, mapper, entity, migration, index or contract change." }
  - { id: AC5, mandatory: true,  text: "npx jest places.repository, eslint and tsc --noEmit all exit 0." }
  - { id: AC6, mandatory: false, text: "The index question for the new sort key is explicitly decided and recorded with its reasoning." }

required_evidence:
  - "before/after ORDER BY text from places.repository.ts"
  - "proof places.id is the primary key (InitPlaces migration line reference)"
  - "spec output showing the new ordering specs passing"
  - "eslint and tsc exit codes"
  - "explicit statement of whether the count query was affected"

