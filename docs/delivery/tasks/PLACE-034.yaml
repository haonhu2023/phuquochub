completed_at: null

authority:
  source: "NOT YET AUTHORIZED. Drafted by the PLACE-034 decision gate per its own governance rule (§16): a draft, inactive task authority may be created when the gate result is AUTHORIZED WITH CONDITIONS, but it must remain inactive and not be executed."
  decision: "docs/delivery/reports/PLACE-034-NEXTJS-16-DECISION-GATE-2026-07-25.md — gate result AUTHORIZED WITH CONDITIONS, contingent on the three Owner decisions and one process condition listed in that report's §24, none of which have been made or accepted as of this draft's creation."

depends_on:
  - "PLACE-032 completed 2026-07-24 (NestJS 10->11 migration) — precedent for this migration's rollback/verification pattern"
  - "The PLACE-033 read-only migration-readiness assessment (2026-07-25, this session) — its findings are persisted in and superseded-in-authority by the PLACE-034 decision gate report"
