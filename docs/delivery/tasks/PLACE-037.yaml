objective: >-
  Produce an evidence-based decision gate covering the initial production deployment target, the
  production runtime model, the monitoring/alerting provider, minimum production observability
  scope, and rollout/rollback prerequisites -- without deploying, provisioning, purchasing,
  modifying DNS, connecting monitoring providers, adding SDKs, or changing any application code,
  package manifest, lockfile, Dockerfile, CI file, environment file, or delivery state beyond
  this task's own governance records.

scope:
  - "Architecture inventory of currently-required services, evidence-based (not from deployment.md's target design alone)."
  - "Deployment readiness assessment of every existing production artifact (Dockerfiles, Compose, CI, env validation, migrations, health checks)."
  - "Comparison of 5 deployment models against this repository's actual constraints (single VPS Compose, VPS+managed data, provider-native Node hosting, split-provider, current Hostinger account)."
  - "Two topology options with exactly one recommendation."
  - "Resource sizing, backup policy, migration strategy, secrets strategy -- all labeled as estimates/policy design, none executed."
  - "Observability inventory, 5-option monitoring comparison with a scored decision matrix, minimum launch observability classification, alert policy design, logging/retention policy design."
  - "Health-check design assessment, reverse-proxy/TLS recommendation, DNS planning (no DNS change)."
  - "Rollout strategy (model selection + 15-step sequence) and rollback requirements."
  - "Owner-decision inventory with recommended defaults and whether the next implementation task can proceed without each."
  - "Recommended first-launch architecture, separating repository-evidence-based recommendation from Owner-confirmation-required assumptions."
  - "Proposed scope for a future, separately authorized implementation task -- not created or activated here."
  - "Final scored decision matrix and exactly one gate result."

out_of_scope:
  - "Any production deployment, cloud resource creation, service purchase, DNS modification."
  - "Connecting external monitoring providers or adding provider SDKs."
  - "Any application code, package manifest, lockfile, Dockerfile, CI file, or environment file change."
  - "PLACE-038 or any successor task."

key_findings:
  - "Deployment artifacts (Dockerfiles, docker-compose.prod.yml, CI docker-build job) are production-ready and repeatedly verified LOCALLY; none has ever run on real infrastructure -- the report is explicit not to confuse the two."
  - "MinIO/object storage exists as infrastructure in docker-compose.prod.yml but is NEVER called by application code (zero S3_*/@aws-sdk/minio reference in apps/api/src) -- correctly classified as deferrable, not mandatory, for initial launch."
  - "No BullMQ worker, no scheduled jobs, no email provider exist anywhere in code despite appearing in deployment.md's target architecture diagram -- correctly excluded from the required-services inventory."
  - "Redis has no password configured in docker-compose.prod.yml -- a real, bounded gap flagged for the future implementation task, low risk today since Redis is never publicly exposed in the recommended topology."
  - "Neither apps/api/Dockerfile nor apps/web/Dockerfile declares a Docker-native HEALTHCHECK instruction -- flagged as a gap, not fixed (Dockerfile changes are prohibited by this task's own constraints)."
  - "apps/api/Dockerfile has the same COPY --from=build pattern without --chown that caused PLACE-036's real, proven EACCES defect in apps/web/Dockerfile -- but no evidence exists that the API ever writes to its own filesystem at runtime, so this is flagged as an UNVERIFIED pre-launch check, not a claimed defect (no speculation without evidence)."
  - "Hostinger compatibility classified as 'unknown', not assumed compatible merely because an account exists, per this task's explicit instruction -- the specific plan tier (shared vs VPS) is not established anywhere in repository evidence."
  - "Recommended topology: single VPS running the existing docker-compose.prod.yml stack, fronted by Caddy for automatic TLS -- reuses already-built, already-verified infrastructure and matches the project's actual current scale (zero real users)."
  - "Recommended minimum monitoring stack: infrastructure-native monitoring (Docker healthchecks + existing structured/correlated logs) + one external uptime check -- zero new dependency, zero new infrastructure; Sentry recommended as the first upgrade once real users exist; Grafana/Prometheus and OpenTelemetry explicitly deferred as disproportionate to current traffic (zero)."

