  next_task: docs/delivery/tasks/PLACE-006.yaml
  representation_decision: >-
    AC7 — enums are string-literal UNIONS, not TS enums. Type-only, so apps/web loads no runtime
    enum object into the client bundle; and a scratchpad tsc probe confirmed string-enum members
    are assignable to their literal union, so apps/api keeps using place.enums.ts without casts.
  open_findings: >-
