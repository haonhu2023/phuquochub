  implementation: complete
  validation: passed
  results:
    - "packages/shared-types tsc --noEmit → exit 0; npm run build → exit 0 (dist/place.* emitted)"
    - "node_modules/@phuquochub/shared-types re-materialized (FAT32 copy) → index.d.ts exports ./place"
    - "apps/api tsc --noEmit → exit 2 (1 × TS2322) then exit 0 after narrowing at the mapper"
    - "apps/web tsc --noEmit → exit 0 (baseline before edits was also exit 0)"
    - "apps/api jest places → 33/33 passed, 5 suites, exit 0 — mapper specs UNMODIFIED"
    - "eslint apps/api places + packages/shared-types src → exit 0"
  mandatory_criteria: "AC1..AC6 all PASS; optional AC7 also PASS"
  report: docs/delivery/reports/PLACE-005-shared-types-report.md
  evidence_index: docs/delivery/evidence/PLACE-005-shared-types-evidence-index.md
  changed_files:
    - packages/shared-types/src/place.ts                      # new — single declaration
