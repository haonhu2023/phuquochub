acceptance_criteria:
  # Derived from the documented failures G-1, G-2, G-3, F-33, F-3 and the recorded BUILD-readiness
  # rules. NOT invented for this task.
  - { id: AC1, mandatory: true,  text: "git rev-parse --is-inside-work-tree succeeds; repository is under local version control (F-3 condition)." }
  - { id: AC2, mandatory: true,  text: ".gitignore verifiably excludes dependencies, build output, secrets/env, coverage, temp, logs, editor/OS artifacts; no secret or node_modules path appears in git status." }
  - { id: AC3, mandatory: true,  text: "docs/delivery/project-registry.yaml parses with the SAME parser used by governance validation; intended values preserved; no project decision silently changed (G-1)." }
  - { id: AC4, mandatory: true,  text: "ALL governance YAML files parse, not only the repaired one." }
  - { id: AC5, mandatory: true,  text: "PLACE-001.yaml schema drift resolved with HISTORICALLY ACCURATE values traceable to its report/evidence; status and historical meaning preserved; recorded as schema normalization, NOT re-execution (G-2)." }
  - { id: AC6, mandatory: true,  text: "Every refreshed comment records old statement, contradicting evidence, replacement, and why no gate was weakened; no gate VALUE changed (G-3)." }
  - { id: AC7, mandatory: true,  text: "F-33 either remediated with a documented consumer sweep + regression coverage, or left OPEN with the exact missing authority stated." }
  - { id: AC8, mandatory: true,  text: "The repository-authoritative NestJS build command runs; exit code, dist/ contents and production entry point recorded." }
  - { id: AC9, mandatory: true,  text: "Full jest suite and API typecheck exit 0; web typecheck run if shared contracts were affected." }
  - { id: AC10, mandatory: true, text: "F-2 remains OPEN; database, migration, HTTP, authz-guard, geospatial, EXPLAIN and e2e gaps remain unverified; no runtime claim made from compilation alone." }
  - { id: AC11, mandatory: true, text: "No BUILD task created or activated; READY_FOR_BUILD not asserted from tests + compilation." }

validation_commands:
  # Node is a portable extract and is NOT on the system PATH. Prepend it first:
  #   $env:Path = "$env:LOCALAPPDATA\node-portable\node-v24.18.0-win-x64;$env:Path"
  - "git rev-parse --is-inside-work-tree && git status --short"
  - "governance YAML + state + task + dependency + evidence validation"
  - "cd apps/api && npx jest"
  - "cd apps/api && npx tsc -p tsconfig.json --noEmit"
  - "cd apps/api && npx nest build"

rollback_plan: >-
  Governance edits are individually revertible. `git init` is reversible by deleting .git. The F-33
  removal is a single method deletion, restorable from this task's report. No schema, data,
  migration or contract is involved.

stop_conditions:
  - "F-33 turns out to have a consumer, or its expected behaviour is ambiguous — STOP and leave it OPEN."
  - "The build fails for a reason needing global software or machine configuration — STOP and record it as an external blocker."
  - "Any change would weaken a gate value or alter PLACE-001..PLACE-018 behaviour — STOP."
  - "A commit would include secrets or node_modules — STOP and do not commit."

completion_transition:
  on_success:
    task_status: completed
    set_state:
      current.task: none
      current.status: awaiting_task_authorization
  requires_evidence:
    - "git initialized and inspected"
    - "all governance YAML parsing"
    - "build exit code + dist contents"
    - "F-2 preserved OPEN"

non_claims: >-
  Completing this task does NOT authorize BUILD, does NOT prove runtime behaviour, and does NOT
  close any Docker-dependent verification gap. A successful compilation is not a working system.
