  - PLACE-001

problem_statement: >-
  api.md §11 (docs/api/api.md:184) requires Place coordinates to fall "trong Phú Quốc",
  but validation enforces only global lat/lng ranges (places.dto.ts:17-22 GeoPointDto;
  geo.dto.ts:5-13,23-33 Nearby/Bbox). Additionally NearbyQueryDto.radius has @Min(1) but
  no @Max (geo.dto.ts:12-13), so an anonymous caller can request an unbounded radius; the
  cap currently exists only as a service-side comment.

objective: >-
  Enforce a Phú Quốc coordinate boundary on all Place coordinate inputs and bound the
  nearby-search radius at the DTO layer, with regression specs — without touching
  persistence, storage format, coordinate order, or the API response contract.

in_scope_files:
  - apps/api/src/modules/places/dto/places.dto.ts        # GeoPointDto bounds
  - apps/api/src/modules/geo/dto/geo.dto.ts              # NearbyQueryDto, BboxQueryDto, radius @Max
  - apps/api/src/modules/places/dto/places.dto.spec.ts   # extend
  - "new (if absent): apps/api/src/modules/geo/dto/geo.dto.spec.ts"
  - "optional: a single shared bbox constant (e.g. a small geo constants file) to avoid duplication"

out_of_scope:
  - entities, migrations, services, controllers, repositories, mappers
  - API response contract / OpenAPI shape
  - the GAP-05/10 list-param divergence (needs owner adjudication — separate task)
  - geography storage, coordinate order, GeoJSON representation

required_evidence:
  - docs/delivery/reports/PLACE-001-place-domain-persistence-baseline.md   # §12, §20 GAP-07
  - docs/delivery/evidence/PLACE-001-evidence-index.md                     # V-1..V-3
  - docs/api/api.md:184

implementation_steps:
  - "Confirm/obtain the authoritative Phú Quốc bounding box (min/max lat, min/max lng). If not documented, implement a clearly-labelled PROVISIONAL constant and flag for owner confirmation — do not invent precision silently."
  - "Add a reusable coordinate-in-bounds validation (custom validator or explicit @Min/@Max pair) applied to GeoPointDto, NearbyQueryDto (lat/lng), and BboxQueryDto (min/max lat/lng)."
  - "Add an explicit @Max to NearbyQueryDto.radius consistent with the service cap."
  - "Keep the existing global @Min/@Max guards as defense-in-depth."
  - "Write/extend DTO specs (valid in-bounds, out-of-bounds lat, out-of-bounds lng, boundary equality, radius over-max, radius missing→default preserved)."

acceptance_criteria:
  - "Out-of-Phú-Quốc coordinates are rejected by CreatePlaceDto/UpdatePlaceDto (via GeoPointDto), NearbyQueryDto, and BboxQueryDto."
  - "NearbyQueryDto.radius has an explicit upper bound."
  - "DTO specs cover the listed cases and fail before the change (mutation-checked if Node available)."
  - "No entity/migration/service/controller/mapper/contract/response change."
  - "The Phú Quốc bbox is either sourced from SSOT or explicitly marked PROVISIONAL pending owner confirmation."

validation_commands:
  - "cd apps/api && npx jest places.dto"
  - "cd apps/api && npx jest geo.dto"
  - "cd apps/api && npx eslint \"src/modules/{places,geo}/**/*.ts\" --max-warnings=0"
  - "cd apps/api && npx tsc -p tsconfig.json --noEmit"

