objective: >-
  Produce an evidence-backed production configuration inventory and gap analysis (READY/PARTIAL/
  MISSING/BLOCKED per area, no speculation), then implement every item the analysis found both
  genuinely missing/broken AND completable without real infrastructure: an application-level
  fail-fast fix for a previously-unenforced Redis production config, a real smoke-test script
  closing a dangling reference in scripts/deploy.sh, and an operator-facing release/rollback/
  backup/restore checklist. No VPS/DNS/R2/monitoring-account action attempted -- those remain
  Owner-side per PLACE-039.

scope:
  - "apps/api/src/core/config/env.validation.ts: require REDIS_URL in production (mirrors the existing DB_HOST/CORS_ALLOWED_ORIGINS pattern) -- a real gap found by this task's own audit, since RedisService reads only `redis.url` and previously had no production-required rule, so a misconfigured deploy would have silently connected to the unauthenticated `redis://localhost:6379` dev default instead of failing fast."
  - "apps/api/src/core/config/env.validation.spec.ts: new PLACE-040 describe block pinning the REDIS_URL fail-fast behavior (pass/fail/dev-default cases, mirroring the existing PLACE-029 DB-credential suite's structure exactly); existing PLACE-029 suite's baseProdEnv fixture updated to include REDIS_URL so it is unaffected by the new production-required rule."
  - "scripts/smoke-test.sh: new -- consolidates the ad hoc health/route checks used during PLACE-038's manual verification into one reusable, exit-code-driven script (API health, web home, unknown-route 404, optional real-slug data check), run against Caddy's documented local :8080 test address by default."
  - "scripts/deploy.sh: Step 11 changed from an inert echo pointing at a nonexistent 'scripts/smoke-routes.sh' to an actual invocation of the new scripts/smoke-test.sh, halting with a rollback instruction on failure."
  - "docs/delivery/RELEASE-AND-ROLLBACK-CHECKLIST.md: new -- operator checkbox checklist for pre-release, deploy, smoke test, rollback-trigger criteria, rollback, restore, routine backup, startup verification, and shutdown verification, each step naming the exact script/command."
  - "docs/delivery/PRE-DEPLOYMENT-CHECKLIST.md: updated -- REDIS_URL row added to the secrets table noting the new fail-fast enforcement; cross-link added to the new release/rollback checklist."
  - "Task/report/evidence/state/workstream governance files for this task."

