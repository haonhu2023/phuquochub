objective: >-
  Produce a full, evidence-backed enterprise production audit (10 Owner-specified sections) with
  a scored assessment per dimension and a prioritized (Critical/High/Medium/Low) action list, then
  execute every genuinely missing item that is both real (evidence-backed, not speculative) and
  completable with zero Owner/VPS/DNS/real-secret dependency -- explicitly without adding product
  features, without refactoring working code that isn't broken, and without introducing new
  technical debt (every new file mirrors an existing, already-tested pattern in this repository).

scope:
  - "apps/web/src/app/(public)/{hotels,restaurants,tours,events}/[slug]/page.tsx: fix a real correctness bug found by this audit -- the main page body's catch block previously mapped EVERY error (including 5xx/network failures) to notFound(), unlike places/[slug]/page.tsx's own correct ApiError.isNotFound-based distinction (PLACE-035/036 baseline). Fixed identically in all 4 files: rethrow non-404 errors instead of masking them."
  - "apps/web/src/app/(public)/{hotels,restaurants,tours,events}/[slug]/error.tsx + loading.tsx: new -- these 4 routes had zero error/loading boundary before this task (confirmed by a repository-wide find), so the rethrown errors from the fix above previously had nowhere safe to land. Minimal, dependency-free (no CSS-module coupling, matching these pages' existing plain-HTML style)."
  - "apps/web/src/app/global-error.tsx: new -- root-level catch-all, did not exist anywhere in the app."
  - "apps/api/src/common/middleware/security-headers.middleware.ts (+ .spec.ts): new -- X-Content-Type-Options/X-Frame-Options/Referrer-Policy, found completely absent (no helmet, no manual equivalent). Implemented as a small manual middleware rather than adding the `helmet` npm dependency, to avoid a lockfile-wide dependency change for a 3-header need; structured identically to the existing, proven correlation-id.middleware.ts pattern (own file + own unit spec), not inline in main.ts."
  - "apps/api/src/main.ts: wire in the new security-headers middleware, immediately after the existing correlation-ID middleware."
  - "docs/delivery/INCIDENT-RESPONSE-RUNBOOK.md: new -- found completely missing (no incident-response or disaster-recovery document existed anywhere in docs/)."
  - "Task/report/evidence/state/workstream governance files for this task."

out_of_scope:
  - "Any real Hostinger/VPS/DNS/R2/uptime-monitor-account action -- Owner-side, unchanged since PLACE-039."
  - "The migration:revert rehearsal -- still open, Docker engine unreachable this session (same as PLACE-039/040)."
  - "Adding the `helmet` npm package, or any other new production dependency -- deliberately avoided; the 3-header need was met with a small manual middleware instead, per this task's own no-new-tech-debt / minimal-footprint instruction."
  - "Error/loading boundaries for the remaining route segments this audit found also lacking them (explore/map/search/dashboard, and any hotels/restaurants/tours list page) -- reported in the prioritized action list (Medium), not executed, since it was judged lower-value than the 4 detail routes (which had an actual masked-error bug, not just a missing boundary) and this task's own scope discipline against unbounded sprawl."
  - "Building list/browse pages for hotels, restaurants, or tours (confirmed via this audit to not exist at all) -- explicitly a new feature, forbidden by this task's own instruction."
  - "Sitemap.xml/robots.txt, a live Swagger/OpenAPI UI, frontend component/integration tests, an accessibility audit beyond what this audit's grep-based inventory found, HSTS at the Caddy layer, MinIO image-tag pinning -- all real, evidence-backed gaps, all reported in the prioritized action list, none executed (see the report for why each was judged out of this task's immediate-execution bar)."
  - "PLACE-042 or any successor task."

acceptance_criteria:
  - { id: AC1, mandatory: true, text: "Active task/dependency chain/repository state verified fresh from disk before any file was written." }
  - { id: AC2, mandatory: true, text: "All 10 Owner-specified audit sections are covered with evidence (file:line or command output) for every claim; no verdict asserted without evidence." }
  - { id: AC3, mandatory: true, text: "The 404-vs-error masking bug is fixed identically in all 4 affected files, verified against the already-correct places/[slug]/page.tsx pattern used as the fix template." }
  - { id: AC4, mandatory: true, text: "apps/api full unit suite passes with zero regression (256/256, up from 254/254 by exactly the 2 new security-headers-middleware tests)." }
  - { id: AC5, mandatory: true, text: "apps/web typechecks, lints, and produces a clean production build (11/11 routes) with zero regression after the page.tsx fixes and the 9 new boundary files." }
  - { id: AC6, mandatory: true, text: "A single production-readiness score is reported per audited dimension (architecture/backend/frontend/infrastructure/operations/security/performance/documentation/testing) plus one overall production-readiness percentage, each with a stated evidentiary basis -- no dimension scored without citing what was checked." }
  - { id: AC7, mandatory: true, text: "A prioritized action list (Critical/High/Medium/Low) lists every gap this audit found and was NOT executed, with a one-line reason for each." }
  - { id: AC8, mandatory: true, text: "Zero new npm dependency added; zero real secret written anywhere." }
  - { id: AC9, mandatory: true, text: "state.yaml/workstreams/place.yaml updated consistently; current.task returns to none; PLACE-042 not created; working tree clean after commit(s); nothing pushed." }

stop_conditions:
  - "Any fix found would require real Hostinger/DNS/R2/monitoring-account access -- record as BLOCKED (Owner-side), do not attempt or simulate."
  - "Any fix would require a live Docker stack to verify (e.g. the migration:revert rehearsal) -- Docker engine is unreachable this session; do not fabricate an execution result."
  - "Any finding would require adding a product feature (e.g. a hotels/restaurants/tours list page) to fully close -- report it, do not build it, per this task's explicit no-new-features instruction."

