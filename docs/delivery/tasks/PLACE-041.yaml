  - "2) apps/api/src/common/middleware/security-headers.middleware.ts (+spec) + main.ts wiring"
  - "3) docs/delivery/INCIDENT-RESPONSE-RUNBOOK.md"
  - "4) delivery evidence and state updates (task file, report, evidence index, state.yaml, workstreams/place.yaml)"

