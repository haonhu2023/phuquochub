authority:
  source: >-
    Owner explicit instruction 2026-07-25, in-session. Requested a full enterprise production
    audit across 10 sections (repository health, backend, frontend, infrastructure, operations,
    security, performance, a final score, a prioritized action list, and immediate execution of
    everything locally completable), explicitly forbidding new features, unnecessary refactors,
    and new technical debt.
  decision: >-
    Verified PLACE-037/038/039/040 already completed (HEAD 5ca81cd at task start, clean tree, no
    current.task authorized). This Owner instruction is itself the authorization, same precedent
    as PLACE-039/040. The audit surfaced one real, evidence-backed CORRECTNESS bug affecting 4
    routes (hotels/restaurants/tours/events detail pages blanket-caught every error, including
    5xx/network failures, into a 404 response -- masking real outages as "not found" and risking
    incorrect search-engine de-indexing), plus 3 real MISSING items (no security response headers,
    no error/loading boundaries for those same 4 routes or a root-level catch-all, no
    incident-response runbook). All four fixed; each mirrors an existing, already-proven pattern
    elsewhere in this repository rather than introducing a new one.

depends_on:
  - "PLACE-040 completed 2026-07-25 -- production configuration inventory. This task performs the broader enterprise audit (backend/frontend/security/performance dimensions PLACE-040 did not cover) and executes the same class of local-only fix."
  - "PLACE-035/036 completed 2026-07-25 -- established the places/[slug] 404-vs-error pattern this task extends to hotels/restaurants/tours/events, and the /places error.tsx/loading.tsx precedent this task's new boundaries follow."
  - "PLACE-029/030 -- established the fail-fast config and correlation-ID-middleware conventions this task's security-headers middleware follows exactly."

preconditions_verified:
  - "current.task: none, working tree clean at task start (HEAD 5ca81cd, branch master)"
  - "No git remotes configured; nothing to push regardless"
  - "docs/delivery/tasks/PLACE-037/038/039/040.yaml all status: completed"
