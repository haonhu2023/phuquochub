  # Node is a portable extract and is NOT on the system PATH. Prepend it first:
  #   $env:Path = "$env:LOCALAPPDATA\node-portable\node-v24.18.0-win-x64;$env:Path"
  - "node -e \"require('js-yaml').load(require('fs').readFileSync('docs/api/openapi.yaml','utf8'))\"   # openapi parses"
  - "cd apps/api && npx jest places"
  - "cd apps/api && npx tsc -p tsconfig.json --noEmit"

regression_requirements:
  - "all existing places specs pass UNMODIFIED — no spec may be edited by this task"
  - "no runtime source file may appear in the change set"

mutation_check_required: false     # documentation-only; there is no behaviour to mutate

rollback_plan: >-
  Revert the two documentation files. No code, schema, data or generated output is involved.

stop_conditions:
  - "Aligning documentation appears to require a runtime change — STOP. That would mean an implementation defect exists that OD-F-6 did not decide; record it and escalate."
  - "The task starts implementing status, sort or cursor — STOP. OD-F-6 explicitly rejected that (F6-B), and public `status` would reverse the GAP-02/04 security fix."
  - "A versioned deprecation mechanism seems required — STOP. ADR-010 (API Versioning) is still Proposed, so no versioning strategy exists to express one."
  - "Evidence of an external consumer of status/sort/cursor emerges — STOP. OD-F-6 reverses in that case."

