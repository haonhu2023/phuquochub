objective: >-
  Make docs/api/openapi.yaml and docs/api/api.md describe what GET /places actually accepts and
  returns, without changing a single line of runtime behaviour.

problem_statement: >-
  main.ts:20 configures ValidationPipe with whitelist + forbidNonWhitelisted, so a query parameter
  absent from ListPlacesQueryDto is REJECTED WITH HTTP 400, not ignored. openapi.yaml:461-471 and
  api.md:182 both publish `status`, `sort` and `cursor` for the Place list; none is implemented,
  so all three currently fail. Separately the response envelope diverges from the declared Meta
  schema. OD-F-6 approved option F6-A: documentation follows runtime.

affected_components:
  - docs/api/openapi.yaml            # :461-471 listPlaces params; :1568-1584 shared params; :1651-1658 Meta
  - docs/api/api.md                  # :62-63 pagination/sort conventions; :182 Place list request line
  - apps/api/src/modules/places/dto/places.dto.ts        # READ ONLY — the source of truth for what is accepted
  - apps/api/src/common/pagination.ts                    # READ ONLY — clamp + envelope behaviour
  - apps/api/src/main.ts                                 # READ ONLY — the ValidationPipe configuration

in_scope:
  - "docs/api/openapi.yaml — the listPlaces operation, and the Meta schema"
  - "docs/api/api.md — the Place-list request line and the pagination/sort convention text where it contradicts runtime"

out_of_scope:
  - "ANY runtime change. No DTO, controller, service, repository, pipe or type may be edited."
  - "implementing status, sort or cursor — explicitly rejected by OD-F-6 (option F6-B)"
  - "the keyset/cursor pagination redesign — parked, and blocked behind ADR-010 which is still Proposed"
  - "other operations' parameters; only /places GET is in scope"
  - "F-1 and F-17 remediation"

execution_steps:
  - "Re-derive the accepted parameter set from ListPlacesQueryDto directly. Do not copy the matrix in F-6.yaml — verify it."
  - "Confirm there are no Swagger/NestJS decorators to reconcile: the OpenAPI document is hand-maintained and checked in, not generated. State the result either way."
  - "Document category, ward, price_range, page, limit with their real defaults (page 1, limit 20), real allowed values, and the real limit behaviour: values above 100 are SILENTLY CLAMPED by clampLimit, not rejected."
  - "Document the actual ordering: fixed `rating_avg DESC NULLS LAST, created_at DESC, id ASC` (PLACE-004), with no client control."
  - "Document pagination as offset-based page/limit, with no cursor support."
  - "For status, sort and cursor apply OD-F-6 obligation 7: since external consumer usage CANNOT be ruled out, mark each with an explicit deprecation note stating it is not implemented and returns HTTP 400. Do not delete them silently."
  - "Reconcile the Meta schema with the emitted envelope: page, pageSize, total, totalPages, timestamp — and remove or mark next_cursor/quota_remaining as not emitted by this operation."
  - "Reconcile api.md:62-63 and :182 so the prose no longer contradicts the corrected contract."
  - "Run the validation commands. Runtime specs must pass UNMODIFIED — they will, because no runtime file is touched."

acceptance_criteria:
  - { id: AC1, mandatory: true,  text: "Every parameter accepted by ListPlacesQueryDto is documented in openapi listPlaces." }
  - { id: AC2, mandatory: true,  text: "Every parameter documented as ACTIVE in openapi listPlaces is accepted by runtime — verified by comparing against the DTO, not by assumption." }
  - { id: AC3, mandatory: true,  text: "Documented defaults and maximum limits match runtime: page default 1, limit default 20, limit clamped (not rejected) above 100." }
  - { id: AC4, mandatory: true,  text: "Enum and allowed values match: price_range = free|low|mid|high, matching PriceRange." }
  - { id: AC5, mandatory: true,  text: "Geographic filters: the report states explicitly that GET /places accepts NONE, and that geographic queries live on /geo/nearby and /geo/bbox." }
  - { id: AC6, mandatory: true,  text: "Pagination and sorting semantics match runtime: offset page/limit, no cursor, fixed server-side ordering with no client sort control." }
  - { id: AC7, mandatory: true,  text: "status, sort and cursor carry an explicit deprecation note recording that they are unimplemented and return HTTP 400. They are NOT deleted silently, because external consumer usage cannot be ruled out." }
  - { id: AC8, mandatory: true,  text: "The checked-in openapi.yaml parses cleanly after editing." }
  - { id: AC9, mandatory: true,  text: "Runtime behaviour is unchanged — proven by zero non-doc files in the diff and by existing specs passing UNMODIFIED." }
  - { id: AC10, mandatory: true, text: "A contract check compares the documented active parameter set against the DTO's accepted set and shows them equal." }
  - { id: AC11, mandatory: false, text: "The Meta divergence is corrected and the report notes it was carried under F-6 without a separate finding identifier." }

required_evidence:
  - "the accepted-parameter set as re-derived from the DTO"
  - "before/after openapi listPlaces and Meta"
  - "the deprecation-note text applied to status, sort, cursor"
  - "the contract-check output"
  - "confirmation that no runtime file appears in the change set"
  - "all validation exit codes"

