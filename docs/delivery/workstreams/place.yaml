schema_version: "1.0"

id: place
name: Place Domain
status: active
execution_state: implementation_in_progress   # PLACE-001 analysis + PLACE-002 (GAP-07) completed 2026-07-22
closure_classification: INCOMPLETE            # GAP-06 open; no DB-backed validation; GAP-05/10 parked
architecture_note: >-
  Place is the canonical aggregate (ADR-001). Hotel/Restaurant/Tour are satellite
  extensions keyed by place_id (ADR-002), classified by category. Business ownership is a
  claim/membership overlay (business_claims/business_members), not a business_id column.

business_purpose: >-
  Place is the core entity of PhuQuocHub (ADR-001): stable location data plus
  fast-read caches. It anchors discovery (list/detail/map/search), geo queries,
  media, contacts, prices, reviews, contributions and the business-type
  extensions (hotels/restaurants/tours).

repository_paths:
  api_module: apps/api/src/modules/places
  entity: apps/api/src/modules/places/entities/place.entity.ts
  satellites:
    - apps/api/src/modules/places/entities/place-faq.entity.ts
    - apps/api/src/modules/places/entities/place-seo.entity.ts
    - apps/api/src/modules/places/entities/place-ai-summary.entity.ts
  enums: apps/api/src/modules/places/place.enums.ts
  dto: apps/api/src/modules/places/dto/places.dto.ts
  repository: apps/api/src/modules/places/repositories/places.repository.ts
  service: apps/api/src/modules/places/places.service.ts
  controller: apps/api/src/modules/places/places.controller.ts
  mapper: apps/api/src/modules/places/places.mapper.ts
  migration: apps/api/src/core/database/migrations/1720000400000-InitPlaces.ts
  web_ui: "apps/web/src/app/(public)/places/ + apps/web/src/modules/places/"

known_entities:
  - "places (geography(Point,4326), soft-delete, status + verification_status)"
  - place_faqs
  - place_seo
  - place_ai_summary
  - "media / contacts / price_history (polymorphic, owner_type='place')"

known_apis:
  - "GET /api/places (public list; offset page/limit; published-only)"
  - "GET /api/places/:id/revisions (public)"
  - "GET /api/places/:slug (public detail; published-only, 404 otherwise)"
  - "POST /api/places (Place.Create → status pending)"
  - "PATCH /api/places/:id (Place.Edit.Managed)"
  - "DELETE /api/places/:id (Place.Archive → soft delete)"
  - "POST /api/places/:id/approve (Place.Approve → published)"
  - "GET /api/geo/nearby, /api/geo/bbox (geo module → places repo)"
  - "GET /api/search (search module → places FTS)"

known_consumers:
  - apps/api/src/modules/geo        # nearby, bbox clusters
  - apps/api/src/modules/search     # full-text search
  - apps/api/src/modules/revisions  # place revision history
  - "apps/web (places list/detail/map/search pages)"

persistence_dependencies:
  database: "PostgreSQL + PostGIS (geography(Point,4326))"
  orm: "TypeORM (synchronize:false)"
  extensions_required: [postgis, unaccent, pg_trgm, pgcrypto]
  functions_required: [immutable_unaccent]

migration_dependencies:
  - 1720000000000-InitExtensions
  - 1720000200000-InitCategories
  - 1720000100000-InitRbacAndUsers
  - 1720000400000-InitPlaces
  - 1720000700000-InitWikiRevisions
  - 1720000900000-SeedInitialPlaces
  - 1720001600000-SeedPlacesExpansion
  - 1720001900000-AddPlacesStatusPartialIndex   # PLACE-003; authored, NOT applied to any DB

shared_type_dependencies:
  - "@phuquochub/shared-types (ApiSuccess/ApiPaginated/PaginationMeta + src/place.ts: GeoPoint, PlaceCard, PlaceDetail, satellites, value unions — added by PLACE-005)"
  - "@phuquochub/utils (slugify) — unlinked on FAT32"

frontend_dependencies:
  - "apps/web/src/modules/places/types.ts (duplicated PlaceCard/PlaceDetail — drift risk)"
  - "apps/web/src/modules/places/api/places.api.ts (listPlaces/getPlace)"

