place_030_status: >-
  COMPLETED 2026-07-24 — PLACE-029 Candidate Selection report, Candidate D, logging sub-scope only
  (the monitoring-provider sub-scope, OD2-6, remains a separate Owner decision, not started here).
  Preflight confirmed AppLoggerService was fully built but never wired (TD-03) and no correlation-ID
  mechanism existed anywhere; ApiMeta.requestId already existed in the wire contract, unpopulated.
  Implemented: correlation-id.middleware.ts (X-Request-Id, crypto.randomUUID -- no new dependency,
  per-request state on the Express Request object, not module-level global); app.useLogger(await
  app.resolve(AppLoggerService)) with bufferLogs:true, completing TD-03; LoggingInterceptor and
  AllExceptionsFilter given an OPTIONAL LoggerService constructor parameter (default
  new AppLoggerService()) specifically so the 9 pre-existing e2e spec files constructing them with
  zero arguments needed no changes; structured request/exception logs carrying the correlation ID;
  meta.requestId populated in every response; REDACTED_KEYS expanded for this repo's actual
  snake_case wire format (access_token/refresh_token/password_hash -- the prior camelCase-only list
  would never have matched real payloads) plus cookie/DB/Redis-credential keys, case-insensitive
  matching. TWO REAL RUNTIME BUGS found and fixed via live Docker verification, neither catchable by
  the unit/e2e suite (neither exercises main.ts's actual bootstrap()): app.get() on the
  Scope.TRANSIENT AppLoggerService throws (fixed: app.resolve()); AppLoggerService's own
  `delegate = new Logger()` caused infinite recursion once it became the global override target
  (fixed: ConsoleLogger delegate, identical visual output). Both fixes re-verified through the FULL
  affected chain (typecheck->unit->e2e->build->Docker rebuild->reboot) from scratch. Full regression:
  unit 251/251 (231+20 new, 34 suites), e2e 59/59 (51+8 new, 10 suites) -- all 9 pre-existing e2e
  files unmodified and passing. Docker-verified live: correlation ID identical across response
  header/body/logs for both generated and client-supplied IDs; a real register->login(200)->wrong-
  password(401) flow proved auth/bcrypt unaffected, produced zero ERROR-level logs for the 401
  (quiet-business-error behavior preserved), and a full log-history grep for the real password and
  both issued JWT tokens found zero matches; PLACE-029's DB-credential fail-fast (missing/empty
  DB_PASSWORD) re-verified unaffected; web image rebuilt per convention, GET / -> 200 (zero apps/web
  file touched). Dev stack confirmed healthy and unaffected (migrations=20, places=49 unchanged); all
  test data cleaned up. Not claimed: no live Docker proof of the unexpected-500 path (proven instead
  at the e2e level via a controller existing only in the test file's own module, never in production
  app.module.ts); no CORS header exposure change (deliberate); no NestJS/Next migration; no paid
  observability vendor integration. See reports/PLACE-030-observability-foundation-report.md,
  evidence/PLACE-030-observability-foundation-evidence-index.md, and
  reports/PLACE-030-OBSERVABILITY-ASSESSMENT-2026-07-24.md.

