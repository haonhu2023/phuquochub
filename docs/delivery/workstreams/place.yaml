    - apps/api/src/modules/places/dto/places.dto.spec.ts
    - apps/api/src/core/database/migrations/__tests__/1720001900000-AddPlacesStatusPartialIndex.spec.ts
    - apps/api/src/modules/places/places.service.spec.ts       # PLACE-008, 18 specs
    - apps/api/src/modules/places/places.controller.spec.ts    # PLACE-009, 23 specs
