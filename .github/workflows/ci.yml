name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# GHCR publishing (docker-build job, below) is gated on this flag, tracked here in Git rather than
# in a repository variable or environment secret. The point of tracking it in the workflow file
# itself: turning publishing on is then a reviewable Git diff -- visible in `git log`, subject to
# the same PR/CODEOWNERS review as any other workflow change -- instead of a silent toggle in
# GitHub Settings that leaves no diff and no reviewer. Flip to 'true' only in its own commit, once
# release policy, GHCR package permissions, and an image rollback plan are approved.
env:
  GHCR_PUBLISH_ENABLED: 'false'

jobs:
  build-test:
    name: Lint · Typecheck · Build · Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  dependency-audit:
    name: Dependency security audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: API e2e (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: phuquoc
          POSTGRES_PASSWORD: phuquoc
          POSTGRES_DB: phuquochub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phuquoc -d phuquochub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: phuquoc
      DB_PASSWORD: phuquoc
      DB_NAME: phuquochub
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-please-change
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change
      # Throwaway CI-only MinIO credentials — deliberately NOT a GitHub secret and never a
      # production value, exactly like the JWT placeholders above. StorageService.onModuleInit()
      # runs on every e2e boot (it only self-skips when NODE_ENV=production, which this job must
      # not do), so the API needs a reachable S3 endpoint or every suite fails in HeadBucket.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio-root
      S3_SECRET_KEY: ci-minio-secret
      S3_REGION: us-east-1
      S3_BUCKET: phuquochub-ci
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4

      # MinIO cannot be a `services:` container: it requires the `server /data` command, and service
      # containers accept only an image plus options — there is no command/args key. Start it as a
      # Docker step instead, mirroring how `docker-build` below boots images with `--network host`.
      # Launched before `npm ci` so it warms up while dependencies install; readiness is asserted in
      # its own step before e2e, never assumed.
      #
      # `minio/minio` on Docker Hub returns HTTP 404 ("object not found") from Docker Hub's own
      # repository API as of 2026-09-12 — not a rate limit, the repository itself is gone from that
      # registry. Pinned to the official `minio/minio` org on quay.io instead (MinIO Inc.'s other
      # active distribution channel; confirmed via quay.io's public API: state NORMAL, maintainer
      # label "MinIO Inc <dev@min.io>"), by immutable RELEASE tag AND digest so this can never
      # silently drift to a different build even if the tag were ever re-pushed.
      - name: Start MinIO (S3-compatible storage for StorageService)
        run: |
          docker run -d --name minio-ci --network host \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd \
            server /data --console-address :9001

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared packages
        run: npm run build --workspace @phuquochub/shared-types --workspace @phuquochub/utils

      - name: Run migrations
        run: npm run migration:run --workspace @phuquochub/api

      # Three explicit gates before e2e, so a storage problem fails here with a clear message
      # instead of surfacing as 448 unrelated AggregateErrors: the container is running, the
      # unauthenticated liveness probe answers, and an AUTHENTICATED S3 call succeeds — the last
      # one is what actually proves the credentials and endpoint StorageService will use.
      - name: Wait for MinIO and verify StorageService can initialise its bucket
        run: |
          docker ps --filter name=minio-ci --filter status=running --format '{{.Names}}' | grep -qx minio-ci

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/minio/health/live || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:9000/minio/health/live

          node - <<'JS'
          // Mirrors StorageService.onModuleInit() using the SAME @aws-sdk/client-s3 client and the
          // SAME env vars, so this proves the endpoint AND the credentials the app will use --
          // something the unauthenticated liveness probe above cannot show. Deliberately not `mc`:
          // that would depend on tooling inside the image rather than on what the app actually uses.
          const { S3Client, HeadBucketCommand, CreateBucketCommand } = require('@aws-sdk/client-s3');
          const bucket = process.env.S3_BUCKET;
          const client = new S3Client({
            endpoint: process.env.S3_ENDPOINT,
            region: process.env.S3_REGION,
            credentials: {
              accessKeyId: process.env.S3_ACCESS_KEY,
              secretAccessKey: process.env.S3_SECRET_KEY,
            },
            forcePathStyle: true,
          });
          (async () => {
            try {
              await client.send(new HeadBucketCommand({ Bucket: bucket }));
              console.log(`bucket "${bucket}" already present`);
            } catch {
              await client.send(new CreateBucketCommand({ Bucket: bucket }));
              console.log(`bucket "${bucket}" created`);
            }
            await client.send(new HeadBucketCommand({ Bucket: bucket }));
            console.log('MinIO reachable and bucket initialisation verified');
          })().catch((err) => {
            // AggregateError.message is empty -- that is precisely why the original e2e failure was
            // hard to read. Unwrap the sub-errors so this step says WHY it could not reach MinIO.
            const detail =
              err instanceof AggregateError
                ? err.errors.map((e) => `${e.name}: ${e.message}`).join('; ')
                : err.message;
            console.error(`MinIO/S3 preflight failed (${err.name}): ${detail || '(no message)'}`);
            process.exit(1);
          });
          JS

      - name: API e2e
        run: npm run test:e2e --workspace @phuquochub/api

      - name: MinIO logs (diagnostics)
        if: failure()
        run: docker logs minio-ci || true

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio-ci || true

  # PLACE-026 (OD2-2..9) — production deployment pipeline. Builds the same Dockerfiles used for a
  # real deploy and validates them against real Postgres/Redis service containers (same pattern as
  # the `e2e` job above), proving the images are viable production artifacts.
  docker-build:
    name: Docker build & validate (deployment pipeline)
    runs-on: ubuntu-latest
    needs: dependency-audit
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: phuquoc
          POSTGRES_PASSWORD: phuquoc
          POSTGRES_DB: phuquochub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phuquoc -d phuquochub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (only to run migrations against the DB the built image will connect to)
        run: npm ci

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: phuquoc
          DB_PASSWORD: phuquoc
          DB_NAME: phuquochub
        run: npm run migration:run --workspace @phuquochub/api

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t phuquochub-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t phuquochub-web:ci .

      - name: Boot API image and verify /api/health (PLACE-026 AC2)
        run: |
          docker run -d --name api-ci --network host \
            -e NODE_ENV=production -e API_PORT=4000 -e API_GLOBAL_PREFIX=api \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_USER=phuquoc -e DB_PASSWORD=phuquoc -e DB_NAME=phuquochub \
            -e DB_SSL=false -e DB_SYNCHRONIZE=false -e DB_LOGGING=false \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 -e REDIS_URL=redis://localhost:6379 \
            -e JWT_ACCESS_SECRET=ci-access-secret-please-change -e JWT_REFRESH_SECRET=ci-refresh-secret-please-change \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            phuquochub-api:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf http://localhost:4000/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"database":{"status":"up"}' /tmp/health.json
          grep -q '"redis":{"status":"up"' /tmp/health.json
          docker logs api-ci
          # api-ci is intentionally left running (not removed here): the web-image step below needs
          # it live on localhost:4000 to prove the real SSR web->API data path (AC3). Both containers
          # are torn down together in the "Stop CI containers" step at the end of this job.

      - name: Boot web image and verify locale routing + real SSR data path (PLACE-026 AC3)
        run: |
          # API_INTERNAL_URL: this job uses --network host, so the API is reachable at
          # 127.0.0.1:4000 here -- NOT the Docker service hostname `api`, which only resolves on a
          # user-defined bridge network (e.g. docker-compose.prod.yml's default network, a different
          # topology than this host-network CI job). Omitting this var entirely is exactly the
          # production regression this workflow gap let through undetected: apps/web/src/lib/api.ts
          # throws server-side in NODE_ENV=production when it's unset, rather than silently falling
          # back to a wrong address.
          docker run -d --name web-ci --network host \
            -e NODE_ENV=production -e API_INTERNAL_URL=http://127.0.0.1:4000/api \
            phuquochub-web:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            [ "$code" != "000" ] && break
            sleep 1
          done

          # 1. Root MUST be an EXACT 307 -- apps/web/src/proxy.ts redirects / -> /vi on purpose, it
          #    is no longer a 200 page. No `-L` here so the redirect itself is inspected, not
          #    silently followed (a regression back to a bare 200, or a wrong Location, must fail).
          ROOT_HEADERS=$(mktemp)
          CODE=$(curl -s -o /dev/null -D "$ROOT_HEADERS" -w '%{http_code}' http://localhost:3000/)
          echo "root status: $CODE"
          if [ "$CODE" != "307" ]; then
            echo "FAIL: / returned $CODE, expected 307"; docker logs web-ci; exit 1
          fi

          # 2. Location MUST resolve to /vi (absolute http://localhost:3000/vi, matching what
          #    NextResponse.redirect(req.nextUrl.clone()) actually emits, or a bare /vi).
          LOCATION=$(grep -i '^location:' "$ROOT_HEADERS" | tail -n 1 | sed 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r\n')
          echo "root Location: $LOCATION"
          case "$LOCATION" in
            http://localhost:3000/vi|/vi) : ;;
            *) echo "FAIL: Location='$LOCATION', expected http://localhost:3000/vi or /vi"; exit 1 ;;
          esac

          # 3. /vi itself MUST be 200.
          VI_BODY=$(mktemp)
          CODE=$(curl -s -o "$VI_BODY" -w '%{http_code}' http://localhost:3000/vi)
          echo "/vi status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "FAIL: /vi returned $CODE, expected 200"; docker logs web-ci; exit 1
          fi

          # 4. Real SSR web->API data path -- this is AC3's actual point, and a bare 200 status
          #    cannot prove it: /vi must NOT show DiscoverPlaces' fetch-failure copy, and must
          #    contain at least one real, localized place-card link. This is exactly what silently
          #    broke in the incident this workflow gap let through (API_INTERNAL_URL missing).
          if grep -qF 'Hiện chưa tải được danh sách địa điểm.' "$VI_BODY"; then
            echo "FAIL: /vi rendered the DiscoverPlaces error state -- SSR could not reach the API"
            docker logs web-ci
            exit 1
          fi
          if ! grep -qE 'href="/vi/places/' "$VI_BODY"; then
            echo "FAIL: /vi did not render any /vi/places/ place-card link -- no evidence of real data"
            docker logs web-ci
            exit 1
          fi
          echo "OK: /vi rendered real place data via SSR"
          docker logs web-ci

      - name: Stop CI containers
        if: always()
        run: docker rm -f api-ci web-ci 2>/dev/null || true

      # PLACE-026 (OD2-7): GHCR via the auto-provided GITHUB_TOKEN — no new secret required.
      # The remote for this repository exists and is in active use. That is exactly why these two
      # steps are gated behind GHCR_PUBLISH_ENABLED (declared at workflow level, above): GHCR
      # publishing itself has not been owner-approved, and creating a `main` branch would otherwise
      # be enough on its own to arm a `push`-triggered image publish nobody reviewed. The flag
      # defaults to 'false' so that moment never happens silently. Flip it to 'true' only in a
      # reviewed commit, once release policy, GHCR package permissions, and an image rollback plan
      # are approved -- until then, treat the login/push steps below as unverified.
      - name: Log in to GHCR
        if: ${{ env.GHCR_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: ${{ env.GHCR_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
        run: |
          IMAGE_API=ghcr.io/${{ github.repository }}/api
          IMAGE_WEB=ghcr.io/${{ github.repository }}/web
          docker tag phuquochub-api:ci "$IMAGE_API:${{ github.sha }}"
          docker tag phuquochub-web:ci "$IMAGE_WEB:${{ github.sha }}"
          docker push "$IMAGE_API:${{ github.sha }}"
          docker push "$IMAGE_WEB:${{ github.sha }}"
