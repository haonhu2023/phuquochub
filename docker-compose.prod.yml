# ============================================================================
# PhuQuocHub — production-shaped compose stack (PLACE-026 / OD2-2..9; topology finalized PLACE-038)
# Dùng để build + chạy thử toàn bộ stack (caddy + web + api + postgres + redis + minio) ở dạng
# gần giống production, HOÀN TOÀN LOCAL.
#
# KHÔNG thay thế cho một VPS/Hostinger/Cloudflare/R2 THẬT — không có target đó trong repo hay
# session này (không có remote git, không có credential cloud nào). PLACE-038 chỉ chuẩn bị hạ
# tầng do repo kiểm soát; KHÔNG triển khai lên Internet (xem docs/delivery/tasks/PLACE-038.yaml).
#
# Topology (PLACE-037 Topology A, Owner-approved PLACE-038): chỉ `caddy` publish cổng ra host/
# Internet (80/443). postgres/redis/minio/api/web CHỈ nằm trên mạng Docker nội bộ — khớp nguyên
# tắc "DB/Redis/MinIO không lộ ra Internet" (deployment.md §2/§13). Domain đã chốt: phuquochub.com,
# API qua path /api cùng domain (không dùng subdomain riêng).
#
# Dùng: docker compose -f docker-compose.prod.yml up -d --build
# Kiểm chứng cục bộ (không cần domain/TLS thật): xem docs/delivery/RELEASE-ROLLBACK-RUNBOOK.md
# và docs/delivery/evidence/PLACE-038-production-readiness-implementation-evidence-index.md.
# ============================================================================
# PLACE-038: tên project cố định (thay vì suy ra từ tên thư mục, vốn không xác định trước và
# không nhất quán chữ hoa/thường) -- để scripts/*.sh tham chiếu mạng Docker nội bộ
# (phuquochub-prod_default) một cách chắc chắn.
name: phuquochub-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: phuquoc-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: phuquoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      POSTGRES_DB: phuquochub
      # OD2-4/OD2-5: đích lưu WAL cục bộ luôn bật (PITR tại chỗ); đồng bộ thêm sang Cloudflare R2
      # (Owner-approved offsite destination, PLACE-038) nếu đủ 4 biến R2_* — xem wal-archive.sh.
      WAL_ARCHIVE_DIR: /var/lib/postgresql/wal_archive
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    # PLACE-038: KHÔNG publish 5432 ra host — chỉ mạng Docker nội bộ (Topology A). Truy cập cục bộ
    # để kiểm chứng qua `docker exec phuquoc-postgres-prod psql ...`, không qua host port.
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - wal_archive_prod:/var/lib/postgresql/wal_archive
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/postgres/wal-archive.sh:/opt/wal-archive.sh:ro
    # OD2-4: bật WAL archiving qua cờ `-c` (cách được tài liệu Docker Hub khuyến nghị) thay vì
    # thay hẳn postgresql.conf mặc định — an toàn hơn, không có nguy cơ thiếu setting mặc định.
    # PLACE-038: chuyển sang dạng LIST YAML thay vì chuỗi gộp (`>`) -- một lỗi thật, có sẵn từ
    # trước (PLACE-026), được phát hiện khi thực sự khởi động toàn bộ stack lần đầu qua chính
    # file compose này: dạng chuỗi khiến Compose tách theo khoảng trắng, biến giá trị nhiều từ
    # của `archive_command=sh /opt/wal-archive.sh %p %f` thành nhiều argv riêng biệt sai --
    # postgres crash ngay khi khởi động với "invalid argument: /opt/wal-archive.sh". Dạng list,
    # mỗi phần tử là một argv riêng, không qua tách shell nào cả -- không còn mơ hồ.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - "archive_command=sh /opt/wal-archive.sh %p %f"
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phuquoc -d phuquochub"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: phuquoc-redis-prod
    restart: unless-stopped
    # PLACE-038: mật khẩu Redis bắt buộc (deployment.md §6.5 khuyến nghị nhưng chưa triển khai
    # trước đây) — closes the gap PLACE-037 flagged. KHÔNG publish 6379 ra host.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me-redis-password-min-16-chars}"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password-min-16-chars}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # OD2-3: MinIO đứng thay cho Cloudflare R2 THẬT.
  #
  # CẬP NHẬT (Secure Private Media, 87d010e) — chú thích cũ ("hiện tại CHƯA cần, application code
  # không gọi tới object storage nào, không phải phần khởi chạy bắt buộc") đã LỖI THỜI và bị thay ở
  # đây: service này nay là BẮT BUỘC. `api` ký presigned URL trỏ tới nó, và `caddy` proxy
  # `media.phuquochub.com` vào nó (xem infrastructure/caddy/Caddyfile). Thiếu nó = mọi ảnh hỏng.
  #
  # KHÔNG publish cổng ra host — đúng nguyên tắc Topology A. Cả hai listener đều chỉ nằm trên mạng
  # Docker nội bộ:
  #   :9000 (S3 API)  — CHỈ `api` (nội bộ) và `caddy` (proxy có lọc `/minio/*`) gọi tới.
  #   :9001 (Console) — KHÔNG có site block Caddy nào trỏ tới; không bao giờ ra Internet.
  # Bucket `phuquochub-prod` là PRIVATE (`mc anonymous set none`) — quyền đọc đến từ chữ ký SigV4
  # ngắn hạn do API cấp, không đến từ bucket policy. Đừng bao giờ đặt lại anonymous download.
  minio:
    image: minio/minio:latest
    container_name: phuquoc-minio-prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data_prod:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # PLACE-038: migration runner -- reuses the SAME multi-stage Dockerfile's intermediate `build`
  # stage (which already has the full TypeScript source + ts-node/typeorm-ts-node-commonjs),
  # rather than the lean `runtime` stage the `api` service uses (which ships compiled dist/ only
  # and intentionally excludes migration tooling). NOT started by `docker compose up` (no
  # `restart:`, not a dependency of anything) -- invoked on demand: `docker compose -f
  # docker-compose.prod.yml run --rm migrate`. Reached postgres/redis by service name on the
  # same internal network as every other service here, exactly like a real VPS deploy would --
  # this is also why migrations cannot simply run via bare `npm run migration:run` on the host
  # once postgres's port is no longer published (Topology A's own private-networking design).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /repo/apps/api
    entrypoint: []
    command: ["npx", "typeorm-ts-node-commonjs", "migration:run", "-d", "src/core/database/data-source.ts"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: phuquoc
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      DB_NAME: phuquochub
      DB_SSL: "false"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # PLACE-038: tag parameterized (defaults to :local for `docker compose up --build`) so
    # scripts/deploy.sh can point an already-built, commit-SHA-tagged image at this service
    # without rebuilding, and scripts/rollback.sh can point it back at a PREVIOUS tag.
    image: phuquochub-api:${API_IMAGE_TAG:-local}
    container_name: phuquoc-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      API_GLOBAL_PREFIX: api
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: phuquoc
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      DB_NAME: phuquochub
      DB_SSL: "false"
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # PLACE-038: mật khẩu nhúng trong URL (ioredis hỗ trợ redis://:PASSWORD@host:port) — khớp
      # REDIS_PASSWORD của service `redis` phía trên.
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis-password-min-16-chars}@redis:6379
      # Đổi hai secret này khi chạy thật — đây là placeholder cho môi trường local/staging.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-16-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-16-chars}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
      RATE_LIMIT_AUTH_TTL: ${RATE_LIMIT_AUTH_TTL:-60}
      RATE_LIMIT_AUTH_LIMIT: ${RATE_LIMIT_AUTH_LIMIT:-10}
      # PLACE-038: domain sản xuất đã được Owner chốt (phuquochub.com); API phục vụ qua path
      # /api cùng domain (không có subdomain api. riêng) — xem infrastructure/caddy/Caddyfile.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://phuquochub.com}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-false}
      # PLACE-038: Caddy giờ đứng trước API trong topology này -> tin 1 hop proxy để lấy đúng
      # client IP thật cho rate limiting qua X-Forwarded-For (trước đây là 0, chưa có proxy nào).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Media Upload Foundation (2026-08-10 fix): trước đây KHÔNG có biến S3_* nào ở đây — commit
      # thêm S3_PUBLIC_URL (configuration.ts/env.validation.ts) không đụng tới file này, nên đặt
      # S3_PUBLIC_URL vào `.env` cạnh docker-compose KHÔNG có tác dụng gì với container `api` (biến
      # trong `.env` chỉ dùng để nội suy ${VAR} NGAY TRONG file YAML này, không tự động bơm vào
      # container trừ khi được liệt kê tường minh ở `environment:` như dưới đây). Thiếu hẳn khối này
      # nghĩa là app rơi về default trong code (`S3_ENDPOINT` -> `http://localhost:9000`, TRỎ VÀO
      # CHÍNH container `api`, không phải service `minio` — MinIO thật chỉ vào được qua tên service
      # nội bộ `minio:9000`, xem service `minio` bên dưới) — presign/upload thật sẽ hỏng nếu chưa vá.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Secure Private Media (87d010e) bổ sung: default `http://minio:9000` ở trên chỉ đúng nếu
      # KHÔNG có site block `media.phuquochub.com` nào phục vụ media ra ngoài (tức là chưa/không
      # dùng kiến trúc signed-URL). Với topology hiện tại (Caddyfile CÓ site block đó), production
      # PHẢI set `S3_ENDPOINT=https://media.phuquochub.com` trong `.env` trên server — lý do đầy đủ
      # (SigV4 ký cả Host header) nằm ở .env.example, không lặp lại ở đây.
      # MinIO IAM hardening (2026-08-10): production PHẢI đặt S3_ACCESS_KEY/S3_SECRET_KEY trong
      # `.env` trên server thành credential của USER ỨNG DỤNG chuyên dụng (least-privilege — chỉ
      # GetObject/PutObject/DeleteObject, KHÔNG ListBucket, xem docs/data/modules/media.md §13.8),
      # KHÔNG BAO GIỜ là MINIO_ROOT_USER/MINIO_ROOT_PASSWORD của service `minio` bên dưới — root chỉ
      # dùng cho thao tác quản trị thủ công (tạo user, đổi policy), không bao giờ nạp vào container
      # `api`. Giá trị literal dưới đây (khớp default root của service `minio`) CHỈ nhằm mục đích
      # `docker compose up` cục bộ chạy được ngay không cần `.env` — KHÔNG áp dụng cho production.
      # Cố tình KHÔNG lồng biến (${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}) — cú pháp nội suy lồng nhau
      # không có tiền lệ nào khác trong file này và không đáng tin cậy trên mọi phiên bản Compose.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-password}
      # KHÔNG đặt fallback ở đây (khác các biến khác phía trên) — code-level default khi để trống
      # là `phuquochub-dev` bất kể NODE_ENV (xem configuration.ts's defaultS3Bucket(), chỉ đặc cách
      # 'test', KHÔNG đặc cách 'production') — production PHẢI set S3_BUCKET tường minh trong `.env`
      # trên server, nếu không media thật sẽ lặng lẽ ghi vào bucket "phuquochub-dev".
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # KHÔNG CÒN ẢNH HƯỞNG tới URL media (Secure Private Media, 2026-08-10) — giữ lại để deployment
      # đã đặt sẵn không phá validation. Xem API_PUBLIC_URL bên dưới cho origin thật sự được dùng.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      # Tuổi thọ presigned GET URL phát media (giây). 30..3600, mặc định 300.
      S3_PRESIGN_GET_TTL: ${S3_PRESIGN_GET_TTL:-300}
      # Secure Private Media (2026-08-10): origin mà TRÌNH DUYỆT gọi được tới API này — dùng để dựng
      # URL media tuyệt đối (`{API_PUBLIC_URL}/api/media/{id}/file`) nhúng vào response review/gallery.
      # PHẢI là domain công khai đi qua Caddy (https://phuquochub.com), KHÔNG phải `api:4000` (tên
      # service nội bộ Docker — trình duyệt không phân giải được) và KHÔNG phải media.phuquochub.com.
      # Default localhost dưới đây CHỈ đúng cho dev; production PHẢI đặt tường minh trong `.env`.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    # PLACE-038: KHÔNG publish 4000 ra host — chỉ Caddy (service `caddy` bên dưới) gọi tới qua
    # mạng Docker nội bộ bằng tên service `api:4000`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # PLACE-038: sửa lỗi thật — NEXT_PUBLIC_* được Next.js nhúng cứng lúc BUILD, không đọc lúc
      # container chạy. Trước đây các biến này chỉ được đặt ở `environment:` (runtime), hoàn
      # toàn không có tác dụng — đã kiểm chứng: bundle build cũ có sẵn "localhost:4000/api" cứng
      # dù `environment:` có override. Domain sản xuất đã chốt: phuquochub.com.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://phuquochub.com/api}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        # MVP SEO pass: metadataBase/sitemap.ts/robots.ts need the real web origin at build time,
        # same NEXT_PUBLIC_ build-time-baked reasoning as the two vars above (PLACE-038).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://phuquochub.com}
    # PLACE-038: tag parameterized, same reasoning as the api service above.
    image: phuquochub-web:${WEB_IMAGE_TAG:-local}
    container_name: phuquoc-web-prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    # PLACE-038: KHÔNG publish 3000 ra host — chỉ Caddy gọi tới qua mạng Docker nội bộ bằng tên
    # service `web:3000`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # PLACE-038: reverse proxy công khai DUY NHẤT của stack (Topology A) — TLS tự động (Caddy),
  # định tuyến / -> web, /api -> api, chuyển tiếp X-Request-Id + client IP thật. Domain thật
  # (phuquochub.com) cần trỏ DNS về VPS thật để Caddy tự lấy chứng chỉ TLS qua ACME — CHƯA có
  # DNS/VPS thật trong session này, xem infrastructure/caddy/Caddyfile để biết cách kiểm chứng
  # định tuyến cục bộ (Host header, không cần DNS/TLS thật).
  caddy:
    image: caddy:2-alpine
    container_name: phuquoc-caddy-prod
    restart: unless-stopped
    depends_on:
      - web
      - api
      # Secure Private Media (87d010e): Caddyfile nay có site block `media.phuquochub.com` ->
      # `minio:9000`. Thiếu dòng này, một lần `docker compose up` sạch có thể khởi động Caddy TRƯỚC
      # khi tên `minio` phân giải được trên mạng Docker — Caddy vẫn chạy nhưng trả 502 cho ảnh cho
      # tới lần retry kế tiếp. Khai báo tường minh để thứ tự khởi động tái lập được.
      - minio
    ports:
      - "80:80"
      - "443:443"
      # Deploy reconciliation (fd224c1 rollout, 2026-08-10): scripts/deploy.sh Step 11 / rollback.sh
      # both call scripts/smoke-test.sh against http://127.0.0.1:8080 by default (the Caddyfile's
      # own documented local test address, "phuquochub.com, :8080 { ... }" -- same routing logic,
      # no DNS/TLS needed). Without a host-port mapping for it, nothing on the host can ever reach
      # that container-internal port, and Step 11 fails with a connection error before any real
      # health signal is read -- confirmed reproducing the exact failure hit on the real VPS.
      # 127.0.0.1-only (never "8080:8080"): this port serves plain HTTP with no TLS and no
      # Cloudflare/WAF in front of it -- it must stay unreachable from the public Internet, loopback
      # access only, exactly like Caddy's own :8080 site block already documents as verification-only.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pg_data_prod:
  wal_archive_prod:
  redis_data_prod:
  minio_data_prod:
  caddy_data_prod:
  caddy_config_prod:
