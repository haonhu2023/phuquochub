# ============================================================================
# PhuQuocHub — production-shaped compose stack (PLACE-026 / OD2-2..9)
# Dùng để build + chạy thử api/web + hạ tầng ở dạng gần giống production, HOÀN TOÀN LOCAL.
#
# KHÔNG thay thế cho một VPS/Cloudflare/R2 thật — không có target đó trong repo hay session
# này (không có remote git, không có credential cloud nào). Dùng để:
#   - build hai image production thật (không phải `next dev`/`nest start --watch`)
#   - kiểm chứng chúng khởi động + kết nối Postgres/Redis đúng
#   - kiểm chứng cấu hình WAL archiving khởi động thành công (OD2-4)
#   - có sẵn chỗ đổi sang MinIO→R2 thật (OD2-3) và registry image thật (OD2-7) khi có credential
#
# Dùng: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: phuquoc-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: phuquoc
      POSTGRES_PASSWORD: phuquoc
      POSTGRES_DB: phuquochub
      # OD2-4: đích lưu WAL cục bộ mặc định — đổi sang đích thật (R2/Backblaze, OD2-5) bằng
      # cách thay nội dung wal-archive.sh, KHÔNG cần đổi biến này hay postgresql config.
      WAL_ARCHIVE_DIR: /var/lib/postgresql/wal_archive
    ports:
      - "5432:5432"
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - wal_archive_prod:/var/lib/postgresql/wal_archive
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/postgres/wal-archive.sh:/opt/wal-archive.sh:ro
    # OD2-4: bật WAL archiving qua cờ `-c` (cách được tài liệu Docker Hub khuyến nghị) thay vì
    # thay hẳn postgresql.conf mặc định — an toàn hơn, không có nguy cơ thiếu setting mặc định.
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command=sh /opt/wal-archive.sh %p %f
      -c archive_timeout=300
      -c max_wal_senders=3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phuquoc -d phuquochub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: phuquoc-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OD2-3: MinIO đứng thay cho Cloudflare R2 THẬT (chưa có credential) — API tương thích S3 nên
  # đổi sang R2 chỉ là đổi endpoint/credential, không đổi code.
  minio:
    image: minio/minio:latest
    container_name: phuquoc-minio-prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data_prod:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: phuquochub-api:local
    container_name: phuquoc-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      API_GLOBAL_PREFIX: api
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: phuquoc
      DB_PASSWORD: phuquoc
      DB_NAME: phuquochub
      DB_SSL: "false"
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      # Đổi hai secret này khi chạy thật — đây là placeholder cho môi trường local/staging.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-16-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-16-chars}
      # PLACE-028 (OD2-12/OD2-13): NODE_ENV=production ở đây bắt buộc CORS_ALLOWED_ORIGINS phải
      # có giá trị (fail-fast nếu thiếu) — mặc định khớp cổng của service `web` bên dưới (3000).
      # Đổi thành domain thật khi có (chưa có domain production nào được xác nhận trong repo này).
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
      RATE_LIMIT_AUTH_TTL: ${RATE_LIMIT_AUTH_TTL:-60}
      RATE_LIMIT_AUTH_LIMIT: ${RATE_LIMIT_AUTH_LIMIT:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: phuquochub-web:local
    container_name: phuquoc-web-prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # OD2-8: đổi sang MapTiler thật bằng cách set biến này khi có API key; mặc định giữ
      # NGUYÊN URL OpenStreetMap hiện tại (không đổi hành vi nếu không cấu hình gì thêm).
      NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  pg_data_prod:
  wal_archive_prod:
  redis_data_prod:
  minio_data_prod:
