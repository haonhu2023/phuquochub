# PLACE-026 (OD2-4) — WAL/PITR archiving configuration for the production-shaped compose stack.
#
# `archive_command` targets a LOCAL path by default (WAL_ARCHIVE_DIR, mounted as a named volume in
# docker-compose.prod.yml) because no real offsite backup credentials exist in this repository or
# session (OD2-5 recommends the same provider family as OD2-3's media-storage choice, R2 — neither
# is provisioned here). To point this at a real offsite target once credentials are supplied,
# replace the `cp` command below with an upload command (e.g. `aws s3 cp` / `rclone copy`) — no
# other configuration in this file needs to change.
#
# $WAL_ARCHIVE_DIR is read from the postgres container's own environment (archive_command runs as a
# shell subprocess of the server, which inherits it) — see docker-compose.prod.yml's postgres
# service `environment:` block.

wal_level = replica
archive_mode = on
archive_command = 'sh /opt/wal-archive.sh %p %f'
archive_timeout = 300
max_wal_senders = 3

# NOTE: docker-compose.prod.yml applies these same four settings via `-c` command-line flags
# (the officially documented pattern for the postgres Docker image) rather than swapping the
# server's default postgresql.conf wholesale. This file exists as the single readable reference
# for the intended WAL/PITR policy; keep it in sync if the compose file's flags ever change.
